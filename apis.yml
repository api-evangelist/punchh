- aid: punchh:punchh-mobile-redemptions-v2
  name: Punchh Redemptions 2.0 (New) API - Mobile
  description: 'The Redemptions 2.0 protocol has been designed to replace the legacy Redemptions 1.0 endpoints. The new
    protocol allows for the following features: - Single-scan flow support - Batching of redemptions to occur in a single
    API call - Stacked discounting - Proportional breakdown of discounted items - Item qualifier recycling - Enhance flexibility
    to redemption rules and processing orders The Redemptions 2.0 protocol is not backward compatible with the legacy Redemptions
    1.0 endpoints. Configurations within the Punchh platform are required, so please contact your Punchh representative
    for help be Published by PAR on the mobile section of the PAR developer portal; 4 operations. Certification required.'
