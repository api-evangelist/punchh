aid: punchh
name: Punchh
description: Punchh, now part of PAR Technology and offered under the PAR Engagement brand, is an enterprise loyalty, offers,
  and customer engagement platform for restaurants. It unifies guest data from online ordering, mobile apps, POS, and kiosks
  into a single view so brands can run personalized loyalty and marketing programs. PAR exposes well-documented Punchh APIs
  through its developer portal covering platform functions, mobile, online ordering, POS and kiosk integration, and a webhooks
  manager, with sample collections published to Postman. Most integration surfaces require partner certification. Over 275
  restaurant brands rely on Punchh to grow customer lifetime value.
type: Index
accessModel:
  pricing: enterprise
  onboarding: partner-certification
  trial: false
  try_now: false
  public: false
  label: Enterprise · Partner certification required
  confidence: high
  source:
  - https://developers.partech.com/engagement-tools/par-punchh/
  - plans
  - authentication
  generated: '2026-08-13'
  method: searched
  note: 'Every Punchh API section on the PAR developer portal is badged "Certification REQUIRED". Documentation and the
    15 OpenAPI documents are fully public and anonymous; credentials, base URIs and sandbox access are issued by a PAR representative
    after certification. Corrected from onboarding: self-serve, which was wrong.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/punchh.png
