    its back-end with the Punchh server, the Punchh APIs become instrumental in executing loyalty programs for enrolled
    customers, primarily via business-branded mobile apps and websites tailored by Punchh. To establish integration with
    the Punchh APIs, you need to understand how they are invoked and what responses are returned by the Punchh server. You
    can call APIs using any suitable API test client, such as Postman. Thus, the response to every API call made in Postman
