- aid: punchh:punchh-mobile-subscription
  name: Punchh Subscription API - Mobile
  description: Subscriptions is an add-on Punchh loyalty product that allows businesses to create subscription plans to
    generate up-front revenue and offers benefits in addition to the standard benefits that unsubscribed members of the
    loyalty program receive. The Subscription APIs are designed in a way that businesses can programatically achieve the
    benefits of the subscription for their guest in a mobile app or website. Also, there are aspects that require calling
    the API without any guest authentication (e.g., to control the auto-renewal of the subscription on behalf of the guest).
    Published by PAR on the mobile section of the PAR developer portal; 5 operations. Certification required.
