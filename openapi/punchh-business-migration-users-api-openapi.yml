  /api2/dashboard/migration_users/bulk_bmu_upload:
    post:
      summary: Bulk Upload Business Migration Users
      operationId: post-api2-dashboard-migration_users-bulk_bmu_upload
      responses:
        '200':
          description: OK
      description: 'Allows you to upload a list of business migration users along with their details using a CSV file. See the [Create Business Migration User](/docs/dev-portal-platform-functions/apis/platform-functions-api/paths/~1api2~1dashboard~1migration_users/post) API for details about the user attributes that can be uploaded in the CSV file. <br>These are the maximum values that can be included per user in the business migration user CSV file:

        - Gift card: 15

        - User relations: 6

        - Profile fields: 25

        - Rewards: 15

        - Challenge progress: 15

        - Loyalty card: 10


        Note: This feature is designed for new brands onboarding to Punchh. If the brand is already live with Punchh, this feature will not add significant value to their operations.


        <b>Permission Required</b>


        A user account with the Business Admin role is required.


        <b>Sample CSV File Format</b>


        In the CSV file, the attributes are added in columns, and each row will contain the values for these attributes for each user. The following image shows the format for the CSV file (not all user attributes are shown in this example).


        ```csv

        address_line1,birthday,city,email,first_name,last_name,gender,phone,state,zip_code

        address1,1990-01-01,Mountain View,test1@example.com,first1,last1,male,1111111111,CA,94040

        address2,2000-01-01,Austin,test2@example.com,first2,last2,female,1111111112,TX,77494

        ```

        <b>Bulk Upload Business Migration Users via Punchh Platform</b>


        The bulk upload feature for migrating business users is also available from the Punchh platform. See the "Bulk Business Migration User Upload" section in [Awaiting Migration](https://support.punchh.com/s/article/Awaiting-Migration) on the Punchh Support Portal for more information.


        Note: To view the Punchh product documentation on the Punchh Support Portal, you must log in to a Punchh platform production environment. If you already have access to a production environment, follow the instructions [here](https://support.punchh.com/s/article/How-do-I-access-the-Punchh-Support-Portal-Single-Sign-On) to access the Punchh Support Portal.'
      parameters:
      - $ref: '#/components/parameters/accept'
      - $ref: '#/components/parameters/content-type'
      - $ref: '#/components/parameters/authorization-header'
      tags:
      - Business Migration Users
      x-stoplight:
        id: 70c2fa6b90887
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  x-stoplight:
                    id: fqo9botfghnwv
                  description: Name for the bulk upload request
                bulk_guest_activity_file:
                  type: string
                  x-stoplight:
                    id: 7v232ca2qfj6z
                  description: 'Location of the file that will be used for bulk upload. Punchh supports only the CSV file format with a maximum file size of 15 MB. The bulk upload will fail if the file size exceeds 15 MB. <b>Note</b>: The file location should be passed in either the `import_file_url` parameter or the `bulk_guest_activity_file` parameter. The bulk upload request will fail if the file location is provided in both parameters.'
                import_file_url:
                  type: string
                  x-stoplight:
                    id: z7ff2i582ps4j
                  description: 'URL of the file for bulk upload, publicly hosted on a cloud service like S3. Punchh supports only the CSV file format with a maximum file size of 50 MB. The bulk upload will fail if the file size exceeds 50 MB. <b>Note</b>: The file location should be passed in either the `import_file_url` parameter or the `bulk_guest_activity_file` parameter. The bulk upload request will fail if the file location is provided in both parameters.'
              required:
              - name
            examples:
              Example:
                value:
                  name: bulk-upload-batch1
                  bulk_guest_activity_file: CSV_FILE_PATH_GOES_HERE
                  import_file_url: CSV_FILE_PATH_GOES_HERE
        description: "The requests for this API endpoint are passed using form data, as shown in the following examples.\n\n<b>Sample Request for Bulk Uploading Business Migration Users Using a Local CSV File</b>\n\n```curl\ncurl --request POST \\\n--url https://server_name_goes_here.punchh.com/api2/dashboard/migration_users/bulk_bmu_upload \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer BUSINESS_ADMIN_KEY_GOES_HERE' \\\n--header 'Content-Type: application/json' \\\n--form 'name=\"BMU804\"' \\\n--form 'bulk_guest_activity_file=@\"CSV_FILE_PATH_GOES_HERE\"'\n``` \n<b>Sample Request for Bulk Uploading Business Migration Users Using a CSV File URL</b>\n```curl\ncurl --request POST \\\n--url https://server_name_goes_here.punchh.com/api2/dashboard/migration_users/bulk_bmu_upload \\\n--header 'Accept: application/json' \\\n--header 'Authorization: Bearer BUSINESS_ADMIN_KEY_GOES_HERE' \\\n--header 'Content-Type: application/json' \\\n--form 'name=\"BMU805\"' \\\n--form 'bulk_guest_activity_file=\"CSV_FILE_PATH_GOES_HERE\"'\n```"
components:
  schemas:
    loyalty-cards:
      title: Loyalty Cards (Array Object)
      x-stoplight:
        id: njdpgb4yli57e
      type: array
      description: Details of the loyalty cards migrated for the user
      items:
        x-stoplight:
          id: 6r04rfmx3h83g
        type: object
        properties:
          card_number:
            type: string
            x-stoplight:
              id: aju6sonvqllwe
            description: Unique identifier of the loyalty card associated with the user
          status:
            type: string
            x-stoplight:
              id: 1yb2rg1mynli7
            description: "Status of the loyalty card. These statuses apply only to ZipLine loyalty cards and are null for other loyalty cards. Each loyalty card can have only one status. \n\nA Punchh representative must enable the migration of physical ZipLine loyalty cards for the business. <b>Note</b>: Contact your Punchh representative to update this configuration setting. \n\nPossible values:\n* ACTIVE: The card is active and ready for payment.\n* WAITING_APPROVAL: The user has enrolled or updated their bank information, and ZipLine is awaiting verification of deposit/withdrawal transactions.\n* REJECT: The user’s banking information is invalid, or the entered deposit/withdrawal amounts are incorrect.\n* SUSPENDED: The user has unenrolled, reported a lost/damaged card, or is awaiting a new card.\n* EXPIRED: The user did not verify deposit or withdrawal amounts within 60 days of enrollment or a bank update.\n* PENDING_ENROLLMENT: The user failed identity verification and is on hold for address verification.\n* WAITING_PIN: A temporary PIN has been sent to the user.\n* HOLD: The user may have insufficient funds (NSF) or has exceeded invalid PIN attempts."
          card_signup_date:
            type: string
            x-stoplight:
              id: x0gtealx4p3s2
            description: Date when the loyalty card was issued to the user, in YYYY-MM-DD format
            format: date
            default: YYYY-MM-DD
            examples:
            - '2023-02-03'
