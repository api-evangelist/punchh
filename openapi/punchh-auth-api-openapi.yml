      description: "This API returns the subscriptions attached to a guest's profile. While the response can be filtered based on \"status\" and \"past_subscriptions\", the default response will include subscriptions that are either \"active\" or \"soft_cancelled\" and have their end time in the future.\n  "
      parameters:
      - $ref: '#/components/parameters/Accept_2'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/x-pch-digest'
      - $ref: '#/components/parameters/Authorization'
      - schema:
          type: string
        in: query
        name: filter
        description: '''Filter subscription by status and past_subscriptions.<br><br> If the status is not sent, the API returns subscriptions that are `active`, `soft_cancelled`, and have an end_time that is not in the past. Supported "filter” values are ''''active'''', ''''expired'''', and ''''cancelled''''. <br><br>When the API call is made using the past_subscriptions filter, the response returns only such subscriptions that have their end date/time in the past. The status against each subscription can have the following possible values: ‘expired’, ‘renewed’, ‘soft_cancelled’, and ‘hard_cancelled’.''

          '
      - $ref: '#/components/parameters/Content-Type'
      x-stoplight:
        id: 649a7bc739ad1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: Oauth client ID provided by the business
                authentication_token:
                  type: string
                  x-stoplight:
                    id: 3uvpozny7zpso
                  description: The authentication token of the user. You can retrieve this from the response of a successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
              required:
              - client
            examples:
              default:
                value:
                  client: CLIENT_GOES_HERE
        description: ''
      tags:
      - Auth
    servers:
    - url: https://SERVER_NAME_GOES_HERE.punchh.com
