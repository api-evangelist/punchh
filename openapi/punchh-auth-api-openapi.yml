        description: Signature generated using the request path, body, and OAuth secret provided by the business
        required: true
        name: x-pch-digest
      description: 'Returns subscription cancellation reasons, which are configured in the Punchh platform under Wallet and Passes > Subscription Cancellation Reasons.


