      description: "Evaluates the validity of all inputs and commits the redemption. \n\nPunchh evaluates eligibility during the Possible Redemptions call using the receipt details provided (item name, price, quantity, identifiers, etc.). During the Batch Redemption Process call, Punchh revalidates the same receipt to ensure the qualifying conditions are still met before honoring the redemption. \n\nIf any item attributes change between the two calls, Punchh may be unable to match the qualifying items, which can cause the Batch Redemption Process call to fail or return a different result—even if the Possible Redemptions call was successful.\n\n<b>NOTE: When processing a redemption, DO NOT include the `query` parameter in the API request.</b> Use this parameter only to check for possible redemptions.\n\nAdditional behavior:\n - For orders placed for a future date, the guest’s loyalty account balance is evaluated on the order commit date (sysdate), not on the scheduled pickup or delivery date.\n - Locks the user's discount basket using a unique identifier `external_uid` generated by your application for the transaction when reward locking is enabled in the Punchh platform for the business. Locking the discount basket prevents other channels from creating simultaneous transactions or modifying the discount basket. See [Discount Basket Locking Developer Guide](/docs/dev-portal-developer-resources/d7b83074c9f23-redemptions-2-0-discount-basket-locking). You must log in to the developer portal to access the developer guide.\n\nWhen the Batch Redemption Process API commits the redemption, one of the following actions may occur based on the discount type:\n - Loyalty points are deducted from the guest account when `discount_type` = \"redeemable\" or \"card_completion\"\n - The reward is debited from the guest account when `discount_type` = \"reward\"\n - Banked rewards / currency are deducted from the guest’s loyalty account when `discount_type` = \"discount_amount\""
      summary: Batch Redemption Process (Redemptions 2.0)
      operationId: sso_create_online_redemption
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/content_type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/accept_language'
      x-stoplight:
        id: 6031cbeb5bec2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: boolean
                  description: Include this parameter only if you want to make a possible redemptions call. The parameter value must be true. If you want to process a redemption, do not include this parameter in the request.
                store_number:
                  type: integer
                  description: Unique identifier for store location
                client:
                  type: string
                  description: Client key of the business
                line_items:
                  $ref: '#/components/schemas/line_items'
                receipt_datetime:
                  type: string
                  description: Timestamp of receipt per ISO 8601 format, including TZ offset from UTC (YYYY-MM-DDThh:mm:ss-±hh:mm)
                  format: date-time
                subtotal_amount:
                  type: number
                  format: float
                  description: Order amount before taxes (sum of all item amounts minus any discounts). Same as `receipt_amount`. For historical reasons, include this parameter along with `receipt_amount` in the API request.
                receipt_amount:
                  type: number
                  format: float
                  description: Order amount before taxes, calculated as the sum of all item amounts minus any discounts. This is the amount used to calculate loyalty points/visits. The value of this parameter should match `subtotal_amount`. For example, if the order amount is $10, both `receipt_amount` and `subtotal_amount` will be 10. If a $2 discount is applied, both will be 8.
                transaction_no:
                  type: string
                  description: Transaction number
                external_uid:
                  type: string
                  x-stoplight:
                    id: x2lb8yfixy7a4
                  description: 'Unique identifier generated by the system to lock the discount basket and prevent duplicate transactions. This parameter is required when reward locking is enabled for the business in the Punchh platform. <b>Note</b>: Contact your Punchh representative to update this configuration.'
              required:
              - store_number
              - client
              - line_items
              - receipt_datetime
              - subtotal_amount
              - receipt_amount
            examples:
              Possible Redemption:
                value:
                  query: true
                  store_number: 900
                  client: CLIENT_GOES_HERE
                  line_items:
                  - item_name: coffee
                    item_qty: 1
                    amount: 10
                    item_type: M
                    item_id: 330
                    item_family: '10'
                    item_group: gp
                    serial_number: 1
                  - item_name: pizza
                    item_qty: 1
                    amount: 20
                    item_type: M
                    item_id: 331
                    item_family: '10'
                    item_group: gp
                    serial_number: 2
                  receipt_datetime: '2019-04-11T14:14:07+05:30'
                  subtotal_amount: 100
                  receipt_amount: 100
                  transaction_no: '11111111111'
                  external_uid: EXTERNAL_UID_GOES_HERE
              Process Redemption:
                value:
                  store_number: 900
                  client: CLIENT_GOES_HERE
                  line_items:
                  - item_name: coffee
                    item_qty: 1
