                    disapproved: false
                    level: null
                    event_details: null
                    store_number: ''
                    event_expiry: '2019-06-26'
                  - date: '2019-05-18T08:12:57Z'
                    title: Points Earned
                    channel: POS
                    event_name: Checkin
                    event_value: +13 points
                    external_uid: ''
                    description: 13 points earned for your $12.86 purchase at Adrian
                    sub_value: null
