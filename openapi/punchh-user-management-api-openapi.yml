                    facebook_signup: false
                    communicable_email: test@example.com
                    access_token: null
        '400':
          description: ''
      summary: Change Password
      operationId: sso_change_password
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/content_type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - schema:
          type: string
          default: Bearer ACCESS_TOKEN_GOES_HERE
        in: header
        name: Authorization
        description: You may pass access_token instead of authentication_token in the Authorization header. It will be passed as a bearer token. If the reset_password_token parameter is included in the request body, an Authorization header is not needed.
      description: Changes the user's password without using the current password
      tags:
      - User Management
      x-stoplight:
        id: 08d53a1922d23
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    password:
                      type: string
                      description: New password of the user
                    password_confirmation:
                      type: string
                      description: Confirm the new password of the user
                  required:
                  - password
                client:
                  type: string
                  description: Client key of the business
                authentication_token:
                  type: string
                  description: The authentication token of the user. You can retrieve this from the response of a successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
                reset_password_token:
                  type: string
                  description: The user's reset password token. Required if the access_token is not passed via the Authorization header or the authentication_token parameter is not included in the request body. If the reset_password_token parameter is included in the request body, an Authorization header is not needed.
              required:
              - client
            examples:
              default:
                value:
                  user:
                    password: PASSWORD_GOES_HERE
                    password_confirmation: PASSWORD_GOES_HERE
                  client: CLIENT_GOES_HERE
                  authentication_token: AUTHENTICATION_TOKEN_GOES_HERE
  /api/auth/user_enrollments:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                default:
                  value:
                  - Successfully registered
        '400':
          description: ''
      summary: User Enrollment
      description: Enrolls a user in a campaign (currently supported for social cause campaigns)
      operationId: sso_user_enrollment
      parameters:
      - $ref: '#/components/parameters/Signature'
      - schema:
          type: string
          default: no-cache
        in: header
        name: cache-control
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/content_type'
      tags:
      - User Management
      x-stoplight:
        id: 6da2a2909eae2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: Client key of the business
                  default: CLIENT_GOES_HERE
                authentication_token:
                  type: string
                  description: The authentication token of the user. You can retrieve this from the response of a successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
                item_id:
                  type: integer
                  description: ID of the campaign in which the user will be enrolled
                  default: 1
                  format: int32
                item_type:
                  type: string
                  description: Type of the campaign in which the user will be enrolled. The currently supported type is `social_cause_campaign`.
                  default: social_cause_campaign
                  enum:
                  - social_cause_campaign
              required:
              - client
              - item_id
              - item_type
            examples:
              default:
                value:
                  client: CLIENT_GOES_HERE
                  authentication_token: AUTHENTICATION_TOKEN_GOES_HERE
                  item_id: 1
                  item_type: social_cause_campaign
    delete:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                default:
                  value:
                  - Successfully deregistered
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ? ''
                  : type: string
        '400':
          description: ''
      summary: User Disenrollment
      description: Disenrolls a user from a campaign (currently supported for social cause campaigns)
      operationId: sso_user_disenrollment
      parameters:
      - $ref: '#/components/parameters/Signature'
      - schema:
          type: string
          default: no-cache
        in: header
        name: cache-control
      - $ref: '#/components/parameters/content_type'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Accept'
      tags:
      - User Management
      x-stoplight:
        id: f79a7ffc641d7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: Client key of the business
                  default: CLIENT_GOES_HERE
                authentication_token:
                  type: string
                  description: The authentication token of the user. You can retrieve this from the response of a successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
                item_id:
                  type: integer
                  description: ID of the campaign in which the user will be enrolled
                  default: 1
                  format: int32
                item_type:
                  type: string
                  description: Type of the campaign in which the user will be enrolled. The currently supported type is `social_cause_campaign`.
                  default: social_cause_campaign
                  enum:
                  - social_cause_campaign
              required:
              - client
              - item_id
              - item_type
            examples:
              default:
                value:
                  client: CLIENT_GOES_HERE
                  authentication_token: AUTHENTICATION_TOKEN_GOES_HERE
                  item_id: 1
                  item_type: social_cause_campaign
