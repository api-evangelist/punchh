                    age_verified: true
                    privacy_policy: true
                    gender: female
                    last_name: LAST_NAME_GOES_HERE
                    state: Ohio
                    zip_code: '43016'
                    allow_multiple: true
                    favourite_locations: ''
                    marketing_email_subscription: true
                    marketing_pn_subscription: true
                    profile_field_answers:
                      upf0: Coffee|Tea|Lemonade
                      upf1: Pasta|Pizza|Hamburger
                      upf2: Movies|Music|Sports
                    secondary_email: test@example.com
                    terms_and_conditions: true
                    title: ''
                    user_relations:
                    - relation: spouse
                      name: SPOUSE_NAME_GOES_HERE
                      birthday: '1999-01-01'
                    work_zip_code: ''
                    preferred_locale: ''
                    phone: '1111111111'
                    unsubscribed: true
                    allow_push_notifications: true
                    apn_token: APN_TOKEN_GOES_HERE
                    gcm_token: GCM_TOKEN_GOES_HERE
