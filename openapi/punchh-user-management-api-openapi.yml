                    event_expiry: '2019-06-26T06:59:59Z'
                  - date: '2019-05-27T15:24:52Z'
                    title: Item Gifted
                    channel: null
                    event_name: Reward
                    event_value: +Item
                    external_uid: null
                    description: 'You were gifted: BOGO Cookie for customers who buy cookies 50% of the time (Expired)'
                    sub_value: null
                    bar_column1: 'Points: 820'
                    bar_column2: null
                    bar_column3: 'Items: 0'
                    points: 820
                    visits: null
                    rewards: 0
                    items: 0
                    pending_refresh: false
                    expired: true
                    disapproved: false
                    level: null
                    event_details: null
                    store_number: null
                    event_expiry: '2019-06-26T06:59:59Z'
                  - date: '2019-05-18T08:20:00Z'
                    title: Points Earned
                    channel: POS
                    event_name: Checkin
                    event_value: +13 points
                    external_uid: ''
                    description: 13 points earned for your $12.86 purchase at Adrian
                    sub_value: null
                    bar_column1: 'Points: 820'
