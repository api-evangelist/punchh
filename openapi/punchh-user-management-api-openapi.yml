openapi: 3.2.0
info:
  title: Online Ordering and SSO User Management API
  version: '1.0'
  description: "The Punchh SSO API endpoints provide user-management functions such as login, registration, forgot password, and connect with Facebook for users on the Punchh loyalty platform. You can also fetch user-specific information such as rewards or point balances. \n\nThe Punchh Online Ordering API endpoints enable users to earn and redeem rewards for online orders."
  contact:
    name: Punchh Dev Support
    url: https://developers.punchh.com
servers:
- url: https://SERVER_NAME_GOES_HERE.punchh.com
tags:
- name: User Management
paths:
  /api/auth/users/forgot_password:
    post:
      responses:
        '200':
          description: Blank Response.
          content:
            application/json:
              schema: {}
              examples:
                default:
                  value: Blank Response
        '412':
          description: ' Sending invalid Signature'
        '422':
          description: Sending invalid Entity
      summary: Forgot Password
      description: Triggers the forgot password email sent to the user's email address containing the password reset link.
      operationId: sso_forgot_password
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/content_type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      tags:
      - User Management
      x-stoplight:
        id: 6e9f023450f46
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      description: Email address of the user
                  required:
                  - email
                client:
                  type: string
                  description: Client key of the business
              required:
              - client
            examples:
              default:
                value:
                  user:
                    email: test@example.com
                  client: CLIENT_GOES_HERE
  /api/auth/users:
    get:
      responses:
