                    external_source: customer_id
                    external_source_id: '11111111111111111111'
        description: ''
  /api/auth/accounts:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      enum:
                      - YYYY-MM-DDThh:mm:ssZ
                      format: date-time
                      description: Date/time when the event was created in the system, in ISO 8601 format
                    title:
                      type: string
                      description: Event title
                    event_name:
                      type: string
                      description: Event name (e.g., Checkin, Redemption, etc.)
                    event_value:
                      type: string
                      description: Event value (e.g., Visit, Point, or Item)
                    description:
                      type: string
                      description: Reason for the event
                    sub_value:
                      type: string
                      description: Sub-value of the event
                      x-nullable: true
                    bar_column1:
                      type: string
                      description: Points details
                    bar_column2:
                      type: string
                      description: Visit details
                      x-nullable: true
                    bar_column3:
                      type: string
                      description: Item details
                    points:
                      type: integer
                      description: Total number of points that were redeemed
                    visits:
                      type: integer
                      description: Total number of visits that were redeemed
                      x-nullable: true
                    rewards:
                      type: number
                      format: double
                      description: Total number of rewards that were redeemed
                    items:
                      type: integer
                      description: Total number of items that were redeemed
                    pending_refresh:
                      type: boolean
                      description: If the event is related to a check-in, whether the check-in is pending refresh or not
                    expired:
                      type: boolean
                      description: Whether the event has expired or not
                    disapproved:
                      type: boolean
                      description: Whether the event is disapproved or not
                    level:
                      type: string
                      description: Membership level at the time of the event
                    event_details:
                      type: object
                      description: Details of the event
                    store_number:
                      type: string
                      description: Store number or other external identifier set on the location
                    event_expiry:
                      type: string
                      enum:
                      - YYYY-MM-DDThh:mm:ssZ
                      format: date-time
                      description: Expiry date of the event as configured in the Punchh platform
                    channel:
                      type: string
                      description: Channel where the event took place (e.g., POS)
                    external_uid:
                      type: string
                      description: External UID received at the time of check-in
              examples:
                default:
