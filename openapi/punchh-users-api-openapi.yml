        id: 56ecbfacce14e
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: Unique ID of the user to whom you want to send the message. This is a unique ID assigned to the user by Punchh.
                subject:
                  type: string
                  description: Subject of the message that you want to send to the user. If no value is provided, the default system value will be picked.
                message:
                  type: string
                  description: The message that will be sent to the user. Messaging is optional. You can send either a message only or a gift only. However, at least one of the two should be sent.
                gift_reason:
                  type: string
                  description: The reason these points, visits, or rewards are being gifted to the user. If no value is provided, the default system value of "Support Activity" will be provided.
                gift_count:
                  type: integer
                  description: In a points-based business, the gift count is the number of points that will be gifted to guests. In a visit-based business, it is the number of visits that will be gifted. Gifting is optional. You can send either a message only or a gift only. However, at least one of the two should be sent.
                reward_amount:
                  type: integer
                  description: Currency amount that will be gifted to the user. Gifting is optional. You can send either a message only or a gift only. However, at least one of the two should be sent.
                redeemable_id:
                  type: integer
                  description: Unique ID of the redeemable that you want to gift to the user. Gifting is optional. You can send either a message only or a gift only. However, at least one of the two should be sent.
                end_date:
                  type: string
                  format: date
                  description: The date on which you want the gifted redeemable to expire. If this date is provided and there is an expiry configured on the redeemable, it will expire on the earlier date.
                fuel_amount:
                  type: number
                  description: Fuel amount that you want to gift to the user
                location_id:
                  type: integer
