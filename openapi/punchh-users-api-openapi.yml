                  description: Optional boolean parameter. When set to true, all device IDs linked to the banned user are blocked. This prevents future logins from those devices. If anyone, including the banned user under a new account, attempts to log in from a blocked device, the [login API](https://developers.partech.com/docs/dev-portal-mobile/apis/mobile-api/tag/users/post/api2/mobile/users/login) (/api2/mobile/users/login) returns a 422 response with a customizable "Device Banned" message.
