  /api2/mobile/users/account_history:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel:
                      type: string
                      enum:
                      - OnlineOrder
                      - POS
                      - Web
                      - Mobile
                      - Dashboard
                      description: 'Identifies the source of a "Checkin" or "Redemption" event type. For example, "Mobile" in the case of a "Checkin" event indicates that the check-in was done by a user using the mobile app of the business. Possible values of the `channel` request parameter are:

                        - OnlineOrder

                        - POS

                        - Web

                        - Mobile

                        - Dashboard'
                    date:
                      type: string
                      enum:
                      - YYYY-MM-DD
                      format: date
                      description: Date/time when the event was created in the system, in [ISO 8601](http://en.wikipedia.org/wiki/ISO_8601) format
                    description:
                      type: string
                      description: A brief description of the event
                    total_spend:
                      type: string
                      description: Amount that the user spent on the order. Will be returned if the event type is "Checkin".
                    disapproved:
                      type: boolean
                      description: A particular event may be disapproved by the system or an admin for some reason. In this case, a value of true will be returned. Currently, only check-ins may be disapproved.
                    event_details:
                      $ref: '#/components/schemas/Event-details-object'
                    event_value:
                      type: string
                      enum:
                      - Reward
                      - Checkin
                      - Redemption
                      - RewardCredit
                      description: 'Value according to the event.


                        - Checkin: Number of points/visits earned (e.g., "+20 points")

