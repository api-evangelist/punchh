  /api2/mobile/users/points_expiry_timeline:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  points_expiry:
                    type: array
                    description: 'The API returns in the points_expiry array object all future dates on which points are scheduled to expire when the status parameter is set to expired in the request. The values are shown in the `expiring_points` and `expired_at` response parameters. When the request contains the `lookback_period` parameter, the API returns the points expired in the last 30 days in the `expired_points` and `expired_at` response parameters. '
                    items:
                      type: object
                      properties:
                        expiring_points:
                          type: integer
                          description: Number of points scheduled to expire on a date specified by the `expiring_at` parameter. This value is 0 (zero) if the user has already redeemed points for the corresponding time period.
                        expiring_at:
                          type: string
                          description: Future date when points are due to expire, in ISO 8601 format
                          format: date
                        expired_points:
                          type: integer
                          description: Number of points that have already expired at some past timestamp (i.e., the value of the `expired_at` parameter)
                        expired_at:
                          type: string
                          format: date
                          description: Date when points expired
                          examples:
                          - '2023-05-20'
              examples:
                User's expiring points:
                  value:
                    points_expiry:
                    - expiring_points: 1305
                      expiring_at: '2024-05-11'
                    - expiring_points: 1102
                      expiring_at: '2024-09-27'
                    - expiring_points: 403
                      expiring_at: '2025-03-12'
                User's expired points in the last 30 days:
                  value:
                    points_expiry:
                    - expired_at: '2023-07-23'
                      expired_points: 500
        '422':
          description: Unprocessable Entity - Feature is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    x-stoplight:
                      id: r86nyjhpr5qb7
                    properties:
                      error_name:
                        type: string
                        x-stoplight:
                          id: viqxhmn2ukev8
              examples:
                Feature is disabled:
                  value:
                    errors:
                      disabled_feature: Your current loyalty program configuration does not support this feature. Please connect with your Customer Success representative for resolution of the issue.
      summary: Fetch Rolling Points Expiry
      description: 'Enables a business to display the number of points that are expiring each month for users in the mobile app. The API returns all future dates on which points are scheduled to expire.


        <b>Prerequisite</b>


        To make API calls, the backend flag "track_reward_banked_points" and the "Expires After" (unredeemed point expiry) option in the Punchh platform must be enabled for the business. If one or both are disabled in Punchh for your business, the API will return an error with this message: "Your current loyalty program configuration does not support this feature. Please connect with your Customer Success representative for resolution of the issue."

        <!--Cockpit > Earnings > Checkin Expiry > Expires After-->


        Note: This API is currently supported for "points convert to rewards" and "points unlock redeemables" loyalty programs.


        The `status` and `lookback_period` parameters are applicable to only the "points unlock redeemables" program. Currently, `status` supports a value of "expired", and `lookback_period` supports a value of "30" days. Businesses can use the parameters to fetch all check-ins / related points for users that have expired in the last 30 days.'
      operationId: rolling_points_expiry
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - $ref: '#/components/parameters/Accept-Language'
      tags:
      - Users
      x-stoplight:
        id: 44f5841c77d4d
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                  examples:
                  - CLIENT_GOES_HERE
                status:
                  type: string
                  description: Filter for check-in status. The value supported for this parameter is "expired".
                lookback_period:
                  type: integer
                  description: Past duration, in days, for which the API returns the expired points for the user. The value supported for this parameter is 30.
                  default: 30
              required:
              - client
            examples:
              Request to fetch user's expiring points:
                value:
                  client: CLIENT_GOES_HERE
              Request to fetch user's expired points:
                value:
                  client: CLIENT_GOES_HERE
                  status: expired
                  lookback_period: 30
        description: ''
    servers:
    - url: https://SERVER_NAME_GOES_HERE.punchh.com
