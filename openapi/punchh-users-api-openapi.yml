  /api2/mobile/users/request_reactivation:
    post:
      summary: Reactivate User Profile
      operationId: post-api2-mobile-users-request_reactivation
      responses:
        '200':
          description: '200 OK. On submitting the request, the API returns this message in the response: "Please check your email for instructions on reactivating your account". '
          headers: {}
        '422':
          description: Unprocessable Entity - Resending reactivation request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    x-stoplight:
                      id: 3wt5hao3ulkiz
              examples:
                Resending reactivation request:
                  value:
                    error: There is already an ongoing request
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/Accept'
      description: "Enables users to reactivate their deactivated profiles directly from the mobile app if 1) guests are allowed to raise reactivation requests via mobile app and iFrame <!--Cockpit > Guests > Guest Reactivation--> and 2) the admin indicates that a user profile is eligible for future activation when deactivating the user profile in the Punchh platform. \n\nThe API returns a 200 response and sends a reactivation email with the subject line \"Reactivate account instructions\" to the user. The email message will contain instructions on how to proceed with the reactivation process and a link to complete the reactivation request. When the user clicks the link, a message is sent to the Punchh server for account reactivation. A message is displayed to the user stating \"Your reactivation request has been received successfully. Please check the status in the next 24-48 hours.\"\n\nIf the phone number of the user is used for reactivation on the mobile app (applicable only when the phone number sign-up feature is enabled for the business), the user is prompted to enter the OTP (One-Time Password) sent to the user's phone number. After the user submits the OTP, the request for reactivating the user account is sent to the Punchh server. The sign-up feature can be enabled in the Punchh platform for new businesses. <!--Cockpit > Dashboard > Major Features > Enable Sign up via Phone Number-->\n\nIf email alerts are enabled for admins for all reactivation requests <!--Cockpit > Guests > Guest Reactivation--> and if at least one admin is selected, the admin will receive email alerts for each reactivation request raised by users. \n\nThe <b>Guests > Reactivation Requested</b> tab in the Punchh platform lists all pending requests for account reactivation. The business can manually approve all reactivation requests made through the mobile app via the Punchh platform or opt for automatic approval.\n\nNote: Contact your Punchh representative to update these Punchh platform configurations. "
      tags:
      - Users
      x-stoplight:
        id: 5f81f5f1ee065
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  x-stoplight:
                    id: elwmkxmz2d25l
                  description: OAuth client ID provided by the business
                email:
                  type: string
                  x-stoplight:
                    id: qwqdd64irk36h
                  description: Email address of the user that was used for creating the loyalty account
                phone:
                  type: string
                  x-stoplight:
                    id: 0vfijoru2ru87
                  description: Phone number of the user that was used for creating the loyalty account (applicable only when the phone number sign-up feature is enabled for the business)
              required:
              - client
              - email
            examples:
              Example:
                value:
                  client: CLIENT_GOES_HERE
                  email: test@example.com
        description: ''
    servers:
    - url: https://SERVER_NAME_GOES_HERE.punchh.com
