                  messages that can be sent to the mobile client in advance, and they appear in the app
                  later when the launch time comes.


                  If a rich message is triggered from a campaign, from a notification template as a result
                  of user action, as a result of test notification, or if the Launch Time and Take Down
                  Time fields are left blank in a business announcement, the values for launch_time and
                  take_down_time will be null.'
              message_type:
                type: string
                description: 'There are two types of rich messages returned in response:

                  1. user_specific: Rich messages that have a user context. These include rich messages
                  created based on campaigns or user actions.

                  2. business_wide: Rich messages that are created as business announcements in the system.'
              rank:
                type: integer
                description: Every message should have a rank. This marks the importance of a message.
                  There may be a case when a more important message moves down the display list in the
                  app as new messages are delivered to the mobile client. To keep important messages at
                  the top of the display list, they should be given a higher number just as is the case
                  with z-index. If two messages have the same rank, the app will determine the display
                  order based on the launch_time.
              style_url:
                type: string
                description: 'Link to the style sheet file for the style that will be applied to the message.
                  The mobile client can download the style file, which can then be used to render the
                  rich message in the app.

                  '
              subtitle:
                type: string
                description: 'A subordinate title providing additional information about the content

                  '
              tags:
                type: array
                description: 'Tags provide additional details about a message. A simple example could
                  be the type (such as campaign, system_notification, etc.) that may help the app make
                  decisions about the rendering of the message.

                  '
                items:
                  type: string
              take_down_time:
                type: string
                description: 'Date/time, in ISO 8601 format, when the mobile client should stop rendering
                  the rich message in the app.


                  If a rich message is triggered from a campaign, from a notification template as a result
                  of user action, as a result of test notification, or if the Launch Time and Take Down
                  Time fields are left blank in a business announcement, the values for launch_time and
                  take_down_time will be null.'
              title:
                type: string
                description: 'A suitable title for the rich message. A well-crafted title increases the
                  chances that a user will view a message.

                  '
              message_id:
                type: integer
                description: 'Unique ID of the message sent to the user

