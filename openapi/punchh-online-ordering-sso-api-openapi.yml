                  value:
                    error: invalid_grant
                    error_description: The provided authorization grant is invalid, expired, revoked,
                      does not match the redirection URI used in the authorization request, or was issued
                      to another client.
                Missing client parameter or client value is incorrect:
                  value:
                    error: invalid_client
                    error_description: Client authentication failed due to unknown client, no client authentication
                      included, or unsupported authentication method.
                Missing redirect URI or redirect URI is incorrect:
                  value:
                    error: invalid_request
                    error_description: The request is missing a required parameter, includes an unsupported
                      parameter value, or is otherwise malformed.
      summary: Get SSO Token
      description: 'Retrieves a client instance-level access token from your redirect URI after a successful
        user login through the Punchh-hosted authentication form. After you retrieve the client-level
        access token from this endpoint, supply it to the [Fetch User Information](/docs/dev-portal-online-ordering/b3A6NTAyODQ5NzA-fetch-user-information)
        API to retrieve a user-level authentication or access token. You can then use that user-level
        token to authenticate API calls for the remainder of the user''s session.


        **Note:** This endpoint is the second step in a multi-step authorization process. For more information,
        see [SSO Flow for Web and Mobile](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile#step-2).'
      operationId: oauth_token
