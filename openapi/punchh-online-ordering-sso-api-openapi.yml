        call to the API:


        * Google sign-in must be enabled. <!-- Cockpit > Guests > Miscellaneous Config -->

        * Google web client ID, Google iOS client ID / Google Andriod client ID, and Google web client
        secret must be specified. <!-- Whitelabel > Services > Google Sign-in -->


        Contact your Punchh representative to update these configurations.'
