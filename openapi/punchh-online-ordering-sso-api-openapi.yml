      summary: Create Loyalty Check-in
      description: Creates a loyalty check-in for an online order against a given receipt. Requires menu
        items and parameters to be sent.
      operationId: sso_loyalty_checkin
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/content type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/Authorization'
      tags:
      - Check-in
      x-stoplight:
        id: f1943957e38b4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authentication_token:
                  type: string
                  description: The authentication token of the user. You can retrieve this from the response
                    of a successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
                cc_last4:
                  type: string
                  description: Last 4 digits of credit card number
                employee_id:
                  type: string
                  description: ID of the employee who took the order. In case of a system order, it can
                    be a system-generated ID.
                employee_name:
                  type: string
                  description: Name of the employee who took the order. In case of a system order, it
                    can be the name of the system.
                store_number:
                  type: string
                  description: The location where the check-in occurred, as configured in the Punchh platform
                    via Store Locations > All Store Locations. This is generally provided by the business.
                menu_items:
                  $ref: '#/components/schemas/menu_items'
                receipt_amount:
                  type: number
                  format: double
                  description: Order amount before taxes, calculated as the sum of all item amounts minus
                    any discounts. This is the amount used to calculate loyalty points/visits. The value
                    of this parameter should match `subtotal_amount`. For example, if the order amount
                    is $10, both `receipt_amount` and `subtotal_amount` will be 10. If a $2 discount is
                    applied, both will be 8.
                subtotal_amount:
                  type: number
                  format: double
                  description: Order amount before taxes (sum of all item amounts minus any discounts).
                    Same as `receipt_amount`. For historical reasons, include this parameter along with
                    `receipt_amount` in the API request.
                receipt_datetime:
                  type: string
                  description: Timestamp of the receipt as per [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601),
                    in YYYY-MM-DDThh:mm:ssZ format
                transaction_no:
                  type: string
                  description: Receipt number or transaction number on the receipt. In case of redemption
                    associated with the order, the same transaction number must be sent for both check-ins
                    and redemptions.
                external_uid:
                  type: string
                  description: Unique ID generated by your system. We use this to prevent duplicates in
                    case the same transaction gets triggered twice.
                client:
                  type: string
                  description: Client key of the business
                channel:
                  type: string
                  enum:
                  - pos
                  - web
                  - online_order
                  - mobile
                  - dashboard
                  - chatbot
                  - kiosk
                  description: 'Channel through which the check-in was requested. Possible values are:
                    `online_order`, `pos`,`web`, `mobile`, `dashboard`, `chatbot`, `kiosk`.'
                payable:
                  type: string
                  description: Amount paid after applying discounts and adding any taxes or service charges.
                    For example, if the order amount is $10, the values of the `receipt_amount` and `subtotal_amount`
                    parameters will be $10. If a $2 discount is applied, `subtotal_amount` becomes $8.
                    However, if there are $3 service charges and $1 tax, the value of the `payable` parameter
                    becomes $12 (10 – 2 + 3 + 1 = 12).
                revenue_id:
                  type: string
                  description: 'ID of the online ordering function that designates order fulfillment method.
                    Example: 1 for dine-in, 2 for to-go/take out, 3 for call-in pickup, 4 for call-in
                    deliver, etc. Some vendors call this revenue center, order method, order mode, etc.
                    The values assigned here should represent the way the order is fulfilled for the customer,
                    not the area in the restaurant where the order is placed (e.g., not bar, patio, dining
                    room, etc.).'
                revenue_code:
                  type: string
                  description: Name of the online ordering function that designates order fulfillment
                    method (e.g., to-go/take out, call-in pickup, call-in deliver, etc.). Some online
                    ordering systems call this Revenue Center, Order Method, Order Mode, etc. The values
                    assigned here should represent the way the order is fulfilled for the customer, not
                    the area in the restaurant where the order is placed (e.g., not bar, patio, dining
                    room, etc.).
                state:
                  type: string
                  description: 'The current state of the check-in. Possible values are: `committed`, `pending`
                    or `void` (required in case of leveraging pending points via explicit API option).'
              required:
              - store_number
              - receipt_amount
              - subtotal_amount
              - receipt_datetime
              - transaction_no
              - external_uid
              - client
              - payable
            examples:
              Request:
                value: "{\n\"authentication_token:AUTHENTICATION_TOKEN_GOES_HERE\"\n\"receipt_amount\"\
                  :7.86,\n\"cc_last4\":4387,\n\"employee_id\":7,\n\"employee_name\":\"EMPLOYEE_NAME_GOES_HERE\"\
