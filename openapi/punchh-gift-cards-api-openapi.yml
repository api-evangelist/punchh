                  client: CLIENT_GOES_HERE
                  name: My first card
                  preferred: true
                  auto_reload_enabled: true
                  threshold_amount: 50
                  default_amount: 50
                  payment_card_id: PAYMENT_CARD_UUID_GOES_HERE
