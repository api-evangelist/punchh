                      description: Cover image of a subscription plan uploaded at the time of subscription plan creation
                      examples:
                      - test-image.png
                    subscriber_capping:
                      type: number
                      description: Maximum number of unique active subscribers for a plan. If the number of active subscribers reaches this limit, fresh purchases in that plan will be stopped.
