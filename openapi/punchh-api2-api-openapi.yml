          minimum: 1
        unit_discount:
          type: number
          x-stoplight:
            id: k2cfku19gv7ee
          description: Discount to be applied to the rate of the selected items chosen for the offer or promotion. The discount is based on a specific rate (e.g., per unit of item - per gallon, per liter, etc.). For example, for a fuel discount of 20 cents per gallon, you need to specify the discount in a decimal format (0.2) to reflect a 20-cent reduction for each gallon of fuel. If the qualification criteria are attached to a subscription plan, the value of the unit discount will be picked up from the subscription plan, and even though you are required to enter a value for the discount (e.g., 0.2 for 20 cents), <b>this value will be ignored</b> if the qualification criteria are part of a subscription plan, because the discount will be controlled by the subscription plan's settings instead. The value should be greater than or equal to 0.01 and less than or equal to 99999 if the processing method (`qc_processing_function`) is rate_rollback. A value is required to be sent in the parameter depending on the processing function selected.
          format: float
          maximum: 99999
          minimum: 0.01
        minimum_unit_rate:
          type: number
          x-stoplight:
            id: p5an5geaz0kka
          description: Minimum unit price threshold. After applying the discount, the minimum unit rate should not be below this amount.  A value greater than or equal to 0.01 and less than or equal to 99999 is required if the processing method (`qc_processing_function`) is rate_rollback.
          minimum: 0.01
          maximum: 99999
        target_price:
          type: integer
