                                    end_time:
                                      type: string
                                      format: date-time
                                      x-nullable: true
                                      description: 'The end date/time after which this discount expires. A null value means no specific end time constraint — the discount remains valid until the subscription ends. Note: This parameter is returned when enabled for the business. Contact your Punchh representative to update this platform configuration.'
