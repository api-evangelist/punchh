    qc_item_qualifiers_input:
      title: QC Input - Item Qualifiers (Array Object)
      x-stoplight:
        id: 0ndlcqae60ta6
      type: array
      description: 'Lists the items that must be present on the check to meet the qualification criteria. The processing function is triggered only if the receipt satisfies all of the conditions specified in the object’s attributes.


        <b>Note: When updating item qualifiers, do not pass this object in the request if you do not want to update `item_qualifiers`. If an empty array object [] is provided, all previously created item qualifiers will be deleted.</b>

        '
      items:
        x-stoplight:
          id: 00actsh3la2si
        type: object
        properties:
          line_item_selector_id:
            type: string
            x-stoplight:
              id: 4mde2pc3va6oh
            description: 'ID of the pre-existing LIS, which for now will be the external_id. Note: If the line item selector ID is invalid, the system will skip that line item filter and create the qualification criteria with valid LIS IDs.'
          expression_type:
            type: string
            x-stoplight:
              id: pjstvek2o5biq
            description: 'List of predefined functions that define various conditions under which a receipt is eligible for further processing. These conditions evaluate whether the receipt meets certain requirements before triggering the processing function. The system will skip the item if the expression type is not a valid value. Possible values include:

              * line_item_does_not_exist: The specified line item must NOT be present on the receipt.

              * line_item_exists (default): The specified line item must be present on the receipt.

              * net_amount_excluding_min_priced_item_equal_to_or_more_than: The total net amount on the receipt, excluding the lowest-priced item, must be equal to or greater than the specified amount.

              * net_amount_excluding_max_priced_item_equal_to_or_more_than: The total net amount on the receipt, excluding the highest-priced item, must be equal to or greater than the specified amount.

              * net_quantity_greater_than_or_equal_to: The total quantity of the specified item(s) must be equal to or greater than the specified value.

              * net_amount_greater_than_or_equal_to: The total net amount on the receipt must be equal to or greater than the specified amount.

              * net_quantity_equal_to: The total quantity of the specified item(s) must be exactly equal to the specified value.'
          net_value:
            type: number
            x-stoplight:
              id: d68bi9o1cvp14
            description: Specifies the required numeric threshold (such as quantity or amount) that the receipt must meet for certain `expression_type` conditions. `net_value` is an additional parameter that depends on the selected `expression_type`. It must be an integer and greater than zero. However, if the `expression_type` is set to either "line_item_exists" or "line_item_does_not_exist", the `net_value` will be ignored and treated as null, even if a value is provided.
