      description: "Allows a business to update one or more Line Item Selectors. You can bulk update a maximum of 20 line item selectors per API call. If the request input contains more than 20 LIS, only the first 20 are created, and the remaining are ignored.\n\nFor more information, see [Offers Ingestion Management](/docs/dev-portal-platform-functions/ms8qid5tdtvc6-offers-ingestion-management)\n\n#### Update Rules for Filter Item Set in LIS\n\n1\\. All clauses of the defined filter item set are updated in the update request. If the filter item set is \"Only Base\", you must provide the entire set of clauses for the \"Base\" to update the LIS.\n\n2\\. If the filter item set is \"Base and Modifiers\", you can send either the base clause or the modifier clause in the update request. The LIS is updated based on the received clause.\nFor example: In the \"Base and Modifiers\" filter item set, if the user sends a request with a modifier clause, the existing modifier will be updated while the base remains in its original configuration.\n\n3\\. The same validation rules applied during LIS creation are followed. If the LIS is created with \"Only Modifiers\", you must provide both base and modifier clauses as per the system design. However, while updating, the user can send only the modifier clause or only the base clause to update the LIS definition.\n\nAn index has been added to the business_id and external_id columns because the LIS is fetched by business_id and external_id.\n\nTo call this API, the offers ingestion option must be enabled for the business on the Punchh platform. Contact your Punchh representative to update this Punchh platform configuration.\n<!--Cockpit > Dashboard > Miscellaneous Config > Enable Offers Ingestion-->\n\nFor more information on line item selector (LIS) settings, see the [Line Item Selectors](https://support.punchh.com/s/article/Line-Item-Selectors) article on the Support Portal. \n\nNote: To view the Punchh product documentation on the Punchh Support Portal, you must log in to a Punchh platform production environment. If you already have access to a production environment, follow the instructions [here](https://support.punchh.com/s/article/How-do-I-access-the-Punchh-Support-Portal-Single-Sign-On) to access the Punchh Support Portal."
