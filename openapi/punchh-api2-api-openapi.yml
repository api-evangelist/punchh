        item_filter_expressions_operator:
          type: string
          x-stoplight:
            id: 55psu44tsnb6d
          description: 'Specifies how offer conditions in `line_item_filters` are evaluated. Possible values: All, Any. The default value is "All". Use "All" when every condition must be met, or "Any" when satisfying at least one condition is sufficient.'
