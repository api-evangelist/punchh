        required: true
      description: 'This API allows third-party platforms (e.g., middleware that interfaces with the mobile app of the business) to purchase a new subscription plan in the Punchh platform without the need for guests to be logged in to the Punchh platform.


        If a business is migrating active subscriptions from an incumbent system to the Punchh platform, the subscription ID for each user in the incumbent system can be mapped to the corresponding subscription ID in the Punchh platform.


        If the Single Use setting is enabled for the subscription plan, and if you send auto_renewal as `true` in the Purchase Subscription API, then the API returns an error: This is a single use subscription and cannot be renewed automatically. Please check the request to send auto_renewal as false.'
      x-stoplight:
        id: 31a7819307f07
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int64
                  description: 'System-generated unique ID of a guest created on the Punchh platform

                    '
                  examples:
                  - 1234
                start_time:
                  type: string
                  minLength: 1
                  format: date-time
                  description: Date and time (in ISO 8601 format) from which the subscription being issued will become active
                  examples:
                  - '2021-05-18 11:34:46'
                plan_id:
                  type: integer
                  format: int64
                  description: System-generated unique ID of a subscription plan created in the Punchh platform. A subscription based on this plan ID will be issued to the guest when a purchase call is made.
                  examples:
                  - 12
                end_time:
                  type: string
                  minLength: 1
                  format: date-time
                  description: 'Date and time (in ISO 8601 format) until which the subscription being issued will remain active '
                  examples:
                  - '2021-05-28 11:34:46'
                purchase_price:
                  type: number
                  description: Price charged to the user for purchasing the subscription plan
                  format: float
                  examples:
                  - 20
                auto_renewal:
                  type: boolean
                  default: false
                  description: A guest’s preference of having a newly purchased subscription plan get automatically renewed per the plan's schedule. Third parties where auto renewal is considered default should send this value as "true".
                migration:
                  type: boolean
                  default: false
                  description: This key determines if a particular purchase call should be considered as a fresh purchase or the migration of an existing subscription from the incumbent system to the Punchh platform. A value of "true" indicates that this purchase is a migration, and value of "false" indicates that this is a fresh purchase.
                lifetime_debits:
                  type: number
                  format: float
                  description: Total discounted units under this plan ID, issued in the incumbent system before the guest migrated over to Punchh. This value should be sent only once at the time of making the purchase call for migration. This is relevant only if the value of the "migration" parameter is "true".
                  examples:
                  - 30
                lifetime_savings:
                  type: number
                  format: float
                  description: Total volume of savings under this plan ID, issued in the incumbent system before the guest migrated over to Punchh. This value should be sent only once at the time of making the purchase call for migration. This is relevant only if the value of the "migration" parameter is "true".
                  examples:
                  - 50
                initial_debits:
                  type: number
                  format: float
                  description: Number of discounted units for the migrated subscription. Based on this value, further discounting of units will be done in the Punchh system after the guest migrates. This value should not be included in lifetime_debits and should be sent only once at the time of making the purchase call for migration. This is relevant only if the value of the "migration" parameter is "true".
                  examples:
                  - 10
                initial_savings:
                  type: number
                  format: float
                  description: 'Volume of savings for the migrated subscription. Further savings in the Punchh platform will be added to this. This value should not be included in lifetime_savings and should be sent only once at the time of making the purchase call for migration. This is relevant only if the value of the "migration" parameter is "true". '
                  examples:
                  - 20
                source_subscription_id:
                  type: integer
                  description: This key should be sent if the purchase call is being made because a guest decides to change the subscription plan. In all other cases, this key should be sent as null.
                  format: int64
                  examples:
                  - 'null'
                location_id:
                  type: integer
                  x-stoplight:
                    id: pfyeucrbvxgv2
                  description: ID of the location where the subscription plan is purchased. It identifies the origin of the subscription purchase for the loyalty guest. If an invalid or missing location_id is passed, the API returns a 400 Bad Request error with the message "Invalid or missing location_id".
              required:
              - user_id
              - start_time
              - plan_id
              - end_time
              - purchase_price
              - auto_renewal
              - location_id
            examples:
              Request:
                value:
                  user_id: 1234
                  start_time: '2021-05-18 11:34:46'
                  plan_id: 12
                  end_time: '2021-05-28 11:34:46'
                  purchase_price: 20
                  auto_renewal: false
                  migration: false
                  lifetime_debits: 30
                  lifetime_savings: 50
                  initial_debits: 10
                  initial_savings: 20
                  source_subscription_id: 'null'
                  location_id: 12345
        description: ''
      tags:
      - Api2
