  /api2/mobile/redemptions/subscription:
    parameters: []
    post:
      summary: Generate a Redemption Code for Subscription Redemption
      operationId: post-api2-mobile-redemptions-subscription
      responses:
        '200':
          description: Success response if a redemption code is generated for the subscription redemption
          content:
            application/json:
              schema:
                type: object
                x-examples: null
                properties:
                  redemption_status:
                    type: string
                    description: 'Status of the redemption. Any one of these values is returned:

                      * redeemable: The redemption can be redeemed at the POS.

                      * expired: The redemption has expired and becomes unusable for the user.

                      * honoured: The redemption has already been processed successfully and redeemed by the user at the POS.

                      * cancelled: The redemption can be voided by a user by approaching the POS in case a redemption is done by mistake and the user wants to cancel it.'
                  created_at:
                    type: string
                    description: Date and time when the redemption was created in the system
                    format: date-time
                    examples:
                    - '2023-05-09T07:44:38Z'
                  redeemable_id:
                    type: integer
                    description: Unique ID of the redeemable
                  location_id:
                    type: integer
                    description: Location ID associated with redemption at which the redemption code is generated. If no location ID is provided, then it returns the location ID for the default location.
                  redemption_image_url:
                    type: string
                    description: URL of the image depicting the redeemable. It can be displayed in the mobile app.
                  redemption_message:
                    type: string
                    description: A descriptive message that tells the user what the user has redeemed
                  updated_at:
                    type: string
                    format: date-time
                    description: Date and time when the redemption was updated in the system
                    examples:
                    - '2023-05-09T07:44:38Z'
                  redeemable_description:
                    type: string
                    description: Description of the redeemable
                  redeemable_image_url:
                    type: string
                    description: URL of the image depicting the redeemable. It can be displayed in the mobile app.
                  redemption_id:
                    type: integer
                    format: int64
                    description: Unique ID of the redemption that has been created
                  redemption_tracking_code:
                    type: string
                    description: Code that a user must provide at the POS to receive the redeemed reward
                  expiring_at:
                    type: string
                    format: date-time
                    description: Date and time when the redemption_tracking_code expires and the user cannot use it at the POS
                    examples:
                    - '2023-05-09T07:54:38Z'
                  redeemable_name:
                    type: string
                    description: Name of the redeemable
                  redeemed_value:
                    type: string
                    description: '* In the case of a business with banked_currency, a currency value will be returned. For example, 10 would mean $10.

                      * In the case of a business without banked_currency, points will be returned. For example, 10 would mean 10 points.

                      * For subscriptions, a null value will be returned.'
                  subscription_id:
                    type: string
                    description: Unique ID of the subscription for which redemption is done
                  subscription_plan_id:
                    type: integer
                    description: System-generated unique ID of a subscription plan created in the Punchh platform
                  subscription_plan_name:
                    type: string
                    description: Name of the subscription plan from which the subscription is issued
                  subscription_plan_description:
                    type: string
                    description: Description of the subscription plan from which the subscription is issued
                  subscription_plan_image_url:
                    type: string
                    description: Image URL of the subscription plan from which the subscription is issued
                  redemption_type:
                    type: string
                    description: 'The parameter value helps the mobile application differentiate between older redemption types and subscription redemption. Valid value: SubscriptionRedemption'
              examples:
                example:
                  value:
                    redemption_status: redeemable
                    created_at: '2023-05-09T07:44:38Z'
                    redeemable_id: null
                    location_id: 304252
                    redemption_image_url: REDEMPTION_IMAGE_URL_GOES_HERE
