      items:
        x-stoplight:
          id: dw7o6he1vftrf
        type: object
        properties:
          line_item_selector_id:
            type: string
            x-stoplight:
              id: edzdryggy3455
            description: 'ID of the pre-existing LIS, which for now will be the external_id. Note: If the line item selector ID is invalid, the system will skip that line item filter and create the other line item filters with valid LIS IDs.'
          processing_method:
            type: string
            x-stoplight:
              id: o2c8wu4tw52oj
            description: 'The processing method for a line item filter determines how the selected items are handled when applying a discount. The system will skip the line item filter if the value of `processing_method` is invalid. The available processing methods are:

              * max_price: Applies the discount to the item with the highest price

              * min_price: Applies the discount to the item with the lowest price

              * exclude: Excludes the selected items from the discount

              * sum_of_amount (default): Applies the discount based on the total sum of the selected items'' prices'
          quantity:
            type: integer
            x-stoplight:
              id: um20q1tdltn1e
            description: 'Specifies how many units of a particular item will be selected or filtered for processing. A value is required if the processing function is selected as `min_price` or `max_price`. If you apply a filter on certain items and specify the quantity, the system will process only the selected number of units for that item. For example, if the quantity is set to 3, only 3 units of the item will be included in the filter or discount. The quantity value must adhere to certain rules:

              * The value of quantity must be a whole number.

              * The quantity cannot be negative.

              * You must have at least 1 unit of the item.

              * You can select up to 5 units of an item.'
