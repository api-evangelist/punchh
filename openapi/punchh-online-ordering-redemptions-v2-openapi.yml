  /api/auth/batch_redemptions:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption_ref:
                    type: string
                    description: Transaction level identifier for all discount selections
                  success:
                    type: array
                    description: List of discounts results that are successfully redeemed
                    items:
                      type: object
                  failures:
                    type: array
                    description: The failures array in the response lists discounts that are not successfully
                      redeemed, even if the HTTP request returns a 200 status. Note that not all HTTP
