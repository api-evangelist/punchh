    line_items:
      title: Line Items (Array Object)
      x-stoplight:
        id: ij9mvwtn03jof
      type: array
      description: List of line items
      x-examples:
        Example:
        - item_name: coffee
          item_qty: 1
          amount: 10
          item_type: M
          item_id: 330
          item_family: '10'
          item_group: gp
          serial_number: 1
      items:
        type: object
        properties:
          item_name:
            type: string
            description: Item name
          item_qty:
            type: integer
            description: The input of item quantity which reflects the specified number of items ordered
          amount:
            type: number
            format: float
            description: Total item amount. In case of multiple quantities, this is the sum total of all
              item amounts.
          item_type:
            type: string
            description: "M - Menu item ( + or - )\n\nS - Service item. Any item representing money received\
              \ that is not a sale. For example: service charges, delivery fees, tips, purchase of gift\
              \ cards/certificates, etc. In the case of a single scan flow, send a menu item with the\
              \ service menu item type for the selected tip amount. \n\n<b>Note</b>: We do not recommend\
              \ sending the following menu item types in this API call. Instead, send them in the [Create\
              \ Loyalty Check-in](/docs/dev-portal-online-ordering/f1943957e38b4-create-loyalty-check-in)\
              \ and [Update Loyalty Check-in](/docs/dev-portal-online-ordering/386045cf184bc-update-loyalty-check-in)\
              \ API calls.\n\nD - Discount (negative). Either internal or Punchh will always evaluate\
              \ lines as ( - ) regardless of the sign assigned in the API call. We do not recommend sending\
              \ any line item types set to D in any multiple Redemptions 2.0 requests. If any items with\
              \ line item type D are sent in these requests, the business will require additional configuration\
              \ for all offers to filter out the line item type D. See the [Qualification Criteria](https://support.punchh.com/s/article/Qualification-Criteria)\
              \ article on the Support Portal. <br><br>Note: To view the Punchh product documentation\
              \ on the Punchh Support Portal, you must log in to a Punchh platform production environment.\
              \ If you already have access to a production environment, follow the instructions [here](https://support.punchh.com/s/article/How-do-I-access-the-Punchh-Support-Portal-Single-Sign-On)\
              \ to access the Punchh Support Portal.\n\nT - Tax item. Taxes of all sorts\n\nP - Payment\
              \ item. Visa, MasterCard, cash, gift card/certificate (when used to pay for the order)\n\
              \nFor example, if a business offers a $2 discount on a $10 burger, send the burger as $8\
              \ ($10 - $2) in the API request. These discounts should be sent as line item type D in the\
              \ Check-in or Update API call."
          item_id:
            type: integer
            description: Item ID
          item_family:
            type: string
            description: Item family is required if the menu family is categorized for the item. For more
              information, see [How To Send Menu Items to Punchh](/docs/dev-portal-online-ordering/5277d762b8c6d-how-to-send-menu-items-to-punchh#structure-of-menu-item-data).
          item_group:
            type: string
            description: Item group is required if menu_major_group is categorized for the item. For more
              information, see [How To Send Menu Items to Punchh](/docs/dev-portal-online-ordering/5277d762b8c6d-how-to-send-menu-items-to-punchh#structure-of-menu-item-data).
          serial_number:
            type: number
            format: float
            description: Serial numbers are assigned to menu items on a receipt. A main menu item (such
              as pizza) may have serial number "1.0", and the associated modifiers (such as "Extra Cheese",
              "Olives", and "Jalapenos") may have serial numbers "1.1", "1.2", and "1.3" respectively.
              The numbering explains that particular items are modifiers associated with the main item.
        required:
        - item_name
        - item_qty
        - amount
        - item_type
        - item_id
        - item_family
        - item_group
        - serial_number
    qualified_items:
      title: Qualified Items (Array Object)
      x-stoplight:
        id: l9prb666730b6
      type: array
      description: List of qualified items
      x-examples:
        Example:
        - item_name: Pizza1 DISCOUNT
          item_qty: 2
          amount: 3.04
