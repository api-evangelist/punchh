          item_id: 101
          item_family: '10'
          item_group: '999'
          serial_number: '1.0'
      items:
        type: object
        properties:
          item_name:
            type: string
            description: Menu item name
          item_qty:
            type: integer
            description: The input of item quantity which reflects the specified number of items ordered
          amount:
            type: number
            format: float
            description: Total item amount. In case of multiple quantities, this is the sum total of all
              item amounts.
          item_type:
            type: string
            description: "M - Menu item ( + or - )\n\nS - Service item. Any item representing money received\
              \ that is not a sale. For example: service charges, delivery fees, tips, purchase of gift\
              \ cards/certificates, etc. In the case of a single scan flow, send a menu item with the\
              \ service menu item type for the selected tip amount. \n\n<b>Note</b>: We recommend not\
              \ sending the following menu item types in this API call. Instead, send them in the [Create\
              \ Loyalty Check-in](/docs/dev-portal-online-ordering/f1943957e38b4-create-loyalty-check-in)\
              \ and [Update Loyalty Check-in](/docs/dev-portal-online-ordering/386045cf184bc-update-loyalty-check-in)\
              \ API calls.\n\nD - Discount (negative). Either internal or Punchh will always evaluate\
              \ lines as ( - ) regardless of the sign assigned in the API call\n\nT - Tax item. Taxes\
              \ of all sorts\n\nP - Payment item. Visa, MasterCard, cash, gift card/certificate (when\
              \ used to pay for the order)\n\nFor example, if a business offers a $2 discount on a $10\
              \ burger, send the burger as $8 ($10 - $2) in the API request. Send the discount as a line\
              \ item in the Check-in API call."
          item_id:
            type: integer
            description: Item ID
          item_family:
            type: string
            description: Item family is required if menu_family is categorized for the item. For more
              information, see [How To Send Menu Items to Punchh](/docs/dev-portal-online-ordering/5277d762b8c6d-how-to-send-menu-items-to-punchh#structure-of-menu-item-data).
          item_group:
            type: string
            description: Item major group. Required if menu_major_group is categorized for the item; else
              pass it as a blank field in the API request. Generically, every menu item belongs to a family
              group. A family group is a sub-category of a major group. For more information, see [How
              To Send Menu Items to Punchh](/docs/dev-portal-online-ordering/5277d762b8c6d-how-to-send-menu-items-to-punchh#structure-of-menu-item-data).
          serial_number:
            type: string
            format: float
            description: Serial numbers are assigned to menu items on a receipt. A main menu item (such
              as pizza) may have serial number "1.0", and the associated modifiers (such as "Extra Cheese",
              "Olives", and "Jalapenos") may have serial numbers "1.1", "1.2", and "1.3" respectively.
              The numbering explains that particular items are modifiers associated with the main item.
  parameters:
    Signature:
      schema:
        type: string
        default: SIGNATURE_GOES_HERE
      in: header
      name: x-pch-digest
      description: The [signature](/docs/dev-portal-online-ordering/additional-topics/x-pch-digest-sha-1)
        for the API call
      required: true
    content type:
      schema:
        type: string
        default: application/json
      in: header
      name: Content-Type
      description: Set this header to **application/json**.
      required: true
    Accept:
      schema:
        type: string
        default: application/json
      in: header
      name: Accept
      description: Advertises which content types the client is able to understand
      required: true
    accept language:
      schema:
        type: string
        default: en
      in: header
      name: Accept-Language
      description: 'Preferred language. Punchh supports multiple languages for the redeemable name, redeemable
        description, meta data for coupon, subscription plan name, and subscription description in the
        API response as per the locale specified in the Accept-Language request header. Possible values:
        es for Spanish, fr for French, fr-ca for French-Canada, en-CY for English-Cyprus, ro for Romania,
        es-US for Spanish United States, etc.<br> The locales for a business are configured in the Punchh
        platform under <b>Administration > Business Profile > Address > Alternate Languages</b>. In the
        Punchh platform, the admin of a business has to configure in the relevant language(s) 1) the redeemable
        name and redeemable description when creating/editing a redeemable under <b>Offers > All Redeemables</b>,
        2) meta data for coupons when creating/editing a coupon campaign under <b>Campaign Management</b>,
        and 3) subscription plan name and subscription description when creating/editing a subscription
        plan under <b>Wallet and Passes > Subscription Plans</b>. '
    Authentication Token:
      schema:
        type: string
        default: AUTHENTICATION_TOKEN_GOES_HERE
      in: query
      name: authentication_token
      description: The authentication token of the user. You can retrieve this from the response of a
        successful sign-in API call or through the [SSO process](/docs/dev-portal-online-ordering/9a41534336c87-sso-flow-for-web-and-mobile).
    Client:
      schema:
        type: string
        default: CLIENT_GOES_HERE
      in: query
      name: client
      description: Client key of the business
    User-Agent:
      schema:
        type: string
        default: Punchh/OnlineOrder/1.0/Web/BrowserVersion/OS_Type
      name: User-Agent
      in: header
      required: true
      description: For details, see [User Agent](/docs/dev-portal-online-ordering/additional-topics/user-agent).
    Authorization:
      schema:
        type: string
        default: Bearer ACCESS_TOKEN_GOES_HERE
      name: Authorization
      in: header
      required: true
      description: You may pass the access_token instead of the authentication_token in Online Ordering
        endpoints to authorize the request. It must be supplied as `Bearer ACCESS_TOKEN_GOES_HERE`.
