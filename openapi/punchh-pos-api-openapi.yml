  /receipt_details:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                default:
                  value:
                    error: 'Required parameter missing or the value is empty: location_key'
        '401':
          description: Not authorized. Location token missing/invalid.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                default:
                  value:
                  - Invalid LocationKey
      operationId: receipt_details
      description: "This API call requires the API key as well as the business key to be sent in the HTTP\
        \ Authorization header in the following format:\n\nAuthorization: Token token=LOCATION_KEY_GOES_HERE,\
        \ btoken=BUSINESS_KEY_GOES_HERE\n\nwhere \n\nLOCATION_KEY_GOES_HERE is the API key (which is unique\
        \ for a location) and BUSINESS_KEY_GOES_HERE is the business key (which is unique for a business).\
        \ \n\nSee cURL examples for more details.   \n\n1\\. The receipt_details endpoint can store the\
        \ same receipt multiple times. If the POS client sends the same receipt (same punchh_key, same\
        \ location_key) many times, we store all the versions of that same receipt, provided that the\
        \ time between HTTP requests is 1 second or more. However, if the same receipt is received via\
        \ multiple HTTP calls in about the same time (less than 1 second), the last one overwrites the\
        \ previous version of that receipt.\n\n2\\. The endpoint accepts parameters in JSON as well.\n\
        \n3\\. “isl receipt details” endpoint for ALL transactions.\n\n4\\. “checkins” for registered\
        \ Punchh users wanting credit at the register via email, phone, QR code, or card number\n\n5\\\
        . All transactions generate the barcode / Punchh key.\n\n6\\. All transactions print a barcode\
        \ (?) on the receipt with that Punchh key.\n\n7\\. In the event of a network outage, we expect\
        \ data that was to be sent to the ISL and check-in endpoints to be queued and sent later. We do\
        \ not expect the redemptions to work in that case as there is no way to receive the amount from\
        \ Punchh.\n"
      summary: Store Receipt Details From POS
      parameters:
      - schema:
          type: string
          default: Token token=LOCATION_KEY_GOES_HERE, btoken=BUSINESS_KEY_GOES_HERE
        in: header
        name: Authorization
        required: true
        description: This is a combination of unique API key as well as business key (UUID) as the Authorization
          header.
      tags:
      - Point Of Sale
      x-stoplight:
        id: a8dca5f5b047e
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_no:
                  type: integer
                  description: 'Transaction number of the receipt

                    '
                vendor_transaction_no:
                  type: integer
                  description: Transaction number coming from online order, kiosk, or any other source
                    (required only if orders from other sources need to be linked to avoid double earnings
                    for the same order)
                employee_id:
                  type: string
                  description: 'ID of employee

                    '
                employee_name:
                  type: string
                  description: 'Name of employee

                    '
                revenue_id:
                  type: string
                  description: 'ID of the POS function that designates the order fulfillment method. Example:
                    1 for dine-in; 2 for to-go/take out; 3 for call-in pickup; 4 for call-in deliver,
                    etc. Some POS call this revenue center, order method, order mode, etc. The values
                    assigned here should represent the way the order is fulfilled for the customer, not
                    the area in the restaurant where the order is placed (e.g., not bar, patio, dining
                    room, etc.).'
                revenue_code:
                  type: string
                  description: Name of the POS function that designates the order fulfillment method (e.g.,
                    dine-in, to-go/take-out, call-in pickup, call-in deliver, etc). Some POS call this
                    Revenue Center, Order Method, Order Mode, etc. The values assigned here should represent
                    the way the order is fulfilled for the customer, not the area in the restaurant where
                    the order is placed (e.g., not bar, patio, dining room, etc.).
                amount:
                  type: number
                  format: double
                  description: Order amount before any taxes (sum of all amounts minus any discounts).
                    Same as `receipt_amount` and `subtotal_amount`.
                receipt_datetime:
                  type: string
                  description: Timestamp of the receipt per ISO 8601 format including TZ offset from UTC
                    (e.g., YYYY-MM-DDThh:mm:ss-±hh:mm)
                cc_last4:
                  type: integer
                  description: Last 4 digits of the user's credit card number
                payable:
                  type: number
                  description: Amount paid after applying discounts and adding any taxes or service charges.
                    For example, if the order amount is $10, the values of the `receipt_amount` and `subtotal_amount`
                    parameters will be $10. If a $2 discount is applied, `subtotal_amount` becomes $8.
                    However, if there are $3 service charges and $1 tax, the value of the `payable` parameter
                    becomes $12 (10 – 2 + 3 + 1 = 12).
                  format: double
                pos_version:
                  type: string
                  description: 'Version of the client software

                    '
                menu_items:
                  $ref: '#/components/schemas/menu_items'
                punchh_key:
                  type: string
                  description: 'Punchh key (barcode without parity bit) of the receipt as generated by
                    the POS. Should be 11 or 12, 20 digits

                    '
                pos_type:
                  type: string
                  description: "Name of the POS client that is sending the receipts. \n\nPossible values:\
                    \ A1 POS, Adora POS, Aloha, Aloha (Secure), Appetize, Auphan, Bite Kiosk, Brink, Comtrex,\
                    \ DataPoint, EPoint, Focus, Focus POS Systems, FoodTec, FoodTec V2, Gilbarco, GJS\
                    \ Kiosk, Granbury, Grubburr Kiosk, HoneyBakedHam POS, Hooters Hoa, HungerRush POS\
                    \ (Formerly Revention), InfoKING, Itwercs POS, iVend POS, Maitre’D, Marble Kiosk,\
                    \ Marblepos, Micros RES 3700, Micros Simphony, NCR ISS45 POS, NCR kiosk, NCR RPOS,\
                    \ NCR Silver, NCR Silver Essential, NCR Silver Pro, NCR Storepoint, Nextep kiosk,\
                    \ Onetap, PAR, PiZMET, Plum POS, Positouch, PosNet, Proprietary POS, Punchh Kiosk,\
                    \ Punchh Secure, QikServe Kiosk, Quardzilla, QuBeyond POS (Formerly Gusto), QuickServe,\
                    \ Ready (Pay-on-the-GO), Revel, SICOM, SpeedLine, Squirrel, Steak n Shake, TCPOS,\
                    \ Tevalis POS, Toast, Toast V3, Tray POS, Treatware, Verifone, VisualTouch POS, XPO\
                    \ Pay@Table, Xchangexec (Task retail), Xenial Cloud,  Xpient, Xpient (Secure), Zonal\
                    \ POS"
                status:
                  type: string
                  description: Receipt status. Use void to cancel/void a receipt. Not sending this optional
                    parameter is assumed that it is a valid receipt.
                is_test:
                  type: boolean
                  description: 'Accepts any one of two values: 1 (True) - it is a test receipt, or 0 (False)
                    - it is a normal receipt.'
                receipt_amount:
                  type: number
                  format: double
                  description: Order amount before taxes, calculated as the sum of all item amounts minus
                    any discounts. This is the amount used to calculate loyalty points/visits. The value
                    of this parameter should match `subtotal_amount`. For example, if the order amount
                    is $10, both `receipt_amount` and `subtotal_amount` will be 10. If a $2 discount is
                    applied, both will be 8.
                subtotal_amount:
                  type: number
                  format: double
                  description: Order amount before taxes (sum of all item amounts minus any discounts).
                    Same as `receipt_amount`. For historical reasons, include this parameter along with
                    `receipt_amount` in the API request.
                channel:
                  type: string
                  description: 'Channel through which the check-in was requested. Possible values are:
                    online_order, pos, web, mobile, dashboard, chatbot, kiosk.

                    Optional, though if not provided in the receipt details request, defaults to the value
                    used in the associated check-in call.'
              required:
              - transaction_no
              - amount
              - receipt_datetime
              - payable
              - pos_version
              - menu_items
              - punchh_key
              - pos_type
              - receipt_amount
              - subtotal_amount
            examples:
              Request:
                value:
                  transaction_no: 20095
                  vendor_transaction_no: 1095
                  employee_id: '5208'
                  employee_name: EMPLOYEE_NAME_GOES_HERE
                  revenue_id: Dine In
                  revenue_code: '4'
                  amount: 15.99
