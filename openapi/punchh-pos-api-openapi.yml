      operationId: get-api-pos-users-balance
      description: "The API fetches the account balance details of the user based on the program type\
        \ of the business and different subscriptions if purchased by the user along with their benefits\
        \ and discounts.  \n\nNote: \n\n1\\. The `net_balance`, `points_balance`, `net_debits`, `pending_points`,\
        \ `total_credits`, `total_debits`, and `total_points_credits` parameters are applicable if the\
        \ program type is Points unlock redeemables. \n\n2\\. The `total_redeemable_visits`, `total_visits`,\
        \ and `unredeemed_cards` parameters are applicable if the program type is Visit-based. \n\n3\\\
        . The `banked_rewards` parameter is applicable if the program type is Points convert to currency.\n\
        \n4\\. The `banked_currency` and `balance` parameters are applicable if the program type is Points\
        \ to Manual."
      parameters:
      - $ref: '#/components/parameters/Authorization'
      x-stoplight:
        id: fbbeada074c40
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: System-generated unique ID of the user
                discount_type:
                  type: array
                  description: Type of discount for which discounts are returned in the response. The
                    valid value for this parameter is ‘subscription’.
                  items:
                    type: string
                    enum:
                    - subscription
            examples:
              default:
                value:
                  user_id: '111111'
                  discount_type:
                  - subscription
        description: ''
