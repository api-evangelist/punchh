        <td class="xl67" width="160" style="width:120pt"><b>Character Type</b></td>

        <td class="xl67" width="211" style="width:158pt"><b>How To Identify</b></td>

        </tr>


        <tr height="21" style="height:16.0pt">

        <td height="21" style="height:16.0pt">Phone Number</td>

        <td class="xl65">10</td>

        <td>Numeric</td>

        <td>10 digits</td>

        </tr>


        <tr height="21" style="height:16.0pt">

        <td height="21" style="height:16.0pt">Email</td>

        <td class="xl65">6-255</td>

        <td>Alphanumeric</td>

        <td>String including @</td>

        </tr>


        <tr height="21" style="height:16.0pt">

        <td height="21" style="height:16.0pt">User QR Code</td>

        <td class="xl65">2-12</td>

        <td>Alphanumeric</td>

