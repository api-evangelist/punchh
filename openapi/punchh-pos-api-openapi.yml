        ## POS Single Scan Flow (SSF) User Look-up API


        Punchh supports SSF token. The SSF token is used to make payments for the purchases made at POS
        stores.


        This token is a UUID string, which is made up of alphanumeric characters and passed in the User
        Look-up API request in the single_scan_code parameter. The SSF token that is generated from the
        guest’s mobile app is used to look up the information required for processing the payment, such
        as the payment mode that the user selected for the purchase, the selected discount that the user
        wants to redeem, and the selected tip amount.


        For more information, see [Single Scan Flow](/docs/dev-portal-pos/additional-topics/single-scan-flow).


        ## User Look-up with Loyalty Short Code


        The Loyalty Short Code is generated in the mobile app. When only the guest identification using
        the short code at drive-thru is enabled for a business, the short code is used for loyalty identification
        only. When **Single Scan Flow (SSF)** and **Payment with Short Code using SSF** are also enabled,
        the short code is used for both loyalty identification and payment.


        A short code used only for loyalty identification is generated using the [Generate a Drive-Thru
        Short Code API](https://developers.partech.com/docs/dev-portal-mobile/apis/mobile-api/tag/drive-thru/post/api2/mobile/drivethru_code).
        When the short code is used for look-up, the User Look-up API returns the user profile data, balance,
        and rewards in the response.


        A short code used for both loyalty identification and payment is generated using [Generate Single
        Scan Code API](https://developers.partech.com/docs/dev-portal-mobile/apis/mobile-api/tag/single-scan-code/post/api2/mobile/single_scan_tokens).
        When the POS calls the User Look-up API with the short code (passed in the `drive_thru_code` parameter),
        Punchh uses the short code and the user ID mapped to it to retrieve the associated `single_scan_code`.


        Punchh then uses the `single_scan_code` to look up the user and returns it in the response, along
        with any rewards and payment information selected by the user when generating the short code from
        the mobile app. The POS can use the `single_scan_code` for check-in, redemptions, and payments.

        '
      operationId: pos_user_search
      tags:
      - Point Of Sale
      parameters:
      - schema:
          type: string
          default: Token token=LOCATION_KEY_GOES_HERE, btoken=BUSINESS_KEY_GOES_HERE
        in: header
        name: Authorization
        required: true
        description: This is a combination of unique API key as well as business key (UUID) as the Authorization
          header.
      - schema:
          type: string
          default: en
        in: header
        name: Accept-Language
        description: Short code for locale variant (e.g., fr-ca, es-ES, en-EN, etc.)
      - schema:
          type: string
        in: query
        name: email
        description: Email address of the user.
      - schema:
          type: string
        in: query
        name: phone
        description: Phone number of the user.
      - schema:
          type: string
        in: query
        name: card_number
        description: Physical loyalty card generated by Punchh.
      - schema:
          type: string
        in: query
        name: user_as_qrcode
        description: QR code of the user.
      - schema:
          type: string
        in: query
        name: single_scan_code
        description: 'Single scan code of the user to be used in single scan flow. '
      - schema:
          type: string
        in: query
        name: redemption_code
        description: Redemption code of the user as generated on the app or web.
      - schema:
          type: string
        in: query
        name: reward_id
        description: ID of the user’s reward as generated on the app or web.
      - schema:
          type: string
        in: query
        name: apple_nfc_data
        description: User identifier that enables look-up of user information generated from the Apple
          Pass. See [Implement Apple Pass Integration With POS](/docs/dev-portal-pos/ea3c77d831261-implement-apple-pass-integration-with-pos)
      - schema:
          type: string
        in: query
        name: nfc_token
        description: User identifier that enables the look-up of user information generated from the Google
          Pass. See [Implement Google Pass Integration With POS](/docs/dev-portal-pos/additional-topics/implement-google-pass-integration-with-pos)
      - schema:
          type: string
        in: query
        name: drive_thru_code
        description: '4-digit numeric/alphanumeric drive-thru short code generated by the user from the
          brand''s mobile app that enables lookup of user details and balance. The short code is mapped
          to the user ID. See [Generate a Drive-Thru Short Code](https://developers.partech.com/docs/dev-portal-mobile/647b28e02d630-generate-a-drive-thru-short-code).


          When the short code passed in the API is enabled for payments, Punchh uses the short code and
          the user ID mapped to it to retrieve the associated single scan code. Punchh then uses the single
          scan code to look up the user and returns it in the response, along with any rewards and payment
          information selected when the short code was generated.


          The POS can use the single_scan_code for check-in, redemptions, and payments. See [Generate
          Single Scan Code API](https://developers.partech.com/docs/dev-portal-mobile/apis/mobile-api/tag/single-scan-code/post/api2/mobile/single_scan_tokens).


          The API returns a 404 or 410 status code with the error message "CODE_EXPIRED" for an expired
          short code, and a 404 status code with the error message "CODE_NOT_FOUND" for an invalid or
          unmapped short code.

          '
      x-stoplight:
        id: 4ffb5dc3916f7
