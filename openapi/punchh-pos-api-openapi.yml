      summary: Create Check-in
      description: 'Creates a check-in for a customer.

        '
      operationId: pos_checkin
      tags:
      - Point Of Sale
      parameters:
      - schema:
          type: string
          default: Token token=LOCATION_KEY_GOES_HERE, btoken=BUSINESS_KEY_GOES_HERE
        in: header
        name: Authorization
        description: This is a combination of unique API key as well as business key (UUID) as the Authorization
          header.
        required: true
      - schema:
          type: string
          default: en
        in: header
        name: Accept-Language
        description: Short code for locale variant (e.g., fr-ca, es-ES, en-EN, etc.)
      x-stoplight:
        id: 52632fd1c0ab1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pos_version:
                  type: string
                  description: POS version
                sequence_no:
                  type: integer
                  description: Sequence number of check details required to be sent for the same transaction
                transaction_no:
                  type: integer
                  description: Trasaction number
                receipt_datetime:
                  type: string
                  enum:
                  - YYYY-MM-DDThh:mm:ssZ
                  format: date-time
                  description: Timestamp of receipt per ISO 8601 format including TZ offset from UTC (YYYY-MM-DDThh:mm:ss-±hh:mm)
                revenue_code:
                  type: string
                  description: Name of the POS function that designates order fulfillment method (e.g.,
                    dine-in, to-go/take-out, call-in pickup, call-in deliver, etc). Some POS call this
                    Revenue Center, Order Method, Order Mode, etc. The values assigned here should represent
                    the way the order is fulfilled for the customer, not the area in the restaurant where
                    the order is placed (e.g., not bar, patio, dining room, etc.).
                revenue_id:
                  type: string
                  description: 'ID of the POS function that designates the order fulfillment method. Example:
                    1 for dine-in; 2 for to-go/take out; 3 for call-in pickup; 4 for call-in deliver,
                    etc. Some POS call this revenue center, order method, order mode, etc. The values
                    assigned here should represent the way the order is fulfilled for the customer, not
                    the area in the restaurant where the order is placed (e.g., not bar, patio, dining
                    room, etc.).'
                menu_items:
                  $ref: '#/components/schemas/menu_items'
                employee_id:
                  type: string
                  description: Employee ID
                employee_name:
                  type: string
                  description: Name of the employee
                receipt_amount:
                  type: number
                  format: double
                  description: Order amount before taxes, calculated as the sum of all item amounts minus
                    any discounts. This is the amount used to calculate loyalty points/visits. The value
                    of this parameter should match `subtotal_amount`. For example, if the order amount
                    is $10, both `receipt_amount` and `subtotal_amount` will be 10. If a $2 discount is
                    applied, both will be 8.
                subtotal_amount:
                  type: number
                  format: double
                  description: Order amount before taxes (sum of all item amounts minus any discounts).
                    Same as `receipt_amount`. For historical reasons, include this parameter along with
                    `receipt_amount` in the API request.
                cc_last4:
                  type: integer
                  description: Last 4 digits of the user's credit card number
                punchh_key:
                  type: string
                  description: Unique Punchh key
                pos_type:
                  type: string
                  description: "Name of the POS client that is sending the receipts. \n\nPossible values:\
                    \ A1 POS, Adora POS, Aloha, Aloha (Secure), Appetize, Auphan, Bite Kiosk, Brink, Comtrex,\
                    \ DataPoint, EPoint, Focus, Focus POS Systems, FoodTec, FoodTec V2, Gilbarco, GJS\
                    \ Kiosk, Granbury, Grubburr Kiosk, HoneyBakedHam POS, Hooters Hoa, HungerRush POS\
                    \ (Formerly Revention), InfoKING, Itwercs POS, iVend POS, Maitre’D, Marble Kiosk,\
                    \ Marblepos, Micros RES 3700, Micros Simphony, NCR ISS45 POS, NCR kiosk, NCR RPOS,\
                    \ NCR Silver, NCR Silver Essential, NCR Silver Pro, NCR Storepoint, Nextep kiosk,\
                    \ Onetap, PAR, PiZMET, Plum POS, Positouch, PosNet, Proprietary POS, Punchh Kiosk,\
                    \ Punchh Secure, QikServe Kiosk, Quardzilla, QuBeyond POS (Formerly Gusto), QuickServe,\
                    \ Ready (Pay-on-the-GO), Revel, SICOM, SpeedLine, Squirrel, Steak n Shake, TCPOS,\
                    \ Tevalis POS, Toast, Toast V3, Tray POS, Treatware, Verifone, VisualTouch POS, XPO\
                    \ Pay@Table, Xchangexec (Task retail), Xenial Cloud,  Xpient, Xpient (Secure), Zonal\
                    \ POS"
                external_uid:
                  type: string
                  description: 'Unique ID generated by your system. We use this to prevent duplicates
                    in the case same transactions get triggered twice.

                    '
                channel:
                  type: string
                  description: 'Channel through which the check-in was requested. Possible values are:
                    online_order, pos, web, mobile, dashboard, chatbot, kiosk.'
                email:
                  type: string
                  description: Email address of the user. In the case of single scan flow, email is not
                    a required parameter.
                single_scan_code:
                  type: string
                  description: Single scan code of the user is a required parameter when a check-in is
                    created through the single scan flow on the POS. The code identifies the user.
                payable:
                  type: number
                  format: double
                  description: Amount paid after applying discounts and adding any taxes or service charges.
                    For example, if the order amount is $10, the values of the `receipt_amount` and `subtotal_amount`
                    parameters will be $10. If a $2 discount is applied, `subtotal_amount` becomes $8.
                    However, if there are $3 service charges and $1 tax, the value of the `payable` parameter
                    becomes $12 (10 – 2 + 3 + 1 = 12).
              required:
              - pos_version
              - transaction_no
              - receipt_datetime
              - revenue_code
              - revenue_id
              - menu_items
              - receipt_amount
              - subtotal_amount
              - punchh_key
              - pos_type
              - channel
              - email
              - single_scan_code
              - payable
