      summary: User Look-up and Fetch Balance
      description: 'This API looks up a loyalty guest using an identifier to retrieve guest data and to
        assign the user to the check or transaction.


        ## Fields Used for User Look-up


        The following table summarizes the different look-up fields that are used in the request of this
        API endpoint. The POS makes a call using ***one*** of these identifiers (e.g., email address,
        phone number, QR code, or loyalty card number) to look up the loyalty user on the Punchh platform.
        **Sending one of the query parameters (see below) is required.**


        Note: User QR codes appear in three different ways, hence the three descriptions below.


        <table border="0" cellpadding="0" cellspacing="0" width="756" style="border-collapse:collapse;table-layout:fixed;width:350pt">

        <colgroup><col width="224" style="mso-width-source:userset;mso-width-alt:7168;width:168pt"> <col
        width="161" style="mso-width-source:userset;mso-width-alt:5162;width:121pt"> <col width="160"
        style="mso-width-source:userset;mso-width-alt:5120;width:120pt"> <col width="211" style="mso-width-source:userset;mso-width-alt:6741;width:158pt"></colgroup>


