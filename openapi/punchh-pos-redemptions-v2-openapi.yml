      description: "When reward locking is enabled in the Punchh Platform, the guest's discount basket\
        \ must be locked. An external ID will be required to lock the discount basket to prevent other\
        \ channels from creating simultaneous transactions or modifying the discount basket. In this mode,\
        \ the guest's discount basket must be locked when discounts are applied to a transaction, using\
        \ a unique identifier `external_uid` specific to the transaction generated by your application.\n\
        \nThe `external_uid` ensures that no modifications or updates are allowed by any other channel\
        \ (e.g., web, mobile, etc.) except the application that initially locked the discount basket with\
        \ the `external_uid`. Contact your Punchh representative to update this Punchh platform configuration\
        \ setting.\n<!-- Cockpit > Redemptions > Multiple Redemptions > Enable Reward Locking --> \n\n\
        In some scenarios where a transaction is cancelled or when the guest modifies the order after\
        \ the basket is locked, the guest's discount basket needs to be unlocked so that transactions\
        \ can be processed for the guest via other channels (e.g., web, online ordering, etc.). To unlock\
        \ the discount basket, the `external_uid` must be passed in the API request along with the guest's\
        \ `user_id`."
