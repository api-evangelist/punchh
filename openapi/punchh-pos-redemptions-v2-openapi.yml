      x-stoplight:
        id: 49c4867d18844
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: Guest user ID
                discount_basket_items_attributes:
                  type: array
                  description: List of discounts to add to basket
                  items:
                    type: object
                    properties:
                      discount_type:
                        type: string
                        enum:
                        - reward
                        - card_completion
                        - redeemable
                        - discount_amount
                        - redemption_code
                        - subscription
                        - fuel_reward
                        description: 'The discount type can be any one of these values: card_completion
                          || reward || redeemable || discount_amount || redemption_code || subscription
                          || fuel_reward. For details, see [Make Your First POS API Call](/docs/dev-portal-pos/1fbfdfdd05a86-make-your-first-pos-api-call#redemption-types).'
                      discount_id:
                        type: string
                        description: Unique ID that identifies the discount (e.g., reward_id, redeemable_id,
                          redemption_code, coupon_code)
                      discount_value:
                        type: number
                        description: Dollar amount not exceeding the value of banked rewards in the user’s
                          account. This parameter is applicable only when the program type of the business
                          is banked rewards. If the currency value exceeds the user’s available balance,
                          the request will fail with an error message indicating that the selection exceeds
                          the currency balance.
                        format: float
