                  wants_notify_for_campaign_approval_email:
                    type: boolean
                    description: Allows the business admin to receive notifications for campaign approval emails. The business admin must have Workflow Management permission. Otherwise, the business admin will be notified but will not have access to campaigns that are pending approval.
                  locations:
