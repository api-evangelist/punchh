      parameters:
      - $ref: '#/components/parameters/authorization-header'
      - $ref: '#/components/parameters/accept'
      - $ref: '#/components/parameters/content-type'
      x-stoplight:
        id: 84d3dba781bcd
      description: Gets the details of a business admin in the Punchh platform
      requestBody:
