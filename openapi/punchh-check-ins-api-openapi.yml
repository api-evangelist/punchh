openapi: 3.2.0
info:
  title: Mobile Check Ins API
  version: '1.0'
  contact:
    name: Punchh Dev Support
    url: https://developers.punchh.com
  description: 'Punchh provides a robust platform for offering loyalty programs to customers. When a business integrates its back-end with the Punchh server, the Punchh APIs become instrumental in executing loyalty programs for enrolled customers, primarily via business-branded mobile apps and websites tailored by Punchh.


    To establish integration with the Punchh APIs, you need to understand how they are invoked and what responses are returned by the Punchh server. You can call APIs using any suitable API test client, such as Postman. Thus, the response to every API call made in Postman under a chosen environment (in app and/or platform) is reflected in the app and/or platform.'
servers:
- url: https://SERVER_NAME_GOES_HERE.punchh.com
tags:
- name: Check-ins
paths:
  /api2/mobile/checkins/barcode:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
              examples:
                default:
                  value:
                    created_at: '2016-05-16T08:22:25-04:00'
                    current_membership_level: Club Lite - Level 1 (0-400)
                    location_id: 304252
                    pending_refresh: false
                    points_earned: 72
                    store_number: ''
                    survey_url: URL_GOES_HERE
                    checkin_id: 11140692
                    first_checkin: false
                    expiring_on: null
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      missing_required_param:
                        type: array
                        items:
                          type: string
              examples:
                Bad Reqeust (required parameter missing):
                  value: "{\n  \"errors\": {\n    \"missing_required_param\": [\n      \"Required parameter missing or the value is empty: client\"\n    ]\n  }\n}"
                Bad Request (barcode missing):
                  value: "{  \n   \"errors\":{  \n      \"missing_required_param\":[  \n         \"Required parameter missing or the value is empty: bar_code\"\n      ]\n   }\n}"
        '412':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      invalid_signature:
                        type: array
                        items:
                          type: string
              examples:
                default:
                  value:
                    errors:
                      invalid_signature:
                      - Signature doesn't match. See [this topic](/docs/dev-portal-mobile/17c2f8eb39142-generating-x-pch-digest-header-for-mobile-ap-is)
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      base:
                        type: array
                        items:
                          type: string
              examples:
                Unprocessable entity (used barcode):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"You cannot use the same receipt more than once.\"\n      ]\n   }\n}"
                unprocessable entity (invalid barcode):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"This bar code is not valid.\"\n      ]\n   }\n}"
                unprocessable entity (below minimum checkin amount):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"The minimum checkin amount is $0.01.\"\n      ]\n   }\n}"
                unprocessable entity (old barcode):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"This receipt is too old to be accepted.\"\n      ]\n   }\n}"
                unprocessable entity (guest not within range):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"Guest not within range of restaurant location.\"\n      ]\n   }\n}"
                unprocessable entity (no barcode scanned):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"Due to network connectivity issues at the printing location, this Bar Code cannot be scanned. Please submit a picture of the receipt showing the receipt amount and receipt date via  'Need Help?' button.\"\n      ]\n   }\n}"
                unprocessable entity (multiple checkin error):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"You aren't allowed to scan multiple receipts in one visit, please try again later.\"\n      ]\n   }\n}"
                unprocessable entity (failed redis lookup):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"We are looking for your check, but it's taking longer than expected. Once we find it, we'll let you know and add it to your account.\"\n      ]\n   }\n}"
      summary: Create Loyalty Check-in by Barcode
      description: Creates a loyalty check-in for a user when the user scans/enters the barcode printed on an order receipt. The user can scan the barcode using the mobile app of the business or enter the barcode on the website of the business.
      operationId: mobile_create_loyalty_checkin_by_barcode
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - $ref: '#/components/parameters/User-Agent'
      x-stoplight:
        id: e1805d58af142
      tags:
      - Check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bar_code:
                  type: integer
                  format: int32
                  description: Barcode printed on the receipt
                client:
                  type: string
                  description: OAuth client ID provided by the business
                gps_accuracy:
                  type: string
                  description: Accuracy of the user's device GPS
                latitude:
                  type: number
                  format: double
                  description: Latitude coordinate of the user's device GPS. The latitude of the location is required if location_id is not provided.
                location_id:
                  type: integer
                  format: int32
                  description: ID of the location where the user did the check-in. The location ID is required if both the latitude and longitude of the location are not provided. If the latitude and longitude of the location are not provided, then by default Punchh identifies location based on the barcode printed on the receipt.
                longitude:
                  type: number
                  format: double
                  description: Longitude coordinate of the user's device GPS. The longitude of the location is required if location_id is not provided.
                manual:
                  type: boolean
                  description: True if the user entered the barcode by hand.
              required:
              - bar_code
              - client
            examples:
              default:
                value:
                  bar_code: BARCODE_GOES_HERE
                  client: CLIENT_GOES_HERE
                  gps_accuracy: '27'
                  latitude: '26.9167509'
                  location_id: '304991'
                  longitude: '75.8136926'
  /api2/mobile/checkins/qrcode:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
              examples:
                default:
                  value:
                    created_at: '2016-05-16T08:22:25-04:00'
                    current_membership_level: Club Lite - Level 1 (0-400)
                    location_id: 304252
                    pending_refresh: false
                    points_earned: 72
                    store_number: ''
                    survey_url: URL_GOES_HERE
                    checkin_id: 11140685
                    first_checkin: false
                    expiring_on: '2024-03-13'
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      missing_required_param:
                        type: array
                        items:
                          type: string
              examples:
                Bad Request (client missing):
                  value:
                    errors:
                      missing_required_param:
                      - 'Required parameter missing or the value is empty: client'
                Bad Request (Decoded QR missing):
                  value: "{  \n   \"errors\":{  \n      \"missing_required_param\":[  \n         \"Required parameter missing or the value is empty: qr_decoded\"\n      ]\n   }\n}"
        '401':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      unknown_client:
                        type: array
                        items:
                          type: string
              examples:
                default:
                  value:
                    errors:
                      unknown_client:
                      - Client ID is incorrect. Please check client param or contact us.
        '403':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      invalid_access_token:
                        type: array
                        items:
                          type: string
              examples:
                default:
                  value:
                    errors:
                      invalid_access_token:
                      - 'Error: access_token not found or is incorrect! Valid access_token of the user required.'
        '412':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      invalid_signature:
                        type: array
                        items:
                          type: string
              examples:
                default:
                  value:
                    errors:
                      invalid_signature:
                      - Signature doesn't match. See [this topic](/docs/dev-portal-mobile/17c2f8eb39142-generating-x-pch-digest-header-for-mobile-ap-is)
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      base:
                        type: array
                        items:
                          type: string
              examples:
                unprocessable entity (muliple checkins made):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"You aren't allowed to scan multiple receipts in one visit, please try again later.\"\n      ]\n   }\n}"
                unprocessable entity (unable to determine location):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"Unable to determine your distance from El Paso. Please check to see if your phone's GPS is enabled and try upgrading your app.\"\n      ]\n   }\n}"
                unprocessable entity (location time validation):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"You can only checkin at this location within working hours.\"\n      ]\n   }\n}"
                unprocessable entity (invalid qr code):
                  value: "{  \n   \"errors\":{  \n      \"base\":[  \n         \"Invalid QR Code.\"\n      ]\n   }\n}"
      summary: Create Loyalty Check-in by QR Code
      description: Creates a loyalty check-in for a user when the user scans a quick-response (QR) code using the mobile app of the business
      operationId: mobile_create_loyalty_checkin_by_qr_code
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/User-Agent'
      x-stoplight:
        id: 351a504277f3b
      tags:
      - Check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qr_decoded:
                  type: string
                  format: int32
                  description: Decoded form of the QR code printed on the receipt
                client:
                  type: string
                  description: OAuth client ID provided by the business
                gps_accuracy:
                  type: string
                  description: Accuracy of the user's device GPS
                latitude:
                  type: number
                  format: double
                  description: Latitude coordinate of the user's device GPS. The latitude of the location is required if location_id is not provided.
                location_id:
                  type: integer
                  format: int32
                  description: 'ID of the location where the user did the check-in. The location ID is required if both the latitude and longitude of the location are not provided. '
                longitude:
                  type: number
                  format: double
                  description: Longitude coordinate of the user's device GPS. The longitude of the location is required if location_id is not provided.
                manual:
                  type: string
                  description: True if the user entered the QR code by hand
              required:
              - qr_decoded
              - client
            examples:
              default:
                value:
                  qr_decoded: QR_CODE_GOES_HERE
                  client: CLIENT_GOES_HERE
                  location_id: 304155
                  latitude: 26.9167509
                  longitude: 75.8136926
                  gps_accuracy: '27'
                  manual: ''
