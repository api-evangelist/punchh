    account-balance-details:
      type: object
      title: Account Balance Details (Object)
      x-stoplight:
        id: 2a0aec02b7738
      properties:
        banked_currency:
          type: number
          format: float
          description: Value of the currency that a user has available. A "null" value indicates that the business does not support banking of points into currency.
        checkins_on_current_card:
          type: integer
          description: "A card gets completed after a user does a configured number of check-ins. \nFor example, if a business configuration requires 7 check-ins to complete a card, and a user does only 3 check-ins, the value of this parameter will be 3."
        current_membership_level_id:
          description: Unique ID of the current membership level of a user
          type: integer
        current_membership_level_expiring_on:
          type: string
          description: If a business has a rolling expiry of membership levels, a particular membership level will expire after a period that is configured in the Punchh platform. A "null" value indicates that the business does not have a rolling expiry of membership levels.
          enum:
          - YYYY-MM-DD
          format: date
        expiring_banked_currency (Deprecated):
          type: number
          format: float
          description: If a business has expiring banked currency configured in the Punchh platform, the banked currency will expire in a FIFO (first-in, first-out) pattern. This returns the value of the banked currency that will expire. A "null" value indicates that the business is not configured to support expiring banked currency.
        banked_currency_expiring_on (Deprecated):
          type: string
          description: If a business is configured to support expiring banked currency, this returns the date on which it will expire. A "null" value indicates that the business is not configured to support expiring banked currency.
          enum:
          - YYYY-MM-DD
          format: date
        pending_points:
          type: number
          format: float
          description: Points of a user that are in the pending state after a check-in. They are not added to the user's account before finalization. See [Pending Points Feature Overview](/docs/dev-portal-pos/ZG9jOjUwMjgzOTAz-pending-points-feature-overview) for details.
        redeemed_cards:
          type: integer
          description: The number of cards that a user has redeemed in the user's lifetime
        total_loyalty_visits:
          type: integer
          description: Total of the visits that a user has earned by doing loyalty check-ins and those visits that were migrated from an older loyalty program (if a business had an older loyalty program and wants to migrate its users to Punchh's loyalty program)
          x-nullable: true
        unredeemed_cards:
          type: integer
          description: Total unredeemed cards available to a user
          x-nullable: true
        current_membership_level_name:
          type: string
          description: Current membership level of the user
          x-nullable: true
        lifetime_points:
          type: number
          format: float
          description: Sum of all loyalty points earned by a user from the time the user signed up
        redeemable_points:
          type: number
          format: float
          description: 'The total of all loyalty points earned by a user that satisfy all of the following conditions:

            * approved

            * non-pending

            * unexpired'
        unbanked_points:
          type: number
          format: float
          description: For a business that allows banking of points, this value represents the number of points the user has and has not banked yet. For example, if a business configuration requires 100 points to be banked to $10, and a user has accumulated 55 points, this value will be 55. When the user earns another 45 points, the user will be banked to $10 and this value will then become 0.
        membership_qualification_points:
          type: integer
          x-stoplight:
            id: gq5ah9naehygk
          description: 'The value of points earned toward progress across membership tiers. This is related to the migration strategy that allows businesses to "Consider Only Initial Points for Tier Migration". Currently, support for this parameter is limited to program type Points Unlock Redeemables, Membership Re-evaluation Strategy: Reset Based on Points Earned and Account Re-evaluation Strategy of Guest Inactivity.'
