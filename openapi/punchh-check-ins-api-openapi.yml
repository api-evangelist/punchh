      summary: Create Loyalty Check-in by Receipt Image
      description: Creates a loyalty check-in for a user based on the receipt image captured by the user. The user captures the receipt image for an order and taps the create check-in button on the mobile app of the business. When the receipt is approved, loyalty points are added to the user's account.
      operationId: mobile_create_loyalty_checkin_by_receipt_image
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/User-Agent'
      x-stoplight:
        id: eebe5e52f84d3
      tags:
      - Check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                location_id:
                  type: string
                  description: ID of the location where the user did the check-in. The location ID is required if both the latitude and longitude of the location are not provided.
                receipt_url:
                  type: string
                  description: URL of the receipt image captured by the user. Use the [Image Upload to AWS](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1aws_s3_pre_signed_url/post) API endpoint to upload the receipt image to AWS. The endpoint returns the URL of the uploaded image in its response.
                latitude:
                  type: string
                  description: Latitude coordinate of the user's device GPS. The latitude of the location is required if location_id is not provided.
                longitude:
                  type: string
                  description: Longitude coordinate of the user's device GPS. The longitude of the location is required if location_id is not provided.
                gps_accuracy:
                  type: string
                  description: Accuracy of the user's device GPS
            examples:
              default:
                value:
                  client: CLIENT_GOES_HERE
                  location_id: '304155'
                  receipt_url: IMAGE_URL_GOES_HERE
  /api2/mobile/checkins:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    created_at:
                      type: string
                      enum:
                      - YYYY-MM-DDThh:mm:ssZ
                      format: date-time
                      description: Date/time when the check-in was created in the system, in [ISO 8601](http://en.wikipedia.org/wiki/ISO_8601) format
                    location_id:
                      type: integer
                      description: Unique location ID associated with the check-in
                    location_name:
                      type: string
                      description: Name of the location associated with the check-in
                    store_number:
                      type: string
                      description: Number of the store where the check-in occurred
                    status:
                      type: string
                      description: 'Defines the type of check-in. Values returned are:

                        - gift

                        - loyalty

                        - referral'
                    pending_refresh:
                      type: boolean
                      description: Whether the check-in is pending refresh or not
                    checkin_id:
                      type: integer
                      description: Unique ID of the check-in
                    expiring_on:
                      type: string
                      enum:
                      - YYYY-MM-DD
                      format: date
                      description: Date on which the check-in will expire
              examples:
                default:
                  value:
                  - created_at: '2016-05-06T11:23:03+00:00'
                    location_id: 304252
                    location_name: ADDRESS_GOES_HERE
                    store_number: ''
                    status: gift
                    pending_refresh: false
                    checkin_id: 10895576
                    expiring_on: null
        '401':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: integer
              examples:
                default:
                  value:
                    errors:
                      message: Access is denied due to invalid credentials.
                      code: 401
      summary: Fetch Check-ins
