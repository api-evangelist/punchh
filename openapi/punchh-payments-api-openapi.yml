      description: The array contains one or more menu item objects added to an order. You send one of these arrays per API call. See [How To Send Menu Items to Punchh](/docs/dev-portal-pos/5277d762b8c6d-how-to-send-menu-items-to-punchh)
      x-examples: []
      x-stoplight:
        id: 999c1d2fce704
      items:
        x-stoplight:
          id: ua9wyw12mqzms
        type: object
        properties:
          item_name:
            type: string
            x-stoplight:
              id: rwiq1fr8m64uz
            description: Name of the menu item as it displays in the POS catalog
          menu_item_id:
            type: string
            x-stoplight:
              id: puslpoyol0fta
            description: Unique identifier that your POS system uses for the item
          item_qty:
            type: string
            x-stoplight:
              id: 09u6t66ixp3l5
            description: Quantity ordered by the customer. If the item is a modifier (such as extra cheese on a pizza base item), make sure the quantity reflects the total number of base items included. For example, if you have a pizza base item with a certain item ID and a quantity of two, and the pizzas each have an extra cheese modifier added to them, then the modifier quantity should be two to account for the modifier across both pizzas. This applies only to base items of the same ID. If different base items include the same modifier, you do not need to sum the modifiers.
          item_amount:
            type: number
            x-stoplight:
              id: enlxfkrx0rn4y
            description: The total price of the line item or the amount of the discount that you applied to an item. In case of multiple quantities, this means the sum total of all item amounts. Always represent this value as a positive number, even when the item is a discount.
            format: float
          menu_item_type:
            type: string
            x-stoplight:
              id: s9g0hrpzxtlmj
            description: 'The classification of the item. Choose from the following types based on the item:


              M - Menu item ( + or - )


              D - Discount (negative). Either internal or Punchh will always evaluate lines as ( - ) regardless of the sign assigned in the API call


              S - Service item. Any item representing money received that is not a sale. For example, service charges, delivery fees, tips, purchase of gift cards/certificates, etc. In the case of single scan flow, send a menu item with service menu item type for the selected tip amount.


              T - Tax item. Taxes of all sorts


              P - Payment item. Visa, MasterCard, cash, gift card/certificate (when used to pay for the order)'
          menu_major_group:
            type: string
            x-stoplight:
              id: vfop7bejx00ec
            description: The major group that the item belongs to. The major group is the parent category for the item. Even though the parameter is required, you can pass it in the request with a blank value. You can leave this blank if the item does not belong to a major group.
          menu_family:
            type: string
            x-stoplight:
              id: 1fv71gjx6ks8i
            description: The family that the item belongs to. The family is the subcategory for the item. Even though the parameter is required, you can pass it in the request with a blank value. You can leave this blank if the item does not belong to a family.
          serial_number:
            type: string
            x-stoplight:
              id: iqs1adyj21swi
            description: A serialized number that differentiates distinct items on the check. The purpose of this field is to identify which items on the check are base items and which items are modifiers to the base items. For example, a main menu item (such as pizza) may have serial number "1.0", and the associated modifiers (such as "extra cheese", "olives", and "jalapenos") may have serial numbers "1.1", "1.2", and "1.3" respectively. Serialization is limited to one decimal point, so you can only modify the base item. You cannot modify a modifier with 1.x.x, and so on.
        required:
        - item_name
        - menu_item_id
        - item_qty
        - item_amount
        - menu_item_type
        - menu_major_group
        - menu_family
        - serial_number
