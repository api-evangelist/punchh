      operationId: get-api-auth-discounts-active
      parameters:
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/accept language'
      description: '- Get a list of discount details that have been selected by a guest. Only one active
        basket can exist in the system for a particular guest.

        - If a discount expires after being added to the discount basket, it is removed from the discount
        basket. When you make a call to the API, it validates the discounts added to the discount basket.
        If one or more discounts are found to be honored, expired, perished, or archived, the API returns
        an error message indicating that these discounts cannot be honored. The API lists the invalid
        discounts in the `discount_basket_items` object with a message stating that the discount is invalid
        and returns a null value in the `discount_details` object.'
      x-stoplight:
        id: 1d4f01cf7aa32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
              required:
              - client
            examples:
              Example:
                value:
                  client: CLIENT_GOES_HERE
    parameters: []
  /api2/mobile/single_scan_tokens:
    post:
      summary: Get Access Code (Redemptions 2.0)
      operationId: post-api-mobile-single_scan_tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_in:
                    type: string
                    format: date-time
                    description: Token expiration timestamp, in YYYY-MM-DDThh:mm:ss format. The token
                      TTL (time to live) is 5-10 minutes.
                  created_at:
                    type: string
                    format: date-time
                    description: Token creation timestamp, in YYYY-MM-DDThh:mm:ss format
                  single_scan_code:
                    type: string
                    description: '6-digit token (one time authentication code) '
              examples:
                Example:
                  value:
                    expires_in: '2022-06-08T09:59:10Z'
                    created_at: '2022-06-08T09:54:10Z'
                    single_scan_code: 4E43DB
        '400':
          description: 'Bad Request - Example error responses:

            - Required parameter missing or the value is empty: transaction_token

            - Required parameter missing or the value is empty: gift_card_uuid

            - Required parameter missing or the value is empty: transaction_token '
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: "Unprocessable Entity - Example error responses:\n- This guest has been banned\
            \ or deactivated from the loyalty program\n- Not valid coupon code \n- Not valid gift card\
            \ \n- Not valid redeemable\n- Not valid redemption code \n- Not valid reward "
          content:
            application/json:
              schema:
                type: object
                properties: {}
      description: 'This API returns the single-scan code containing a UUID string in the API response.
        The loyalty user can use the single-scan code to pay, earn, and redeem a reward/offer with a single
        scan at the POS store. The value of the `single_scan_code` parameter returned in the API response
        can then be passed as the `otp` (one-time passcode) with the `lookup_field` parameter in the request
        of the [Find User](/docs/dev-portal-pos/ce2bc2798ed8f-find-user-redemptions-2-0) POS API. The
        OTP is a short-lived token generated via mobile app to securely identify guest users at the POS.
        The token expiration can be configured in the Punchh platform (contact your Punchh representative
        for more information). A user can generate only one token at a time. Each token is 6-34 alphanumeric
        characters.


        **Note**: This mobile API endpoint (`POST {server-name}/api2/mobile/single_scan_tokens`) used
        for Redemptions 2.0 is the same as the [Generate a Single Scan Code](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1single_scan_tokens/post)
        mobile API endpoint. When using this API with Redemptions 2.0, the following offers parameters
        must NOT be included with the request body:

        - `reward_id`

        - `redeemable_id`

        - `banked_reward_amount`

        - `coupon`

        - `redeemable_card_count`

        '
      parameters:
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/signature'
      x-stoplight:
        id: ee950fa86dc60
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                payment_type:
                  type: string
                  description: 'Method of payment. Accepted values: `CreditCard` and `GiftCard`'
                gift_card_uuid:
                  type: string
                  description: Identification number for gift card
                tip:
                  type: string
                  description: Discretionary amount for tipping
              required:
              - client
            examples:
              Example:
                value:
                  payment_type: GiftCard
                  gift_card_uuid: UUID_GOES_HERE
                  tip: '1'
                  client: CLIENT_GOES_HERE
x-stoplight:
  id: 7f560cdc414d9
openapi: 3.1.1
servers:
- url: https://SERVER_NAME_GOES_HERE.punchh.com
components:
  schemas:
    discount_basket_items:
      title: Discount Basket Items (Object)
      x-stoplight:
        id: 3a95e69093e06
      type: array
      description: List of discounts. In the case of the [Get Active Discount Basket](/docs/dev-portal-mobile/1d4f01cf7aa32-get-active-discount-basket-redemptions-2-0)
        API, the object lists invalid discounts with a message stating that the discount is invalid.
      x-examples:
        Example:
        - discount_basket_item_id: 4699
          discount_type: reward
          discount_id: 131
          discount_value: null
          created_at: '2022-08-25T10:03:48Z'
      items:
        type: object
        properties:
          discount_basket_item_id:
            type: integer
            description: Unique identifier of selection
          discount_type:
            type: string
            description: 'The discount type can be any one of these values: card_completion || reward
              || redeemable || discount_amount || redemption_code || subscription || fuel_reward. For
              details, see [this topic](/docs/dev-portal-online-ordering/0130fe9413a97-getting-started-with-online-ordering-ap-is).'
          discount_id:
            type: string
            x-stoplight:
              id: jvv1cvfe8867j
            description: Discount ID
          discount_value:
            type: number
            x-stoplight:
              id: 8ltcw4fxx2zln
            format: float
            description: Value of the currency that a user wants to redeem. This value is set for users
              on the “Points Convert to Currency” loyalty program. The default value is 0 if the user
              has not selected any amount to redeem or has no currency in the loyalty account. The parameter
              returns a “null” value for a business that does not support banking of points into currency.
          created_at:
            type: string
            format: date-time
            description: Date/time when the discount was selected, in YYYY-MM-DDThh:mm:ss format
          message:
            type: string
            x-stoplight:
              id: mvcz3ropxwxdh
            description: Error message for invalid discount. If a discount is found to be honored, expired,
              perished, or archived, the API returns an error message in the parameter for the discount
              indicating that the discount is invalid.
          discount_details:
            $ref: '#/components/schemas/discount_details'
    discount_details:
      title: Discount Details (Object)
      x-stoplight:
        id: noljr9gca8tp2
      type: object
      description: List of a discount's defining attributes. In the case of the [Get Active Discount Basket](/docs/dev-portal-mobile/1d4f01cf7aa32-get-active-discount-basket-redemptions-2-0)
        API, the object returns a null value for invalid discounts.
      properties:
        item_id:
          type: integer
          x-stoplight:
            id: dzbgkuiaedmd4
          description: Item ID
        name:
          type: string
          x-stoplight:
            id: cfwtxznuxpv5k
          description: External discount name.<br><br>The `name` value is returned in the language specified
            in the Accept-Language request header, provided the redeemable name and subscription plan
            name have been translated into the relevant language in the Punchh platform. If the translation
            is unavailable, the response returns the value for this parameter in the default English language.
            For example, if the header specifies “fr” (French), the name is returned in French if a French
            translation is configured for the name in the Punchh platform; otherwise the value is returned
            in the default English language.
        image:
          type: string
          x-stoplight:
            id: efix5ltar4jgl
          description: Image URL of the reward
        points:
          type: integer
          x-stoplight:
            id: yaw6j2qsj0lbe
          description: Points associated with the current reward
        base_amount:
          type: integer
          x-stoplight:
            id: evtw0jopy5sg8
          description: Discounted value
        description:
          type: string
          x-stoplight:
            id: hdui8b505fjib
          description: Description that explains rewards as configured in the Punchh platform.<br><br>The
            `description` value is returned in the language specified in the Accept-Language request header,
            provided the descriptions of redeemable and subscription have been translated into the relevant
            language in the Punchh platform. If the translation is unavailable, the response returns the
            value for this parameter in the default English language. For example, if the header specifies
            “fr” (French), the description is returned in French only if a French translation is configured
            for the description in the Punchh platform; otherwise the value is returned in the default
            English language.
        item_properties:
          type: string
          x-stoplight:
            id: qdl59fzarps1y
          description: Comma-separated values that provide additional details about a redeemable. For
            example, a redeemable could be a "Food_Item" or "Merchandise", etc. Can be configured for
            a business in the Punchh platform and attached to a redeemable. If no value is attached to
            a redeemable, a blank field will be returned.
        meta_detail:
          type: string
          x-stoplight:
            id: awpgx7okp6v3i
          description: 'Meta information configured for `discount_type` values: redemption_code, subscription,
            reward, and redeemable. The response returns a value only if the meta data field is configured
            in the Punchh platform when creating the discount. Currently, the Punchh platform supports
            multilingual values for `meta_detail` only for coupon redemption. <br><br>The `meta_detail`
            value for the coupon redemption (i.e., when discount_type = redemption_code) is returned in
            the language specified in the Accept-Language request header, provided the coupon meta data
            has been translated into the relevant language in the Punchh platform. If the translation
            is unavailable, the response returns the value for this parameter in the default English language.
            For example, if the header specifies “fr” (French), the `meta_data` value for a coupon is
            returned in French only if a French translation is configured for the coupon meta data in
            the Punchh platform; otherwise the value is returned in the default English language.'
