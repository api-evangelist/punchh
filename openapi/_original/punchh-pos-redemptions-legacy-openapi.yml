      summary: Void Redemption (Redemptions 1.0)
      description: 'Voids a processed redemption. After a redemption is voided successfully, the offer
        tied to the redemption is returned to the guest''s account.


        <b>Note</b>: The Void Redemption API allows you to cancel a redemption without any time restrictions
        for most types of redemptions. However, for coupons and promos, redemptions can only be voided
        within 24 hours of the redemption process.


        For information about voiding multiple redemptions, see [this page](/docs/dev-portal-pos/b3A6NTAyODM5MjM-void-multiple-redemptions).

        '
      operationId: pos_void_redemption
      parameters:
      - schema:
          type: string
          default: Token token=LOCATION_KEY_GOES_HERE, btoken=BUSINESS_KEY_GOES_HERE
        in: header
        name: Authorization
        description: This is a combination of unique API key as well as business key (UUID) as the Authorization
          header.
        required: true
      x-stoplight:
        id: 6a46fbaa33b28
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email address of the user acocunt from which you are voiding the redemption. '
                single_scan_code:
                  type: string
                  description: Single scan code of the user is a required parameter when the user redeems
                    a reward through the single scan flow. The code identifies the user requesting the
                    redemption.
                redemption_id:
                  type: integer
                  format: int64
                  description: Redemption ID returned when the redemption is created.
                card_number:
                  type: string
                  description: 'Loyalty debit card number used by some businesses to locate the guest
                    account. '
                phone:
                  type: string
                  description: 'Phone number of the user account from which you are voiding the redemption. '
                redemption_code:
                  type: string
                  description: 'To be entered if the redemption ID is not being provided. If both redemption_id
                    and redemption_code are provided, then only redemption_id will be processed. redemption_code
                    must be used to void coupon and promo codes. '
                transaction_no:
                  type: string
                  description: Transaction number sent at the time of redemption. Used only with promos
                    and coupons.
              required:
              - email
              - single_scan_code
              - redemption_id
              - redemption_code
              - transaction_no
