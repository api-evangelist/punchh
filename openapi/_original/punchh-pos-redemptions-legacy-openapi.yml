          menu_item_type:
            type: string
            x-stoplight:
              id: 9rga2on21ieb4
            description: 'The classification of the item. Displays one from the following types based
              on the item:


              M - Menu item ( + or - )


              D - Discount (negative). Either internal or Punchh will always evaluate lines as ( - ) regardless
