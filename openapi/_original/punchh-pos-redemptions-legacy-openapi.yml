components:
  schemas:
    discount_distribution_items:
      type: array
      title: Discount Distribution Items (Array Object)
      description: 'An array containing details of how the applied discount is distributed across individual
        menu items. Each object represents one line item that receives a portion of the discount.

        '
      items:
        type: object
        properties:
          item_name:
            type: string
            description: Name of the discounted menu item as it displays in the POS catalog
          menu_item_id:
            type: string
            description: Unique identifier that your POS system uses for the discounted menu item
          item_qty:
            type: number
            description: Quantity associated with the discounted item.
          item_amount:
            type: number
            description: A negative amount that indicates a reduction in price. The sum of all `item_amount`
              values across the array equals the total discount applied.
          menu_item_type:
            type: string
            description: 'The classification of the item.


              R - Redemption Discount item (negative). The `menu_item_type` attribute will always be set
              to "R" to indicate that it is a redemption-related discount. If a user redeemed a reward
              giving $3 off, the response may include a line with `menu_item_type` as "R" and `item_amount`
              as -3.'
          menu_major_group:
            type: string
            description: The major group that the discounted item belongs to
          menu_family:
            type: string
            description: The family that the discounted item belongs to
          serial_number:
            type: number
            description: A serialized number that differentiates distinct items on the check. The value
              in the field identifies which items on the check are base items and which items are modifiers
              to the base items. For example, a main menu item (such as pizza) may have serial number
              1.0, and the associated modifiers (such as "extra cheese", "olives", and "jalapenos") may
              have serial numbers 1.1, 1.2, and 1.3 respectively.
    menu_items:
      type: array
      title: Menu Items (Array Object)
      description: This object contains one or more menu items added to an order. See [How To Send Menu
        Items to Punchh](/docs/dev-portal-pos/5277d762b8c6d-how-to-send-menu-items-to-punchh)
      x-examples: []
      x-stoplight:
        id: 9577f63ac492c
      items:
        x-stoplight:
          id: d2wcrc5022zez
        type: object
        properties:
          item_name:
            type: string
            x-stoplight:
              id: fkconmtw6b4eq
            description: Name of the menu item as it displays in the POS catalog
          menu_item_id:
            type: string
            x-stoplight:
              id: wk34fzkfu65ep
            description: Unique identifier that your POS system uses for the item
          item_qty:
            type: number
            x-stoplight:
              id: xv5vwx8ys5r3u
            description: Quantity ordered by the customer. If the item is a modifier (such as extra cheese
              on a pizza base item), make sure the quantity reflects the total number of base items included.
              For example, if you have a pizza base item with a certain item ID and a quantity of two,
              and the pizzas each have an extra cheese modifier added to them, then the modifier quantity
              should be two to account for the modifier across both pizzas. This applies only to base
              items of the same ID. If different base items include the same modifier, you do not need
              to sum the modifiers.
          item_amount:
            type: number
            x-stoplight:
              id: am9k9c14tfekn
            description: The total price of the line item or the amount of the discount that you applied
              to an item. In case of multiple quantities, this means the sum total of all item amounts.
              Always represent this value as a positive number, even when the item is a discount.
          menu_item_type:
            type: string
            x-stoplight:
              id: kk109twugwy9d
            description: '

              The classification of the item. Choose from the following types based on the item:


              M - Menu item ( + or - )


              D - Discount (negative). Either internal or Punchh will always evaluate lines as ( - ) regardless
              of the sign assigned in the API call. We do not recommend sending any line item types set
              to D in any Redemptions 1.0 requests. Instead, send them in the [Create Loyalty Check-in](/docs/dev-portal-pos/52632fd1c0ab1-create-check-in)
              and [Receipt Details](/docs/dev-portal-pos/a8dca5f5b047e-store-receipt-details-from-pos)
              API calls.


              If any items with line item type D are sent in these requests, the business will require
              additional configuration for all offers to filter out the line item type D. See the [Qualification
              Criteria](https://support.punchh.com/s/article/Qualification-Criteria) article on the Support
              Portal. Note: To view the Punchh product documentation on the Punchh Support Portal, you
              must log in to a Punchh platform production environment. If you already have access to a
              production environment, follow the instructions here to access the Punchh Support Portal.


              Any non-loyalty discounts should be reflected in reduced totals of the line items of type
              M that the discounts apply to. For example, if a business offers a $2 discount on a $10
              burger, send the burger as $8 ($10 - $2) in the API request.


              Note: See [Multiple Redemptions Example](/docs/dev-portal-pos/5277d762b8c6d-how-to-send-menu-items-to-punchh#multiple-redemptions-example)
              for processing multiple discounts.


              S - Service item. Any item representing money received that is not a sale. For example,
              service charges, delivery fees, tips, purchase of gift cards/certificates, etc. In the case
              of a single scan flow, send a menu item with a service menu item type for the selected tip
              amount.


              T - Tax item. Taxes of all sorts


              P - Payment item. Visa, MasterCard, cash, gift card/certificate (when used to pay for the
              order).'
          menu_major_group:
            type: string
            x-stoplight:
              id: xm7pxc8bt0opy
            description: The major group that the item belongs to. The major group is the parent category
              for the item. Even though the parameter is required, you can pass it in the request with
              a blank value. You can leave this blank if the item does not belong to a major group.
          menu_family:
            type: string
            x-stoplight:
              id: icvf9xp5e11jo
            description: The family that the item belongs to. The family is the subcategory for the item.
              Even though the parameter is required, you can pass it in the request with a blank value.
              You can leave this blank if the item does not belong to a family.
          serial_number:
            type: string
            x-stoplight:
              id: nm5g9pe9zjsqw
            description: A serialized number that differentiates distinct items on the check. The purpose
              of this field is to identify which items on the check are base items and which items are
              modifiers to the base items. For example, a main menu item (such as pizza) may have serial
              number "1.0", and the associated modifiers (such as "extra cheese", "olives", and "jalapenos")
              may have serial numbers "1.1", "1.2", and "1.3" respectively. Serialization is limited to
              one decimal point, so you can only modify the base item. You cannot modify a modifier with
              1.x.x, and so on.
        required:
        - item_name
        - menu_item_id
        - ' item_qty'
        - item_amount
        - menu_item_type
        - menu_major_group
        - menu_family
        - serial_number
