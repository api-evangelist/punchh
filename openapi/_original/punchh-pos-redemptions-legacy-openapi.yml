                  type: string
                  description: Email address of the user
                menu_items:
                  $ref: '#/components/schemas/menu_items'
                receipt_amount:
                  type: number
                  format: double
                  description: Order amount before taxes, calculated as the sum of all item amounts minus
                    any discounts. This is the amount used to calculate loyalty points/visits. The value
                    of this parameter should match `subtotal_amount`. For example, if the order amount
                    is $10, both `receipt_amount` and `subtotal_amount` will be 10. If a $2 discount is
                    applied, both will be 8.
                subtotal_amount:
                  type: number
                  format: double
                  description: Order amount before taxes (sum of all item amounts minus any discounts).
                    Same as `receipt_amount`. For historical reasons, include this parameter along with
                    `receipt_amount` in the API request.
                amount:
                  type: number
                  format: double
                  description: Order amount before any taxes (sum of all amounts minus any discounts).
                    This is the amount upon which loyalty points/visits are granted. The value of this
                    parameter should be the same as that of subtotal_amount. For example, if the order
                    amount is $10, parameters receipt_amount and subtotal_amount will hold the value 10.
                    Say if a $2 discount has been applied to the same order, subtotal_amount and receipt_amount
                    will become $8.
                receipt_datetime:
                  type: string
                  description: Timestamp of receipt per ISO 8601 format including TZ offset from UTC (YYYY-MM-DDThh:mm:ss-±hh:mm)
                  x-stoplight:
                    id: wcq1t60ezo6i8
                channel:
                  type: string
                  x-stoplight:
                    id: pttj0737be5h1
                  enum:
                  - pos
                  - kiosk
                  description: 'Channel through which the order was placed. If a channel is defined in
                    the Receipt Qualifier condition under Offers > Qualification Criteria in the Punchh
                    platform, the API returns the list of offers applicable to the transaction after evaluating
                    the value set for the channel. Possible values: pos, kiosk.'
              required:
              - email
              - menu_items
              - receipt_amount
              - subtotal_amount
              - amount
              - receipt_datetime
              - channel
            examples:
              Request:
                value:
                  email: test@example.com
                  receipt_amount: 300
                  menu_items:
                  - item_name: Whiterice
                    item_qty: 1
                    item_amount: 2.86
                    menu_item_type: M
                    menu_item_id: '3419'
                    menu_family: '800'
                    menu_major_group: '152'
                    serial_number: '1.0'
                  - item_name: Brownrice
                    item_qty: 1
                    item_amount: 7.86
                    menu_item_type: M
                    menu_item_id: '3418'
                    menu_family: '800'
                    menu_major_group: '152'
                    serial_number: '2.0'
                  amount: 300
                  subtotal_amount: 300
                  receipt_datetime: '2020-03-06T15:01:55.704Z'
                  channel: pos
