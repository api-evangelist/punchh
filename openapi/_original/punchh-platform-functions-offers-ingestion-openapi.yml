          items:
            x-stoplight:
              id: tuue0psh30q24
            type: object
            properties:
              attribute:
                type: string
                x-stoplight:
                  id: m2yei58cpf9dm
                description: 'The attribute(s) to filter items that should be included in the offer or
                  promotion. The filtering can be done based on specific characteristics of the items.
                  For modifier items, you will complete at least one of the following attributes. Possible
                  values for the attribute(s) are:

                  * item_name: Filter the item using the item name in your POS system (e.g., "Sandwich").

                  * item_id: Filter item(s) using their unique identifier or product code in your POS
                  system. This is the third and most specific level in the POS hierarchy.

                  * quantity: Filter based on the number of units purchased (e.g., "at least 2 sandwiches").

                  * item_family: Filter the item using the unique ID of the item’s family in your POS
                  system (e.g., "1001" or "2002"). This is the middle (second) level in the POS hierarchy.

                  * item_major_group: Filter the item using the unique ID of the major grouping of items
                  in your POS system (e.g., "1000" or "2000"). The major group ID is the top level in
                  the POS hierarchy, above the family group and item ID.

                  * item_serial_number: Filter the item using the item’s serial number in your POS system.

                  * line_item_type: Filter based on the type of the menu item (e.g., "M", "D"). Possible
                  values: Menu Item (M), Discount (D), Service Charge (S), Extra (X), Tax (T), or Payment
                  (P) such as a gift card

                  * item_total_amount: Filter based on the exact price or range of prices (e.g., items
                  above a certain amount).

                  This allows businesses to apply targeted rules to specific items or item groups within
                  a transaction for promotions, discounts, or rewards. For example, if you want to create
                  an LIS that only applies to items with a specific item ID or name, you would use one
                  of these values to define the filtering criteria.'
