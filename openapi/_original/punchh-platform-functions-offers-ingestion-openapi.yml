                            line_item_selector:
                              $ref: '#/components/schemas/qc_line_item_selector'
                      item_qualifiers:
                        $ref: '#/components/schemas/item_qualifiers'
                      receipt_qualifiers:
                        $ref: '#/components/schemas/receipt_qualifiers'
