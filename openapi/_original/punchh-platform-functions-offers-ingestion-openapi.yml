  parameters:
    Accept:
      schema:
        type: string
      name: Accept
      in: header
      required: false
      description: Set this header to <b>application/json</b>
    Authorization:
      schema:
        type: string
        default: Bearer BUSINESS_ADMIN_KEY_GOES_HERE
      name: Authorization
      in: header
      required: true
      description: 'Bearer token for admin authorization, who is making a call on behalf of the customer.
        Send the API key in the following format: "Authorization: Bearer BUSINESS_ADMIN_KEY_GOES_HERE".'
    Content-Type:
      schema:
        type: string
      name: Content-Type
      in: header
      required: false
      description: Set this header to <b>application/json</b>
  responses:
    '400':
      description: Bad Request - Required parameter missing or empty
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-stoplight:
                  id: xtdcx8losb5tq
          examples:
            Required parameter missing or empty:
              value:
                error: 'Required parameter missing or the value is empty: data'
    '401':
      description: Unauthorized - User not authenticated or created
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-stoplight:
                  id: rnkpi6hfoveqy
          examples:
            User not authenticated or created:
              value:
                error: You need to sign in or sign up before continuing.
    '403':
      description: Forbidden - Functionality not available
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-stoplight:
                  id: un1ov0n2c1o1w
          examples:
            Functionality not available:
              value:
                error: Sorry, this functionality is not available. Please contact support@punchh.com to
                  enable this.
