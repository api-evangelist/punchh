        ### PATCH Requests: Partial Updates and Nested Object Replacements

        PATCH requests allow you to update specific parameters of a Redeemable object without affecting
        others. You only need to include the parameters you want to modify. For example, you can update
        only the `allow_for_support_gifting` parameter in a Redeemable object.


        When updating a nested object (e.g., `receipt_rule`, `template`, `lag_duration`, `recurrence_schedule`),
        the entire nested object is replaced with the valid values provided in the request. Invalid values
        are ignored.


        Additional rules when updating nested objects:

        * If all provided values are invalid, the existing values remain unchanged.

        * If an empty nested object is provided, the existing values are deleted.

        * If the nested object or any of its parameters is omitted, existing values remain unaffected.


        To call this API, the offers ingestion option must be enabled for the business on the Punchh platform.
