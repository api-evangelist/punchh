          maximum: 99999
        percentage_of_processed_amount:
          type: number
          x-stoplight:
            id: xwie3xvrgdw2q
          format: float
          description: Percentage of processed amount that can be earned/redeemed on any receipt. The
            value should be greater than or equal to 0 and less than or equal to 99999 if provided.
          minimum: 0
          maximum: 99999
        qc_processing_function:
          type: string
          x-stoplight:
            id: w7xhz6u0ksna8
          description: "Function applied on filtered menu items of the receipt. Processing functions return\
            \ a processed value that governs discounting and earning depending on where the qualification\
            \ criterion are attached. If it is applied in a discounting scenario, the processed value\
            \ controls the discount amount. If it is applied in an earning scenario (e.g., a rewards program),\
            \ the processed value controls how much is earned (such as reward points). \n\nPossible values:\
            \ hit_target_price, rate_rollback, bundle_price_target, bundle_price_target_advanced, hit_target_price_max_price_once,\
            \ hit_target_price_min_price_once, sum_amounts_incremental, static_amount, receipt_subtotal,\
            \ bogof, bogof2, sum_amounts, receipt_total_amount, sum_qty\n\nFor more information on possible\
            \ values, see the [Processing Functions](https://support.punchh.com/s/article/Processing-Functions)\
            \ article on the Punchh Support Portal.\n\nNote: To view the Punchh product documentation\
            \ on the Punchh Support Portal, you must log in to a Punchh platform production environment.\
            \ If you already have access to a production environment, follow the instructions [here](https://support.punchh.com/s/article/How-do-I-access-the-Punchh-Support-Portal-Single-Sign-On)\
            \ to access the Punchh Support Portal."
        rounding_rule:
          type: string
          x-stoplight:
            id: zoqkuij01oaud
          description: "If the processing function returns a float value, it will be rounded according\
            \ to the chosen rounding rule. If no rule is selected, the float value will be used as is.\
            \ A value is required to be sent in the parameter depending on the processing function selected.\
            \ Possible values: \n* round: This rule rounds the float value to the nearest integer. If\
            \ the decimal part is 0.5 or higher, the value is rounded up. If the decimal part is less\
            \ than 0.5, the value is rounded down. For example, 4.3 becomes 4, and 4.7 becomes 5.\n* ceil:\
            \ This rule rounds the float value up to the next highest integer, regardless of the decimal\
            \ part. For example, 4.3 becomes 5.\n* floor: This rule rounds the float value down to the\
            \ next lowest integer, regardless of the decimal part. For example, 4.3 becomes 4."
        max_discount_units:
          type: integer
          x-stoplight:
            id: kn49zs35liiog
          description: This value limits the number of units that can be discounted. A value is required
            to be sent in the parameter depending on the processing function (`qc_processing_function`)
            types selected, such as rate_rollback, bundle_price_target, bundle_price_target_advanced,
            and sum_amounts_incremental.
          minimum: 1
        unit_discount:
          type: number
          x-stoplight:
            id: k2cfku19gv7ee
          description: Discount to be applied to the rate of the selected items chosen for the offer or
            promotion. The discount is based on a specific rate (e.g., per unit of item - per gallon,
            per liter, etc.). For example, for a fuel discount of 20 cents per gallon, you need to specify
            the discount in a decimal format (0.2) to reflect a 20-cent reduction for each gallon of fuel.
            If the qualification criteria are attached to a subscription plan, the value of the unit discount
            will be picked up from the subscription plan, and even though you are required to enter a
            value for the discount (e.g., 0.2 for 20 cents), <b>this value will be ignored</b> if the
            qualification criteria are part of a subscription plan, because the discount will be controlled
            by the subscription plan's settings instead. The value should be greater than or equal to
            0.01 and less than or equal to 99999 if the processing method (`qc_processing_function`) is
            rate_rollback. A value is required to be sent in the parameter depending on the processing
            function selected.
          format: float
          maximum: 99999
          minimum: 0.01
        minimum_unit_rate:
          type: number
          x-stoplight:
            id: p5an5geaz0kka
          description: Minimum unit price threshold. After applying the discount, the minimum unit rate
            should not be below this amount.  A value greater than or equal to 0.01 and less than or equal
            to 99999 is required if the processing method (`qc_processing_function`) is rate_rollback.
          minimum: 0.01
          maximum: 99999
        target_price:
          type: integer
          x-stoplight:
            id: 96n35s1vh5b88
          description: Discount selected menu items to achieve this target unit price. For example, if
            locations sell a burger for variable pricing, a target unit price is achieved by using the
            appropriate processing function. If a burger is sold at different prices at different locations
            (e.g., one location sells it for $10, another for $12), you can set a target price (e.g.,
            $9) to standardize the price across locations. The system applies discounts to bring the price
            down to $9, no matter what the original price was. A value is required to be sent in the parameter
            depending on the processing function (`qc_processing_function`) types selected, such as hit_target_price,
            hit_target_price_max_price_once, hit_target_price_min_price_once, bundle_price_target, and
            bundle_price_target_advanced.
        effective_location:
          type: string
          x-stoplight:
            id: 0shnef5xs778r
          description: A valid or existing location ID or location group ID. The default value is null.
            Restricts redemption to the specified location(s). If a specific location needs to be specified,
            use the format "location:<punchh_location_id>”. If a location group needs to be selected,
            use the format "tag:<location_group_id>”.
        stack_discounting:
          type: boolean
          x-stoplight:
            id: vgcyndom3xq2v
          description: When stacking is set to true, this discount can be redeemed with any other discount
            that contains the same target item. If set to false, only one discount can be applied to the
            target item, even if multiple discounts are available. "Y", "YES", "1", "TRUE", and "ON" (case-insensitive)
            are treated as true. Any other values are considered false.
        reuse_qualifying_items:
          type: boolean
          x-stoplight:
            id: nlw6bw79udofe
          description: When set to true, it allows qualifying item(s) to be reused when redeemed with
            other discounts that apply to the same item(s). When set to false, it restricts qualifying
            item(s) from being reused for multiple discounts. "Y", "YES", "1", "TRUE", and "ON" (case-insensitive)
            are treated as true. Any other values are considered false.
        qualifying_expressions_operator:
          type: string
          x-stoplight:
            id: zhl3mem3g88kn
          description: 'Specifies how offer conditions in `item_qualifiers` are evaluated. Possible values:
            All, Any. The default value is "All". Use "All" when every condition must be met, or "Any"
            when satisfying at least one condition is sufficient.'
        item_filter_expressions_operator:
          type: string
          x-stoplight:
            id: 55psu44tsnb6d
          description: 'Specifies how offer conditions in `line_item_filters` are evaluated. Possible
            values: All, Any. The default value is "All". Use "All" when every condition must be met,
            or "Any" when satisfying at least one condition is sufficient.'
        discount_evaluation_strategy:
          type: string
          x-stoplight:
            id: 4bp3rh2ao6mbu
          description: 'Specifies whether the maximum or minimum discount should be applied when multiple
            conditions are met. Note: This parameter should be provided when `item_filter_expressions_operator`
            is set to Any. Possible values: Min, Max. The default value is "Min".'
        line_item_filters:
          $ref: '#/components/schemas/qc_line_item_filters_input'
        enable_menu_item_aggregator:
          type: boolean
          x-stoplight:
            id: a0i7wql9fvp37
          description: Whether the system will combine (aggregate) multiple instances of the same menu
            item into one entry based on the attributes defined in `aggregator_grouping_attributes`. "Y",
            "YES", "1", "TRUE", and "ON" (case-insensitive) are treated as true. Any other values are
            considered false.
        aggregator_grouping_attributes:
          $ref: '#/components/schemas/aggregator_grouping_attributes'
        item_qualifiers:
          $ref: '#/components/schemas/qc_item_qualifiers_input'
        receipt_qualifiers:
