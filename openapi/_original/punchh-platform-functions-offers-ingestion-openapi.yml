      description: "Allows a business to update one or more qualification criteria. The same validations\
        \ as those in the [Create Qualification Criteria](/docs/dev-portal-platform-functions/009524a9d88ae-create-qualification-criteria-qc)\
        \ API will apply. You can bulk update a maximum of 20 qualification criteria per API call. If\
        \ the request input contains more than 20 QC, only the first 20 are created, and the remaining\
        \ are ignored.\n\nFor more information, see [Offers Ingestion Management](/docs/dev-portal-platform-functions/ms8qid5tdtvc6-offers-ingestion-management)\n\
        \n### PATCH Requests: Partial Updates and Nested Object Replacements\nPATCH requests allow you\
        \ to update specific parameters of a QC object without affecting others. You only need to include\
        \ the parameters you want to modify. For example, you can update only the `percentage_of_processed_amount`\
        \ parameter in a QC object.\n\nWhen updating a nested object (e.g., `line_item_filters`, `item_qualifiers`,\
        \ `receipt_qualifiers`, `aggregator_grouping_attributes`), the entire nested object is replaced\
        \ with the valid values provided in the request. Invalid values are ignored.\n\nAdditional rules\
        \ when updating nested objects:\n* If all provided values are invalid, the existing values remain\
        \ unchanged.\n* If an empty nested object is provided, the existing values are deleted.\n* If\
        \ the nested object or any of its parameters is omitted, existing values remain unaffected.\n\n\
        To call this API, the offers ingestion option must be enabled for the business on the Punchh platform.\
        \ Contact your Punchh representative to update this Punchh platform configuration.\n<!--Cockpit\
        \ > Dashboard > Miscellaneous Config > Enable Offers Ingestion-->\n\nFor more information on QC\
        \ settings, see the [Qualification Criteria](https://support.punchh.com/s/article/Qualification-Criteria)\
        \ article on the Support Portal. \n\nNote: To view the Punchh product documentation on the Punchh\
        \ Support Portal, you must log in to a Punchh platform production environment. If you already\
        \ have access to a production environment, follow the instructions [here](https://support.punchh.com/s/article/How-do-I-access-the-Punchh-Support-Portal-Single-Sign-On)\
        \ to access the Punchh Support Portal."
