            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
              examples:
                Feature disabled:
                  value:
                    errors: Your current configuration does not support this feature. Please connect with
                      your Customer Success representative for resolution of the issue.
      requestBody:
        content:
