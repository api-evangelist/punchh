  /api2/mobile/user_banking_preferences:
    put:
      responses:
        '200':
          description: 200 OK — Successful Update
          content:
            application/json:
              schema:
                type: object
                properties:
                  save_points_for_swag_enabled:
                    type: boolean
                    description: Indicates whether the guest has enabled saving points for swag redemption
                  saved_swag_points_threshold:
                    type: integer
                    minimum: 0
                    maximum: 999999
                    description: The number of points the guest has configured to reserve for swag redemption
                  swag_balance:
                    type: integer
                    minimum: 0
                    description: "The number of points currently accumulated in the swag balance. Calculated\
                      \ as the smaller of the user's available points balance and the configured `saved_swag_points_threshold`.\
                      \ \n\nFor example, if the guest has 100 points and the threshold is 200, the swag\
                      \ balance is 100. If the guest has 300 points and the threshold is 200, the swag\
                      \ balance is 200.\n\nReturns 0 when `save_points_for_swag_enabled` is false or `saved_swag_points_threshold`\
                      \ is 0.\n"
              examples:
                Save Points Disabled:
                  value:
                    save_points_for_swag_enabled: false
                    saved_swag_points_threshold: 0
                    swag_balance: 0
                Save Points Enabled — Available Points Below Threshold (100 points):
                  value:
                    save_points_for_swag_enabled: true
                    saved_swag_points_threshold: 200
                    swag_balance: 100
                Save Points Enabled — Active Swag Balance:
                  value:
                    save_points_for_swag_enabled: true
                    saved_swag_points_threshold: 200
                    swag_balance: 200
        '400':
          description: 'Bad Request

            - Missing required parameters — "Provide at least one of save_points_for_swag_enabled or saved_swag_points_threshold."

            '
        '401':
          description: 'Unauthorized

            - Missing or invalid access token — "An active access token must be used to query information
            about the current user."

            '
        '422':
          description: 'Unprocessable Entity

            - Save Points for Swag feature disabled — "Your current configuration does not support this
            feature. Please connect with your Customer Success representative for resolution of the issue."

            - Threshold not a number — "Saved swag points threshold is not a number"

            - Threshold exceeds maximum — "Saved swag points threshold must be less than or equal to 999999"

            '
      summary: Save Points for Swag
      description: "In Points Convert to Currency or Points Convert to Rewards loyalty programs, loyalty\
        \ users earn points on every purchase. By default, these points are automatically converted (\"\
        banked\") into rewards or currency. However, some loyalty users may prefer to accumulate their\
        \ points and redeem them for swag instead.\n\nThis API lets loyalty users manage their \"Save\
        \ Points for Swag\" preference from the mobile app. When the \"Save Points for Swag\" feature\
        \ is enabled for the brand, loyalty users can opt in or out of the feature and set a points threshold.\
        \ Points accumulated up to this threshold are reserved for swag redemption, while points earned\
        \ above the threshold are automatically converted into rewards or currency. This gives loyalty\
        \ users flexibility in how they use their points. If a loyalty user no longer wants to save points\
        \ for swag, they can update their preference to opt out.\n\n## Prerequisite\n\nBefore processing\
        \ the request, the API verifies that the \"Save Points for Swag\" feature is enabled for the brand\
        \ on the Punchh platform. If the feature is not enabled, the API returns an appropriate error\
        \ code and message. \n\n**Note**: Contact your Punchh representative to update this Punchh platform\
        \ configuration.\n\nOn success, the API responds with a **200 OK** status.\n<!--Cockpit > Redemptions\
        \ > Redemptions Properties > Allow members to save points for swag redemption-->\n\nSee [Get User\
        \ Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/get),\
        \ [Fetch Available User Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_merch/get),\
        \ [Redeem Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1swag_redemptions/post),\
        \ and [Get Swag Shipping Details](https://developers.partech.com/docs/dev-portal-platform-functions/apis/platform-functions-api/tag/swag/get/api2/dashboard/swag_shipping_details).\n"
      operationId: mobile_update_user_banking_preferences
      tags:
      - Swag
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                save_points_for_swag_enabled:
                  type: boolean
                  x-nullable: true
                  description: "Enables (true) or disables (false) the \"Save Points for Swag\" preference.\
                    \ The \"Save Points for Swag\" feature must be enabled for the brand. \n\nWhen enabled,\
                    \ the user's points are accumulated and saved for swag redemption up to the `saved_swag_points_threshold`.\
                    \ \n\nWhen disabled, no points are saved for swag, and all points are automatically\
                    \ converted into rewards/currency per the program rules. A null value (or omitting\
                    \ the parameter) is treated as 'false', which disables saving mode and resets `saved_swag_points_threshold`\
                    \ to 0. \n\n<b>Note</b>: Both `save_points_for_swag_enabled` and `saved_swag_points_threshold`\
                    \ parameters can be provided together or independently in a single request. At least\
                    \ one parameter must be provided; omitting both returns a 400 Bad Request error.\n"
                saved_swag_points_threshold:
                  type: integer
                  minimum: 0
                  maximum: 999999
                  x-nullable: true
                  description: 'The member-defined points threshold. Points accumulated up to this limit
                    are reserved for swag and excluded from automated banking conversion. Points above
                    this threshold are automatically converted into rewards or currency.


                    Must be a non-negative integer. Invalid values (for example, "abc") return a 422 Unprocessable
                    Entity error. The maximum allowed value is 999999; values exceeding this limit also
                    return a 422 Unprocessable Entity error.


                    If `save_points_for_swag_enabled` is ''false'' or null, this threshold is ignored
                    and treated as 0. If `save_points_for_swag_enabled` is ''true'' and this parameter
                    is omitted, it defaults to 0, meaning no points are reserved for swag, and all points
                    are eligible for automated banking conversion.


                    <b>Note</b>: Both `save_points_for_swag_enabled` and `saved_swag_points_threshold`
                    parameters can be provided together or independently in a single request. At least
                    one parameter must be provided; omitting both returns a 400 Bad Request error.

                    '
              required:
              - client
            examples:
              default:
                value:
                  client: CLIENT_KEY_GOES_HERE
                  save_points_for_swag_enabled: true
                  saved_swag_points_threshold: 500
    get:
      summary: Get User Save Points for Swag
      description: 'Retrieves a loyalty user''s "Save Points for Swag" banking preferences, including
        the save-points opt-in status, configured threshold, and the number of points currently accumulated
        toward swag redemption.


        ## Prerequisites


        - The business must have the "Save Points for Swag" feature enabled in the Punchh platform.


        - The business must support banked point debit.

        <!--Cockpit > Redemptions > Redemptions Properties > Allow members to save points for swag redemption-->


        If either condition is not met, the endpoint returns a 422 Unprocessable Entity error.


        **Note**: Contact your Punchh representative to update this Punchh platform configuration.


        See [Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/put),
        [Fetch Available User Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_merch/get),
        [Redeem Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1swag_redemptions/post),
        and [Get Swag Shipping Details](https://developers.partech.com/docs/dev-portal-platform-functions/apis/platform-functions-api/tag/swag/get/api2/dashboard/swag_shipping_details).'
      operationId: mobile_get_user_banking_preferences
      tags:
      - Swag
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  save_points_for_swag_enabled:
                    type: boolean
                    description: Indicates whether the guest has enabled saving points for swag redemption
                  saved_swag_points_threshold:
                    type: integer
                    minimum: 0
                    maximum: 999999
                    description: The number of points the guest has configured to reserve for swag redemption
                  swag_balance:
                    type: integer
                    minimum: 0
                    description: "The number of points currently accumulated in the swag balance. Calculated\
                      \ as the smaller of the user's available points balance and the configured `saved_swag_points_threshold`.\
                      \ \n\nFor example, if the guest has 100 points and the threshold is 200, the swag\
                      \ balance is 100. If the guest has 300 points and the threshold is 200, the swag\
                      \ balance is 200.\n\nReturns 0 when `save_points_for_swag_enabled` is false or `saved_swag_points_threshold`\
                      \ is 0.\n"
              examples:
                Save Points Disabled:
                  value:
                    save_points_for_swag_enabled: false
                    saved_swag_points_threshold: 0
                    swag_balance: 0
                Save Points Enabled — Available Points Below Threshold (100 points):
                  value:
                    save_points_for_swag_enabled: true
                    saved_swag_points_threshold: 200
                    swag_balance: 100
                Save Points Enabled — Active Swag Balance:
                  value:
                    save_points_for_swag_enabled: true
                    saved_swag_points_threshold: 200
                    swag_balance: 200
        '400':
          description: 'Bad Request

            - Missing `client` parameter — "Required parameter missing or the value is empty."

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
              examples:
                Missing client parameter:
                  value:
                    errors:
                      client: Required parameter missing or the value is empty.
        '401':
          description: 'Unauthorized

            - Missing or invalid access token — "An active access token must be used to query information
            about the current user."

            - Invalid client ID — "Unknown client."

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
              examples:
                Invalid or missing access token:
                  value:
                    errors:
                      unauthorized: An active access token must be used to query information about the
                        current user.
                Invalid client ID:
                  value:
                    errors:
                      unknown_client: Unknown client.
        '404':
          description: 'Not Found

            - Incorrect endpoint URL

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
              examples:
                Incorrect endpoint:
                  value:
                    status: 404
                    error: Not Found
        '422':
          description: 'Unprocessable Entity

            - Save Points for Swag feature disabled or banked point debit not supported — "Your current
            configuration does not support this feature. Please connect with your Customer Success representative
