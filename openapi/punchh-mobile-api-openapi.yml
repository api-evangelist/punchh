                            translated into the relevant language by the business admin in the Punchh
                            platform when creating or editing a challenge campaign under <b>Marketing
                            Automation > Campaign Management</b>. If the translation is unavailable, the
                            response returns the value for this parameter in the default English language.
                            For example, if the header specifies “fr” (French), the name is returned in
                            French if a French translation is configured for the name in the Punchh platform;
                            otherwise the value is returned in the default English language.
                        start_date:
                          type: string
                          enum:
                          - YYYY-MM-DD
                          format: date
                          description: Start date of the campaign
                        end_date:
                          type: string
                          enum:
                          - YYYY-MM-DD
                          format: date
                          description: End date of the campaign
                        image_url:
                          type: string
                          description: URL of the image
                        description:
                          type: string
                          description: Description of the challenge. The description is returned in the
                            language specified in the Accept-Language request header, provided the challenge
                            description has been translated into the relevant language by the business
                            admin in the Punchh platform when creating or editing a challenge campaign
                            under <b>Marketing Automation > Campaign Management</b>. If the translation
                            is unavailable, the response returns the value for this parameter in the default
                            English language. For example, if the header specifies “fr” (French), the
                            description is returned in French if a French translation is configured for
                            the description in the Punchh platform; otherwise the value is returned in
                            the default English language.
                        tasks:
