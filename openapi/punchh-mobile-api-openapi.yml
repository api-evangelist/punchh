            indicates that the business does not have a rolling expiry of membership levels.
          enum:
          - YYYY-MM-DD
          format: date
        expiring_banked_currency (Deprecated):
          type: number
          format: float
          description: If a business has expiring banked currency configured in the Punchh platform, the
            banked currency will expire in a FIFO (first-in, first-out) pattern. This returns the value
            of the banked currency that will expire. A "null" value indicates that the business is not
            configured to support expiring banked currency.
        banked_currency_expiring_on (Deprecated):
          type: string
          description: If a business is configured to support expiring banked currency, this returns the
