                Maximum transfer limit exceeded:
                  value:
                  - Your transfer cannot be completed because it exceeds the maximum transfer limit set
                    for your account.
                Invalid password:
                  value:
                  - Invalid password. Please try again.
                Service unavailable:
                  value:
                  - This service is currently unavailable for your account. Please contact support.
                Password required:
                  value:
                  - Password is required for peer-to-peer transfer.
