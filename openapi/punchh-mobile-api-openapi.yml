    response-menu-items:
      title: Menu Items (Array Object)
      x-stoplight:
        id: lsmmevd84zcsf
      type: array
      items:
        x-stoplight:
          id: 12qjoo9ej1acb
        type: object
        properties:
          item_name:
            type: string
            x-stoplight:
              id: axqs34w91dcg6
            description: Name of the menu item
          item_qty:
            type: string
            x-stoplight:
              id: tjf2haq05zi5g
            description: Quantity ordered by the customer. If the item is a modifier (such as extra cheese
              on a pizza base item), the quantity reflects the total number of base items included. For
              example, if you have a pizza base item with a certain item ID and a quantity of two, and
              the pizzas each have an extra cheese modifier added to them, then the modifier quantity
              should be two to account for the modifier across both pizzas. This applies only to base
              items of the same ID. If different base items include the same modifier, you do not need
              to sum the modifiers.
          item_amount:
            type: number
            x-stoplight:
              id: uw5i7i1owa7zn
            format: float
            description: The total price of the line item or the amount of the discount that you applied
              to an item. In case of multiple quantities, this means the sum total of all item amounts.
              This value is always represented as a positive number, even when the item is a discount.
          menu_item_type:
            type: string
            x-stoplight:
              id: 3bhm3vrzg0m7y
            description: 'The classification based on the item type:


              M - Menu item ( + or - )


              D - Discount (negative). Either internal or Punchh will always evaluate lines as ( - ) regardless
              of the sign assigned in the API call


              S - Service item. Any item representing money received that is not a sale. For example,
              service charges, delivery fees, tips, purchase of gift cards/certificates, etc.


              T - Tax item. Taxes of all sorts


              P - Payment item. Visa, MasterCard, cash, gift card/certificate (when used to pay for the
              order)'
          menu_item_id:
            type: integer
            x-stoplight:
              id: 1p9gohm0bhxos
            description: Unique identifier for the item
          menu_family:
            type: string
            x-stoplight:
              id: 75hzwgdhqqf2m
            description: The family that the item belongs to. The family is the subcategory for the item.
              A blank value means the item does not belong to a family.
          menu_major_group:
            type: string
            x-stoplight:
              id: bfj7s8t3n78jk
            description: The major group that the item belongs to. The major group is the parent category
              for the item. A blank value means the item does not belong to a major group.
          serial_number:
            type: string
            x-stoplight:
              id: 92xkqaijbrjds
            description: A serialized number that differentiates distinct menu items on a receipt. The
              value identifies which items on the receipt are base items and which items are modifiers
              to the base items. For example, a main menu item (such as pizza) may have serial number
              "1.0", and the associated modifiers (such as "extra cheese", "olives", and "jalapenos")
              may have serial numbers "1.1", "1.2", and "1.3" respectively. Serialization is limited to
              one decimal point, so you can only modify the base item. You cannot modify a modifier with
              1.x.x, and so on.
      description: Returns a list of menu items in the API response
    messages:
      type: object
      description: 'Returned in response to the [Fetch Messages](/docs/dev-portal-mobile/e9485ca96ff55-fetch-messages)
        API

        '
      x-examples: []
      title: Messages (Array Object)
      x-stoplight:
        id: 4e7b944f87362
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              background_content:
                $ref: '#/components/schemas/background-content'
              body:
                type: string
                description: 'The text content of a rich message

                  '
              cta:
                $ref: '#/components/schemas/cta'
              dismissable:
                type: boolean
                description: 'This boolean value decides whether guests can dismiss a message or not.
                  When a guest dismisses a message, it should not be rendered in the app.

                  '
              hero_content:
                $ref: '#/components/schemas/hero-content'
              launch_time:
                type: string
                description: "Date/time, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format,\
                  \ when the notification should be rendered by the application client. This is a useful\
                  \ field that can enable a business to create messages that can be sent to the mobile\
                  \ client in advance, and they appear in the app later when the launch time comes.\n\n\
                  If a rich message is triggered from a campaign, from a notification template as a result\
                  \ of user action, as a result of test notification, or if the Launch Time and Take Down\
                  \ Time fields are left blank in a business announcement, the values for launch_time\
                  \ and take_down_time will be null.\n\nThe values of take_down_time and launch_time parameters\
                  \ are determined when configuring campaign announcements. To set up a campaign announcement\
                  \ in the Punchh platform, in the left navigation pane, navigate to <b>Loyalty Program\
                  \ > App Message Composer</b>, and click <b>Add App Message</b>. In the <b>New Announcement</b>\
                  \ page, specify the date and time of the launch in the <b>Launch Time</b> field and\
                  \ the take down time in the <b>Take Down Time</b> field. \n\nOnce configured, these\
                  \ values will be displayed in the `launch_time` and `take_down_time` parameters respectively\
                  \ when the messages are fetched via this Mobile API."
              message_type:
                type: string
                description: 'There are two types of rich Messages returned in response:

                  1. user_specific: Rich messages that have a user context. These include rich messages
                  created based on campaigns or user actions.

                  2. business_wide: Rich messages that are created as business announcements in the system.'
              rank:
                type: integer
                description: Every message should have a rank. This marks the importance of a message.
                  There may be a case when a more important message moves down the display list in the
                  app as new messages are delivered to the mobile client. To keep important messages at
                  the top of the display list, they should be given a higher number just as is the case
                  with z-index. If two messages have the same rank, the app will determine the display
                  order based on the launch_time.
              style_url:
                type: string
                description: 'Link to the style sheet file for the style that will be applied to the message.
                  The mobile client can download the style file, which can then be used to render the
                  rich message in the app.

                  '
              subtitle:
                type: string
                description: 'A subordinate title providing additional information about the content

                  '
              tags:
                type: array
                description: 'Tags provide additional details about a message. A simple example could
                  be the type (such as campaign, system_notification, etc.) that may help the app make
                  decisions about the rendering of the message.

                  '
                items:
                  type: string
              take_down_time:
                type: string
                description: "Date/time, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format,\
                  \ when the mobile client should stop rendering the rich message in the app.\n\nIf a\
                  \ rich message is triggered from a campaign, from a notification template as a result\
                  \ of user action, as a result of test notification, or if the Launch Time and Take Down\
                  \ Time fields are left blank in a business announcement, the values for launch_time\
                  \ and take_down_time will be null.\n\nThe values of take_down_time and launch_time parameters\
                  \ are determined when configuring campaign announcements. To set up a campaign announcement\
                  \ in the Punchh platform, in the left navigation pane, navigate to <b>Loyalty Program\
                  \ > App Message Composer</b>, and click <b>Add App Message</b>. In the <b>New Announcement</b>\
                  \ page, specify the date and time of the launch in the <b>Launch Time</b> field and\
                  \ the take down time in the <b>Take Down Time</b> field. \n\nOnce configured, these\
                  \ values will be displayed in the `launch_time` and `take_down_time` parameters respectively\
                  \ when the messages are fetched via this Mobile API."
              title:
                type: string
                description: 'A suitable title for the rich message. A well-crafted title increases the
                  chances that a user will view a message.

                  '
              message_id:
                type: integer
                description: 'Unique ID of the message sent to the user

                  '
              read_at:
                type: string
                x-stoplight:
                  id: ten5f40qgu98e
                format: date-time
                description: Date/time when the message was read, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
                  format. To mark a message read, you must call the [Mark Messages As Read](/docs/dev-portal-mobile/899a3394bf4e6-mark-messages-as-read)
                  API. The `read_at` parameter value remains null until the message is explicitly marked
                  as read using the appropriate API.
                enum:
