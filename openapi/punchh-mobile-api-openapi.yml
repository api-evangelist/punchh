  /api2/mobile/users/challenges_listing:
    get:
      summary: List User Challenges
      operationId: mobile_list_user_challenges
      description: 'Returns all challenges associated with the logged-in user. Challenges are grouped
        into Available, Active, and Past categories, and include user-specific details such as enrollment
        status, progress, and relevant metadata required to render the challenges listing screen.


        This API supports pagination for efficient data handling.


        **Prerequisite**<br>

        The Challenges feature must be enabled for the business in the Punchh platform. If not enabled,
        the API will return a 422 Unprocessable Entity error. Contact your Punchh representative to update
        this Punchh platform configuration.

        <!-- Cockpit > Dashboard > Major Features > Enable Challenges? -->


        **Challenge Categories**


        **Available Challenges:**

        All challenges available for opt-in when the opt-in feature is enabled. When the opt-in feature
        is disabled, all challenges are returned in the Active category.


        **Active Challenges:**

        All active challenges that the user has opted into, along with all challenges that do not require
        opt-in. When the opt-in feature is disabled, all challenges appear in this category.

        Note: All segment-based challenges are also included in this category.


        **Past Challenges:**

        All challenges whose end date has already passed, deactivated challenges, as well as challenges
        for which the user has already earned a badge.'
      tags:
      - Challenges
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      - schema:
          type: string
        in: header
        name: Accept-Language
        description: 'Preferred language. Punchh supports multiple languages for the challenge name and
          description in the API response as per the locale specified in the Accept-Language request header
          for the campaign type challenge. Possible values: ar-kw for Arabic Kuwait, az for Azerbaijani,
          ca-ES for Catalan, en for English, en-CY for English-Cyprus, en-GB for English British, en-NZ
          for English-New Zealand, en-TT for English-Trinidad and Tobago, en-ca for English-Canada, es
          for Spanish, es-CR for Spanish Costa Rica, es-MX for Spanish Mexico, es-US for Spanish United
          States, fr for French, fr-ca for French-Canada, ro for Romania, vi for Vietnamese<br> The locales
          for a business are configured in the Punchh platform under <b>Administration > Business Profile
          > Address</b>. Click the <b>Alternate Languages</b> drop-down field to choose a language. In
          the Punchh platform, the admin of a business has to configure in the relevant language(s) the
          challenge name and description when creating or editing a campaign under <b>Marketing Automation
          > Campaign Management</b>.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: object
                    description: Object containing the count of challenges for the selected filter category.
                      For example, if `filter`= active, the `count` object returns the count of active
                      challenges. If no filter is specified, the counts for all challenge categories (`active_challenges`,
                      `available_challenges`, `past_challenges`) are returned.
                    properties:
                      active_challenges:
                        type: integer
                        description: Total number of active challenges for the user. Returned when filter
                          is "active" or when no filter is specified. The number of active challenges
                          returned is determined by the per_page value.
                      available_challenges:
                        type: integer
                        description: Total number of available challenges for the user. Returned when
                          filter is "available" or when no filter is specified. The number of available
                          challenges returned is determined by the per_page value.
                      past_challenges:
                        type: integer
                        description: Total number of past challenges for the user. Returned when filter
                          is "past" or when no filter is specified. The number of past challenges returned
                          is determined by the per_page value.
                  available_challenges:
                    type: array
                    description: All challenges available for opt-in when the opt-in feature is enabled.
                      When the opt-in feature is disabled, this array is empty as all challenges are returned
                      in the active_challenges array.
                    items:
                      $ref: '#/components/schemas/ChallengeListingItem'
                  active_challenges:
                    type: array
                    description: 'All active challenges that the user has opted into, along with all challenges
                      that do not require opt-in. When the opt-in feature is disabled, all challenges
                      appear in this array. Note: All segment-based challenges are also included in this
                      array.'
                    items:
                      $ref: '#/components/schemas/ChallengeListingItem'
                  past_challenges:
                    type: array
                    description: All challenges whose end date has already passed, as well as non-global
                      challenges for which the user has already earned a badge.
                    items:
                      $ref: '#/components/schemas/ChallengeListingItem'
              examples:
                Response Example:
                  value:
                    count:
                      active_challenges: 12
                    available_challenges: []
                    active_challenges:
                    - challenge_id: 16438
                      name: Buy 5 Cheese Breadsticks
                      description: Buy 5 Cheese Breadsticks to earn bonus points
                      image_url: IMAGE_URL_GOES_HERE
                      icon_url: IMAGE_URL_GOES_HERE
                      icon_completed_url: IMAGE_URL_GOES_HERE
                      start_date: '2025-01-01'
                      end_date: '2025-12-31'
                      challenge_starting_at_tz: '2025-01-01T00:00:00+05:30'
                      challenge_expiring_at_tz: '2025-12-31T23:59:59+05:30'
                      challenge_reach: universal_auto_enrolment
                      challenge_status: enrolled
                      challenge_type: receipt_qualification
                      occurrence: single
                      past_completions: 1
                      opted_in: true
                      opted_out: false
                      explicit_opt_in: true
                      gift_reason: Buy 5 Cheese Breadsticks
                      miscellaneous: '{"detailedDescription":"Earn 50 bonus points after you purchase
                        five breadsticks."}'
                      progress:
                      - completed_steps: 0
                        total_steps: 1
                    past_challenges: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      filter:
                        type: string
              examples:
                Invalid filter value:
                  value:
                    errors:
                      filter: 'Invalid filter value. Valid values are: active, available, past'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  unauthorized:
                    type: array
                    items:
                      type: string
              examples:
                Invalid or missing access token:
                  value:
                    unauthorized:
                    - An active access token must be used to query information about the current user.
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      invalid_signature:
                        type: array
                        items:
                          type: string
              examples:
                Invalid Signature:
                  value:
                    errors:
                      invalid_signature:
                      - Signature doesn't match. For information about generating the x-pch-digest header,
                        see https://developers.punchh.com.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      disabled_feature:
                        type: string
              examples:
                Challenges not enabled:
                  value:
                    errors:
                      disabled_feature: Business does not have challenges enabled.
      x-stoplight:
        id: challenges-listing-get
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                page:
                  type: integer
                  description: Page number for pagination
                per_page:
                  type: integer
                  description: Number of challenges to return per page
                filter:
                  type: string
                  description: 'Filters the response to return only challenges of a specific category.
                    Possible values are:

                    - available: Returns only available challenges

                    - active: Returns only active challenges

                    - past: Returns only past challenges


                    If not provided, all categories are returned.'
                  enum:
                  - available
                  - active
                  - past
              required:
              - client
            examples:
              default:
                value:
                  client: CLIENT_GOES_HERE
                  page: 1
                  per_page: 10
                  filter: active
