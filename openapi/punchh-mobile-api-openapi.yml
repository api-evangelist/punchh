  /api2/mobile/checkins/transactions:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkin:
                    type: object
                    properties:
                      created_at:
                        type: string
                        description: Date/time when the check-in was created in the system, in ISO 8601
                          format
                        enum:
                        - YYYY-MM-DDThh:mm:ssZ
                        format: date-time
                      current_membership_level:
                        type: string
                        description: Membership level of the user
                      location_id:
                        type: integer
                        description: ID of the location associated with the loyalty check-in
                      pending_refresh:
                        type: boolean
                        description: Whether the check-in is pending refresh or not
                      points_earned:
                        type: integer
                        description: Number of points earned in the loyalty check-in
                      store_number:
                        type: string
                        description: The store number where the check-in occurred
                      checkin_id:
                        type: integer
                        description: ID of the loyalty check-in made by the user
                      first_checkin:
                        type: boolean
                        description: Whether it is the first check-in at the business or not
                      expiring_on:
                        type: string
                        enum:
                        - YYYY-MM-DD
                        format: date
                        description: Date when points earned in the loyalty check-in will expire
                      survey_url:
                        type: string
                        description: URL of the survey presented to a user completing a check-in
                  redemptions:
                    type: array
                    items:
                      type: object
                      properties:
                        redemption_status:
                          type: string
                          description: 'Status of the redemption. The values returned can be:


                            - redeemable: The redemption can be redeemed at the POS.


                            - expired: The redemption has expired and becomes unusable for the user.


                            - honored: The redemption has already been processed successfully and redeemed
                            by the user at a POS.


                            - cancelled: The redemption can be voided by a user by approaching the POS
                            if a redemption is done by mistake and the user wants to cancel it.'
                        created_at:
                          type: string
                          description: Date/time when the redemption was created in the system, in ISO
                            8601 format
                          enum:
                          - YYYY-MM-DDThh:mm:ssZ
                          format: date-time
                        redeemable_id:
                          type: integer
                          description: Unique ID of the redeemable
                        redeemable_name:
                          type: string
                          description: Name of the redeemable
                        redeemed_value:
                          type: number
                          format: float
                          description: 'For a business with banked currency, a currency value will be
                            returned (e.g., 10 would mean $10).


                            For a business without banked currency, a points value will be returned (e.g.,
                            10 would mean 10 points).'
                        redemption_image_url:
                          type: string
                          description: URL of the image displayed in the app to depict the redeemable
                        redemption_message:
                          type: string
                          description: A descriptive message that tells a user what the user has redeemed
                        updated_at:
                          type: string
                          enum:
                          - YYYY-MM-DDThh:mm:ssZ
                          format: date-time
                          description: Date/time at which the redemption was updated in the system
                        redemption_id:
                          type: integer
                          description: Unique ID of the redemption that has been created
                        redemption_tracking_code:
                          type: string
                          description: Code that a user must submit at the POS to receive the redeemed
                            reward
                        expiring_at:
                          type: string
                          description: Date/time, in ISO 8601 format, when the redemption_tracking_code
                            expires and the user cannot use it at the POS
                          enum:
                          - YYYY-MM-DDThh:mm:ssZ
                          format: date-time
              examples:
                default:
                  value:
                    checkin:
                      created_at: '2016-05-24T07:19:37-04:00'
                      current_membership_level: Tier 1
                      location_id: 304252
                      pending_refresh: false
                      points_earned: 229
