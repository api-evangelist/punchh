  /api2/mobile/swag_redemptions:
    post:
      summary: Redeem Swag
      description: 'The Swag Redemption API allows an authenticated loyalty member to redeem saved loyalty
        points for a branded swag item. The API handles the full redemption flow end-to-end — including
        eligibility checks, point deduction, inventory decrement, reward creation, and optional shipping
        detail capture.


        See [Get User Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/get),
        [Fetch Available User Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_merch/get),
        [Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/put),
        and [Get Swag Shipping Details](https://developers.partech.com/docs/dev-portal-platform-functions/apis/platform-functions-api/tag/swag/get/api2/dashboard/swag_shipping_details).'
      operationId: mobile_create_swag_redemption
      tags:
      - Swag
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          description: Swag redeemed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: Swag redeemed successfully.
        '400':
          description: 'Bad Request

            - Missing `location_id` — "Required parameter missing or the value is empty: location_id"

            '
        '401':
          description: 'Unauthorized

            - Missing or invalid access token — "You need to sign in or sign up before continuing."

            '
        '404':
          description: 'Not Found

            - Item not available as swag (redeemable ID passed) — "Swag item not found."

            - Invalid/Deactivated swag ID — "Swag item not found."

            - Unknown or cross-business `location_id` — "Location not found."

            '
        '422':
          description: 'Unprocessable Entity

            - Save Points for Swag feature disabled — "Your current configuration does not support this
            feature. Please connect with your Customer Success representative for resolution of the issue."

            - Per-member redemption limit exceeded — "Redemption limit reached for the member."

            - Insufficient saved points — "Insufficient points to redeem this SWAG."

            - Item out of stock (quantity = 0 or NULL) — "Item is currently out of stock."

            - Invalid fulfillment method value — "Invalid fulfilment type specified."

            - Missing required field(s) — "Missing required field(s): {field_name}."

            '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client
              - swag_id
              - fulfillment_method
              properties:
                client:
                  type: string
                  description: OAuth client ID assigned to the business
                swag_id:
                  type: integer
                  description: ID of the swag item to redeem
                location_id:
                  type: string
                  description: ID of the store location. If not provided, the business's primary location
                    is used.
                fulfillment_method:
                  type: string
                  description: 'Delivery method. Possible values: STORE_PICKUP or HOME_DELIVERY (case-insensitive)'
                  enum:
                  - STORE_PICKUP
                  - HOME_DELIVERY
                shipping_info:
                  type: object
                  description: Required when `fulfillment_method` is HOME_DELIVERY. Ignored when `fulfillment_method`
                    is STORE_PICKUP.
                  required:
                  - full_name
                  - email
                  - phone_number
                  - address_line_1
                  - city
                  - state
                  - zipcode
                  properties:
                    full_name:
                      type: string
                      description: Full name of the shipping recipient
                    email:
                      type: string
                      description: Contact email for the shipment
                    phone_number:
                      type: string
                      description: Contact phone number. Must be a valid phone number. Current validation
                        does not enforce a minimum length of 10 digits.
                    address_line_1:
                      type: string
                      description: First line of the shipping address
                    address_line_2:
                      type: string
                      description: Second line of the shipping address (apartment, suite, etc.)
                    city:
                      type: string
                      description: City of the shipping address
                    state:
                      type: string
                      description: State or region of the shipping address
                    zipcode:
                      type: string
                      description: Postal / ZIP code of the shipping address
                    delivery_instructions:
                      type: string
                      description: Special delivery instructions. No character limit currently enforced
            examples:
              default:
                value:
                  swag_id: 73072
                  location_id: '353291'
                  fulfillment_method: HOME_DELIVERY
                  shipping_info:
                    full_name: NAME_GOES_HERE
                    email: test@example.com
                    phone_number: '1111111111'
                    address_line_1: Street 1
                    address_line_2: Street 2
                    delivery_instructions: please deliver it asap
                    city: New York
                    state: USA
                    zipcode: '12344'
  /api2/mobile/user_merch:
    get:
      summary: Fetch Available User Swag
      description: 'Retrieves all available swag items that the authenticated user can view or redeem
        using their loyalty points. The response includes item details such as name, image, point cost,
        availability window, and fulfilment method. Results are paginated. Only items available in inventory
        are returned in the response.


        See [Get User Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/get),
        [Save Points for Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1user_banking_preferences/put),
        [Redeem Swag](/docs/dev-portal-mobile/apis/mobile-api/paths/~1api2~1mobile~1swag_redemptions/post),
        and [Get Swag Shipping Details](https://developers.partech.com/docs/dev-portal-platform-functions/apis/platform-functions-api/tag/swag/get/api2/dashboard/swag_shipping_details).'
      operationId: mobile_fetch_available_user_merch
      tags:
      - Swag
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/punchh-app-device-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the swag item.
                        name:
                          type: string
                          description: Display name of the swag item.
                        image_url:
                          type: string
                          description: URL of the swag item image.
                        points:
                          type: integer
                          description: Number of loyalty points required to redeem this item.
                        start_time:
                          type: string
                          format: date-time
                          description: Start date/time when the item becomes available for redemption
                            in ISO 8601 format.
                        end_time:
                          type: string
                          format: date-time
                          description: End date/time after which the item is no longer available in ISO
                            8601 format.
                        timezone:
                          type: string
                          description: Timezone for the availability window (IANA format).
                        available_to_redeem:
                          type: boolean
                          description: Whether the item is currently available for the user to redeem.
                            Set to 'true' when the user's points balance allocated for the swag is greater
                            than or equal to the item's `points` value; otherwise, it is set to 'false'.
                        fulfilment_method:
                          type: string
                          description: 'How the item is fulfilled. Possible values: store_pickup, home_delivery.'
                  meta:
                    type: object
                    description: Pagination metadata.
                    properties:
                      current_page:
                        type: integer
                        description: The current page number.
                      next_page:
                        type: integer
                        x-nullable: true
                        description: The next page number, or null if on the last page.
                      prev_page:
                        type: integer
                        x-nullable: true
                        description: The previous page number, or null if on the first page.
                      total_pages:
                        type: integer
                        description: Total number of pages available.
                      total_count:
                        type: integer
                        description: Total number of merchandise items across all pages.
              examples:
                default:
                  value:
                    data:
                    - id: 1
                      name: Merch Name1
                      image_url: IMAGE_URL_GOES_HERE
                      points: 10
                      start_time: '2026-05-06T08:01:42Z'
                      end_time: '2026-06-07T08:01:42Z'
                      timezone: America/New_York
                      available_to_redeem: true
                      fulfilment_method: store_pickup
                    - id: 2
                      name: Merch Name2
                      image_url: IMAGE_URL_GOES_HERE
                      points: 15
                      start_time: '2026-05-16T08:01:42Z'
                      end_time: '2026-06-17T08:01:42Z'
                      timezone: America/New_York
                      available_to_redeem: false
                      fulfilment_method: home_delivery
                    meta:
                      current_page: 1
                      next_page: 2
                      prev_page: null
                      total_pages: 2
                      total_count: 2
        '401':
          description: 'Unauthorized

            - Missing or invalid access token — "You need to sign in or sign up before continuing."

            '
        '422':
          description: 'Unprocessable Entity

            - Save Points for Swag feature disabled — "Your current configuration does not support this
            feature. Please connect with your Customer Success representative for resolution of the issue."

            '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
              required:
              - client
            examples:
              default:
                value:
                  client: CLIENT_KEY_GOES_HERE
