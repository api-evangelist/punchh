  /api2/mobile/loyalty_transfers/points:
    post:
      summary: Transfer Loyalty Points
      description: 'Enables a user to transfer loyalty points from their account to another user''s account
        by specifying the recipient''s email address or phone number and the number of points to transfer.


        The recipient must be an existing member in the loyalty system. The transfer is subject to the
        business''s configured transfer limits, including maximum transfer limits per account and daily
        receiving limits for the recipient.


        **Prerequisite**<br>

        Peer-to-peer points transfers must be enabled for the business. Contact your Punchh representative
        to update this Punchh platform configuration.

        <!--Cockpit > Earnings > Transferred Loyalty Expiry > Enable Peer-to-Peer Points Transfers-->'
      operationId: mobile_loyalty_transfer_points
      tags:
      - Loyalty Transfers
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept-Language'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                default:
                  value:
                  - 1 transferred to Recipient Name
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                Missing required parameter:
                  value:
                    error: 'Required parameter missing or the value is empty: points_to_transfer'
                Missing recipient email or identifier:
                  value: "{\n    \"errors\": {\n        \"recipient_email\": \"Required parameter missing\
                    \ or the value is empty.\",\n        \"recipient_email_or_recipient_identifier\":\
                    \ \"Required parameter missing or the value is empty\"\n    }\n}"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                Unauthorized:
                  value:
                    error: You need to sign in or sign up before continuing.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Insufficient balance:
                  value:
                  - Not enough reward balance available to redeem. Current Balance of 96 is less than
                    100 requested
                No user found for the provided email or phone number:
                  value:
                  - Recipient not found
                Receiver limit exceeded:
                  value:
                  - Receiver limit exceeded for points (max 5 in 30h)
                Duplicate phone numbers:
                  value:
                  - Something went wrong with the transfer. Please check your input and try again.
                Daily receiving limit reached:
                  value:
                  - This transfer cannot be completed because the receiving member has reached the daily
                    receiving limit.
                Maximum transfer limit exceeded:
                  value:
                  - Your transfer cannot be completed because it exceeds the maximum transfer limit set
                    for your account.
                Invalid password:
                  value:
                  - Invalid password. Please try again.
                Service unavailable:
                  value:
                  - This service is currently unavailable for your account. Please contact support.
                Password required:
                  value:
                  - Password is required for peer-to-peer transfer.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  description: OAuth client ID provided by the business
                access_token:
                  type: string
                  description: Token issued to the user after logging into the app of the business
                recipient_email:
                  type: string
                  description: Email address of the recipient to whom the loyalty points will be transferred.
                    <br><br><b>Note:</b> Either `recipient_email` or `recipient_identifier` is required.
                    When both `recipient_identifier` and `recipient_email` are provided, `recipient_identifier`
                    takes precedence.
                recipient_identifier:
                  type: string
                  description: 'Accepts either an email address or a phone number to identify the recipient
                    of the points transfer. `recipient_identifier` is the primary parameter used to identify
                    the recipient. The system automatically detects whether the provided value is an email
                    address or a phone number. <br><br><b>Note:</b> Either `recipient_email` or `recipient_identifier`
                    is required. When both `recipient_identifier` and `recipient_email` are provided,
                    `recipient_identifier` takes precedence.

                    * If a valid phone number or email matches a single guest account, the transfer proceeds.

                    * If a phone number matches multiple guest accounts, the transfer is blocked, and
                    an error is returned. To prevent duplicate phone number error, we recommend enabling
                    phone number uniqueness for the business. Contact your Punchh representative to update
                    this Punchh platform configuration.

                    * If no matching guest is found for the provided email or phone number, a "recipient
                    not found" error is returned.'
                points_to_transfer:
                  type: number
                  description: Number of loyalty points to transfer to the recipient
                password:
                  type: string
                  description: Password of the user initiating the transfer. Required for peer-to-peer
                    transfer.
              required:
              - client
              - access_token
              - points_to_transfer
              - password
            examples:
              Using email:
                value:
                  client: CLIENT_GOES_HERE
                  access_token: ACCESS_TOKEN_GOES_HERE
                  recipient_email: recipient@example.com
                  recipient_identifier: recipient@example.com
                  points_to_transfer: '1'
                  password: PASSWORD_GOES_HERE
              Using phone number:
                value:
                  client: CLIENT_GOES_HERE
                  access_token: ACCESS_TOKEN_GOES_HERE
                  recipient_identifier: '1111111111'
                  points_to_transfer: '1'
                  password: PASSWORD_GOES_HERE
