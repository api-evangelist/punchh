              created_at:
                type: string
                x-stoplight:
                  id: 04jvdgbo8cmcv
                format: date-time
                description: Date/time when the message was created, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
                  format
                enum:
                - YYYY-MM-DDThh:mm:ssZ
              deleted_at:
                type: string
                x-stoplight:
                  id: jynu306dbfuc9
                format: date-time
                description: Date/time when the message was deleted, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
                  format. To delete the message, you must call the [Delete Messages](/docs/dev-portal-mobile/8dbb3bf79ad94-delete-messages)
