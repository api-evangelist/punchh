                    description: URL of the business where users can submit feedback related to the mobile
                      app experience
                  accessibility_url:
                    type: string
                    x-stoplight:
                      id: 2umrzch3lohhc
                    description: URL of the business that provides information or support related to accessibility
                      features
                  enable_advance_auth:
                    type: boolean
                    x-stoplight:
                      id: ebvx17jwjxw6f
                    description: Indicates whether Advanced Authentication is enabled for the business.
                      Returns true if Advanced Authentication is enabled for the business; otherwise,
                      false.
                  program_type:
                    type: string
                    x-stoplight:
                      id: wiphqrzhie1cy
                    description: 'Provides information about the program type configured for the business
                      in the Punchh platform. Possible values:

                      * points_unlock_redeemables - Indicates the program is Points Unlock Redeemables
                      based

                      * points - Indicates program is points convert to rewards or currency

                      * visit - Indicates the program is Visit-based

                      * points_and_visits - Indicates the program is hybrid and includes both points and
                      visits

                      * none - Indicates no loyalty program

                      See [Punchh Offers and Program Types](/docs/dev-portal-developer-resources/150fedd8daa77-punchh-offers-and-program-types#program-types).
                      You must log in to the developer portal to access the topic.'
                  points_conversion_type:
                    type: string
                    x-stoplight:
                      id: rubjr2reovscp
                    description: "Provides information about the conversion type configured for the business\
                      \ based on the program type selected for the business in the Punchh platform: Possible\
                      \ values: \n- staged - Applicable when `program_type` is points_unlock_redeemables\
                      \ or points. The staged value indicates that points are earned normally (check-ins,\
                      \ purchases, etc.), but when you redeem, the system does not deduct points immediately\
                      \ at the time of generating a redemption code or [SSF code](/docs/dev-portal-mobile/apis/mobile-api/tag/single-scan-code/post/api2/mobile/single_scan_tokens).\n\
                      - none -  Applicable when `program_type` is points. The none value indicates points\
                      \ do not get converted into any entity, such as rewards or currency. \n- currency\
                      \ - Applicable when `program_type` is points. The currency value indicates that\
                      \ earned points are automatically converted to currency at predefined point thresholds.\n\
                      - rewards -  Applicable when `program_type` is points. The rewards value indicates\
                      \ that earned points are automatically converted to rewards at predefined point\
                      \ thresholds.\nSee [Punchh Offers and Program Types](/docs/dev-portal-developer-resources/150fedd8daa77-punchh-offers-and-program-types#program-types).\
                      \ You must log in to the developer portal to access the topic."
                  guest_lookup_type:
                    type: string
                    x-stoplight:
                      id: f26i84yfecjcm
                    description: An identifier in the mobile app and iFrame used for guest look-up at
                      the POS. If the bar code is configured as the guest’s identity in the Punchh platform
                      for the business, the mobile app and iFrame will only support phone number for guest
                      look-up. Contact your Punchh representative for more information about this Punchh
                      platform configuration.
                  enable_guest_challenge_opt_in:
                    type: boolean
                    x-stoplight:
                      id: jraehwtu9pz58
                    description: Indicates whether guests can opt in to challenge-based activities. When
                      true, the opt-in button is shown on eligible challenge cards in the mobile app;
                      when false, it is hidden. Contact your Punchh representative to update this configuration
                      setting.
                  enable_guest_challenge_opt_out:
                    type: boolean
                    x-stoplight:
                      id: 0hslc3uxk730q
                    description: Indicates whether guests can opt out of challenge-based activities. When
                      true, the opt-out button is shown on eligible challenge cards in the mobile app;
                      when false, it is hidden. Opt-in must be enabled for challenges in the Punchh platform
                      if Opt-out functionality is required. Contact your Punchh representative to update
                      this configuration setting. If an invalid combination is set (Opt-in disabled while
                      Opt-out enabled), the mobile app hides both buttons.
                  enable_loyalty_identification_at_drive_thru:
                    type: boolean
                    x-stoplight:
                      id: j3apvz3uq7xib
                    description: Indicates whether loyalty users can generate a 4-digit numeric/alphanumeric
                      short code in the mobile app. The short code is used to look up the user’s account
                      and retrieve their balance at the POS. See [Generate a Drive-Thru Short Code](https://developers.partech.com/docs/dev-portal-mobile/647b28e02d630-generate-a-drive-thru-short-code)
                  drive_thru_location_level_strategy:
                    type: boolean
                    x-stoplight:
                      id: dqjhyppyrpp8v
                    description: Indicates whether the drive-thru short code should be generated from
                      the location-level pool. When set to true, the mobile app must send a location_id
                      when requesting a short code. This parameter is always set to true. See [Generate
                      a Drive-Thru Short Code](https://developers.partech.com/docs/dev-portal-mobile/647b28e02d630-generate-a-drive-thru-short-code)
                  enable_drive_thru_pay:
                    type: boolean
                    description: Indicates whether the short code can be used for drive-thru payments
                      when the business supports the single scan flow. When set to true, the loyalty user
                      can pay at the drive-thru using the short code. When set to false, the loyalty user
                      can only earn points or rewards at the drive-thru using the short code, but cannot
                      use it for payment. Contact your Punchh representative to update this Punchh platform
                      configuration.
                  enable_subscription_taxation_support:
                    type: boolean
                    x-stoplight:
                      id: 7tdkirnwtjg67
                    description: Indicates whether tax handling for subscriptions is enabled. When set
                      to true, the mobile app displays tax-related line items and calculates them accordingly.
                      When set to false, it hides tax line items during subscription check-out. Contact
                      your Punchh representative to update this Punchh platform configuration.
                  enable_pargames_integration:
                    type: boolean
                    description: Indicates whether PAR Games is enabled for the brand. When 'true', the
                      mobile app displays the PAR Games section in the bottom navigation bar or the More
                      menu. When 'false', the section is hidden. Contact your Punchh representative to
                      update this Punchh platform configuration.
                  enable_save_points_for_swag:
                    type: boolean
                    description: 'Indicates whether the "Save Points for Swag" feature is enabled for
                      the business. When ''true'', loyalty users can choose to save loyalty points for
                      merchandise redemption instead of having them automatically converted into rewards
                      or currency. When ''false'' (or not configured), the feature is unavailable and
                      user-level "Save Points for Swag" preferences cannot be configured through the mobile
                      app.


                      Contact your Punchh representative to update this platform configuration. Once enabled,
                      this feature cannot be disabled through the Punchh platform. If changes are required,
                      CSMs must contact the engineering team.

                      '
                  p2p_authentication_type:
                    type: string
                    x-stoplight:
                      id: p2p-authentication-type
                    description: 'Indicates the authentication type required for peer-to-peer (P2P) loyalty
                      transfers. Possible values:

                      * `none` - No additional authentication is required for P2P transfers.

                      * `email_password_authentication` - The mobile app must prompt the user to enter
                      their existing password before completing a P2P transfer.


                      Contact your Punchh representative to update this Punchh platform configuration.'
                  enable_points_transfer:
                    type: boolean
                    description: Indicates whether the peer-to-peer points transfer feature is enabled
                      for the business. When set to true, users can transfer points to another user via
                      the mobile app. Contact your Punchh representative to update this configuration.
                  enable_currency_transfer:
                    type: boolean
                    description: Indicates whether the peer-to-peer currency transfer feature is enabled
                      for the business. When set to true, users can transfer currency to another user
                      via the mobile app. Contact your Punchh representative to update this configuration.
                  enable_rewards_transfer:
                    type: boolean
                    description: Indicates whether the peer-to-peer rewards transfer feature is enabled
                      for the business. When set to true, users can transfer rewards to another user via
                      the mobile app. Contact your Punchh representative to update this configuration.
                  membership_tier_boost:
                    type: string
                    description: "Indicates the current Membership Tier Boost status for the business.\
                      \ When enabled, allows business admins to grant members a temporary promotional\
                      \ tier upgrade through manual gifting, campaigns, or automated triggers. Possible\
                      \ values: \n* `enabled` - Tier Boost is active and admins can gift promotional tier\
                      \ status to members.\n* `disabled` - Default. Tier Boost is turned off and all currently\
                      \ active promotional gifts are revoked immediately upon save.\n* `disabled_keep_active`\
                      \ - Tier boost is turned off for new gifts but any currently active promotional\
                      \ gifts will continue until their expiry date).\n"
                    enum:
                    - enabled
                    - disabled
                    - disabled_keep_active
                  enable_passkeys:
                    type: boolean
                    description: Indicates whether passkeys are enabled for the business. If false or
                      absent, mobile/web app must not show any passkey-related UI. If true, mobile/web
                      app may show passkey-related UI and must respect the `login_mode` parameter. Contact
                      your Punchh representative to update this Punchh platform configuration. See [Passkey
                      Authentication Guide](https://developers.partech.com/docs/identity-service/passkey-authentication#passkey-authentication-sign-in)
                  login_mode:
                    type: string
                    enum:
                    - preferred
                    - optional
                    default: preferred
                    description: Controls whether passkey sign-in is presented as the preferred or an
                      optional sign-in method. Only present when `enable_passkeys` is true. Defaults to
                      "preferred" if no explicit mode is configured. Contact your Punchh representative
                      to update this Punchh platform configuration. See [Passkey Authentication Guide](https://developers.partech.com/docs/identity-service/passkey-authentication#passkey-authentication-sign-in)
                  enable_external_idp:
                    type: boolean
                    description: Indicates whether external identity provider (SAML/OIDC) login is enabled
                      for this brand. If false or absent, mobile/web app should not show external IDP
                      sign-in options. Contact your Punchh representative to update this Punchh platform
                      configuration. See [Enterprise IDP Integration](https://developers.partech.com/docs/identity-service/apis/gis/tag/enterprise-idp-integration)
                  gis:
                    type: object
                    description: Guest Identity Service (GIS) authentication configuration for this business.
                    properties:
