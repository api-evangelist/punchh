                        type: boolean
                        description: Indicates whether advanced authentication is enabled.
                      enable_basic_auth:
                        type: boolean
                        description: Indicates whether basic authentication (email and password) is enabled.
                      enable_facebook_login:
                        type: boolean
                        description: Indicates whether Facebook sign-in is enabled.
                      enable_google_login:
                        type: boolean
                        description: Indicates whether Google sign-in is enabled.
                      enable_apple_login:
                        type: boolean
                        description: Indicates whether Apple sign-in is enabled.
                      passkeys_enabled:
                        type: boolean
                        description: Corresponds to the root-level `enable_passkeys` response parameter.
                          Always present, even when false. If this value differs from the root-level `enable_passkeys`
                          response parameter, treat it as the source of truth.
                      external_idp_enabled:
                        type: boolean
                        description: Corresponds to the root-level `enable_external_idp` response parameter.
                          Always present, even when false. If this value differs from the root-level `enable_external_idp`
                          response parameter, treat it as the source of truth.
                      login_mode:
                        type: string
                        enum:
                        - preferred
                        - optional
                        description: Corresponds to the root-level `login_mode` response parameter. Only
                          present when passkeys are enabled. If this value differs from the root-level
                          `login_mode` response parameter, treat it as the source of truth.
