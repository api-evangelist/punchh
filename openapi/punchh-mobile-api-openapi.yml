      description: "Registers a user's profile on the app of a business\n\nNote: If the business is using\
        \ referral code, the actual `first_name` and `last_name` of the guest must be passed because the\
        \ referral code will be generated using the `first_name`, `last_name`, and some random characters.\
        \ Also, if you do not pass the `first_name` or the `last_name`, the API response may be delayed\
        \ or time out. \n\n### Using Referral Code As Invite Code in the Sign-up Process\n\nWhen a user\
        \ signs up using the Sign up / Register API, the API returns a referral code within the user object.\
        \ The user can share this code with non-loyalty users to invite them to join the business loyalty\
        \ program.\n\nWhen a referred user signs up and enters the shared referral code in the mobile\
        \ app, this `referral_code` must be passed in the `invite_code` request parameter when calling\
        \ the Sign up / Register API."
