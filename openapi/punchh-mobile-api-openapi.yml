                      in the default English language. For example, if the header specifies “fr” (French),
                      the name is returned in French if a French translation is configured for the name
                      in the Punchh platform; otherwise the value is returned in the default English language.
                  description:
                    type: string
                    description: Description of the challenge. The description is returned in the language
                      specified in the Accept-Language request header, provided the challenge description
                      has been translated into the relevant language by the business admin in the Punchh
                      platform when creating or editing a challenge campaign under <b>Marketing Automation
                      > Campaign Management</b>. If the translation is unavailable, the response returns
                      the value for this parameter in the default English language. For example, if the
                      header specifies “fr” (French), the description is returned in French if a French
                      translation is configured for the description in the Punchh platform; otherwise
                      the value is returned in the default English language.
                  image_url:
                    type: string
                    description: URL of the main banner image associated with the challenge campaign
                  icon_url:
                    type: string
                    description: URL of the default icon image for the challenge
                  icon_completed_url:
                    type: string
                    description: URL of the image icon that represents completion of the challenge
                  start_date:
                    type: string
                    enum:
                    - YYYY-MM-DD
                    format: date
                    description: Start date
                  end_date:
                    type: string
                    enum:
                    - YYYY-MM-DD
                    format: date
                    description: End date
                  gift_reason:
                    type: string
                    description: Reason to give gifts to a user
                  miscellaneous:
                    type: string
                    description: Returns miscellaneous response string as configured in the Punchh platform
                  challenge_id:
                    type: integer
                    description: Challenge ID
                  challenge_reach:
                    type: string
                    x-nullable: true
                    description: 'Returns the type of challenge reach strategy defined on the challenge
                      campaign. Possible values are:

                      - universal_auto_enrolment

                      - segment_auto_enrolment

                      - null (when no reach strategy is defined)'
                  challenge_status:
                    type: string
                    x-nullable: true
                    description: 'Returns the details of availability of and enrollment of a guest into
                      a specific challenge. Possible values are:

                      * unavailable: This status will be returned for "segment_auto_enrolment" when a
                      guest is NOT added to the "user_feature_enrolment" table.

                      * enrolled: This status will be returned for:<br>

                      a) "universal_auto_enrolment" in all cases since all signed-up guests are automatically
                      enrolled for the challenge.<br>

                      b) "segment_auto_enrolment" in cases when guests from the attached segment (to the
                      challenge campaign) get added to the user_feature_enrolment table and are automatically
                      enrolled for the challenge.<br>

                      * null: For older default "Segment" type challenges, the status will always be null.'
                  challenge_type:
                    type: string
                    description: 'Returns the type of challenge that is configured in the Punchh platform.
                      Supported values are:

                      - receipt_qualification

                      - every_x_points

                      - segment'
                  occurrence:
                    type: string
                    description: 'Possible values are:

                      - **single** - Shows when restarting the challenge button is OFF in the campaign

                      - **multiple** - Shows when restarting the challenge button is ON in the campaign'
                  past_completions:
                    type: integer
                    description: The number of times the user has previously completed the challenge campaign.
                  enrollment_status:
                    type: string
                    x-stoplight:
                      id: rllwa7oi3kkzk
                    description: 'Indicates the user''s enrollment status in a challenge. Possible values:

                      * active - The user is currently enrolled in the challenge.

                      * expired - The user''s enrollment in the challenge has expired.'
                  enrolled_on:
                    type: string
                    x-stoplight:
                      id: cjcebn39q1977
                    format: date-time
                    description: Date and time (in ISO 8601 format) when the user enrolled in the challenge
                  enrollment_expires:
                    type: string
                    x-stoplight:
                      id: 69ktllcf2cv1a
                    description: Date and time (in ISO 8601 format) when the user's enrollment in the
                      challenge expires
                    format: date-time
                  opted_in:
                    type: boolean
                    x-stoplight:
                      id: pilkx64h3cv1y
                    description: "Indicates whether the user has opted in to a challenge. Possible values:\n\
                      * true - The user has opted in. The mobile app should show the opt-out button on\
                      \ the challenge card if the opt-out feature is enabled for the business in the Punchh\
                      \ platform. \n* false - The user has not opted in. The mobile app should show the\
                      \ opt-in button on the challenge card if the opt-in feature is enabled for the business\
                      \ in the Punchh platform.\nContact your Punchh representative to update this configuration\
                      \ setting."
              examples:
                default:
                  value:
                    progress:
                    - completed_steps: 0
                      total_steps: 15
                    name: Potato Cheese Bites Club
                    description: Buy 10 get 1 free
                    image_url: IMAGE_URL_GOES_HERE
                    icon_url: IMAGE_URL_GOES_HERE
                    icon_completed_url: IMAGE_URL_GOES_HERE
                    start_date: '2019-06-24'
                    end_date: '2022-12-31'
                    gift_reason: New Challenge
                    miscellaneous: '{"detailedDescription": "Welcome to Potato Cheese ites club - Buy
                      10 get 1 free", "challengeType":"Clubs","nounDescription" : "Potato Cheese Bites"}'
                    challenge_reach: universal_auto_enrolment
                    challenge_status: enrolled
                    challenge_type: receipt_qualification
                    occurrence: multiple
                    past_completions: 0
                    challenge_id: 34
                    enrollment_status: active
                    enrolled_on: '2025-01-10T05:00:00+05:30'
                    enrollment_expires: '2025-04-10T05:00:00+05:30'
                    opted_in: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
