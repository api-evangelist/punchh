  /api2/mobile/users/account_history:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel:
                      type: string
                      enum:
                      - OnlineOrder
                      - POS
                      - Web
                      - Mobile
                      - Dashboard
                      description: 'Identifies the source of a "Checkin" or "Redemption" event type. For
                        example, "Mobile" in the case of a "Checkin" event indicates that the check-in
                        was done by a user using the mobile app of the business. Possible values of the
                        `channel` request parameter are:

                        - OnlineOrder

                        - POS

                        - Web

                        - Mobile

                        - Dashboard'
                    date:
                      type: string
                      enum:
                      - YYYY-MM-DD
                      format: date
                      description: Date/time when the event was created in the system, in [ISO 8601](http://en.wikipedia.org/wiki/ISO_8601)
                        format
                    description:
                      type: string
                      description: A brief description of the event
                    total_spend:
                      type: string
                      description: Amount that the user spent on the order. Will be returned if the event
                        type is "Checkin".
                    disapproved:
                      type: boolean
                      description: A particular event may be disapproved by the system or an admin for
                        some reason. In this case, a value of true will be returned. Currently, only check-ins
                        may be disapproved.
                    event_details:
                      $ref: '#/components/schemas/Event-details-object'
                    event_value:
                      type: string
                      enum:
                      - Reward
                      - Checkin
                      - Redemption
                      - RewardCredit
                      description: 'Value according to the event.


                        - Checkin: Number of points/visits earned (e.g., "+20 points")

                        - Reward: "+Item"

                        - RewardCredit: Banked amount (e.g., "+$30.00")

                        - Redemption: A redemption is requested by a user.'
                    expired:
                      type: boolean
                      description: An event may expire. For example, a reward given to a user may expire
                        if unredeemed. In this case, a value of true will be returned.
                    pending_refresh:
                      type: boolean
                      description: Used only with a "Checkin" event. A value of true indicates that a
                        check-in will go into a pending state until the time that the check is finally
                        closed.
                    store_number:
                      type: string
                      description: Identification of a particular store of a business in the system. The
                        store numbers are provided by the business.
                    sub_value:
                      type: string
                      description: Value of the points that are converted to banked currency. For example,
                        if 100 points get converted to $10, the value of `sub_value` will be 100 points.
                    menu_items:
                      $ref: '#/components/schemas/response-menu-items'
                    event_title:
                      type: string
                      description: Title of the event created by the system. For example, a "Points Earned"
                        title is returned when a user earns points as the result of a check-in. This will
                        respect the locale.
                    event_type:
                      type: string
                      description: 'The event for which an entry was created. Possible values are:

                        - Checkin

                        - Reward

                        - RewardCredit

                        - Redemption'
                    total_banked_currency:
                      type: number
                      format: double
                      description: Total value of banked currency available to a user
                    total_offers:
                      type: integer
                      description: Total number of offers that are available to a user
                    total_points:
                      type: integer
                      description: Total number of points that are available to the user. This value increases
                        when a check-in happens and decreases when points are converted to banked currency.
                    total_visits:
                      type: integer
                      description: Total number of visits of the user until the event
                    event_expiry:
                      type: string
                      enum:
                      - YYYY-MM-DDThh:mm:ssZ
                      format: date-time
                      description: Expiration date for the event as configured in the Punchh platform
              examples:
                default:
                  value:
                  - channel: null
                    date: '2019-05-17T08:29:35-04:00'
                    description: Dessert redeemed using redemption code 6384949 at TEST-Winghouse_Squirrel-
                      Test No Report (Available)
                    disapproved: false
