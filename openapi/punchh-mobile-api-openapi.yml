components:
  schemas:
    ChallengeListingItem:
      type: object
      properties:
        challenge_id:
          type: integer
          description: Challenge ID
        name:
          type: string
          description: Name of the challenge. The name is returned in the language specified in the Accept-Language
            request header, provided the challenge name has been translated into the relevant language
            by the business admin in the Punchh platform when creating or editing a challenge campaign
            under <b>Marketing Automation > Campaign Management</b>. If the translation is unavailable,
            the response returns the value for this parameter in the default English language. For example,
            if the header specifies "fr" (French), the name is returned in French if a French translation
            is configured for the name in the Punchh platform; otherwise the value is returned in the
            default English language.
        description:
          type: string
          description: Description of the challenge. The description is returned in the language specified
            in the Accept-Language request header, provided the challenge description has been translated
            into the relevant language by the business admin in the Punchh platform when creating or editing
            a challenge campaign under <b>Marketing Automation > Campaign Management</b>. If the translation
            is unavailable, the response returns the value for this parameter in the default English language.
            For example, if the header specifies "fr" (French), the description is returned in French
            if a French translation is configured for the description in the Punchh platform; otherwise
            the value is returned in the default English language.
        image_url:
          type: string
          description: URL of the main banner image associated with the challenge campaign
        icon_url:
          type: string
          description: URL of the default icon image for the challenge
        icon_completed_url:
          type: string
          description: URL of the image icon that represents completion of the challenge
        start_date:
          type: string
          format: date
          enum:
          - YYYY-MM-DD
          description: Start date of the campaign
        end_date:
          type: string
          format: date
          enum:
          - YYYY-MM-DD
          description: End date of the campaign
        challenge_starting_at_tz:
          type: string
          format: date-time
          description: Start date and time of the challenge in the business timezone (ISO 8601 format)
        challenge_expiring_at_tz:
          type: string
          format: date-time
          description: End date and time of the challenge in the business timezone (ISO 8601 format)
        challenge_reach:
          type: string
          x-nullable: true
          description: 'Returns the type of challenge reach strategy defined on the challenge campaign.
            Possible values are:

            - universal_auto_enrolment

            - segment_auto_enrolment

            - null (when no reach strategy is defined)'
        challenge_status:
          type: string
          x-nullable: true
          description: "Returns the details of availability of and enrollment of a guest into a specific\
            \ challenge. Possible values are:\n* unavailable: This status will be returned for \"segment_auto_enrolment\"\
            \ when a guest is NOT added to the \"user_feature_enrolment\" table.\n* enrolled: This status\
            \ will be returned for:<br>\n  a) \"universal_auto_enrolment\" in all cases since all signed-up\
            \ guests are automatically enrolled for the challenge.<br>\n  b) \"segment_auto_enrolment\"\
            \ in cases when guests from the attached segment (to the challenge campaign) get added to\
            \ the user_feature_enrolment table and are automatically enrolled for the challenge.<br>\n\
            * null: For older default \"Segment\" type challenges, the status will always be null."
        challenge_type:
          type: string
          description: 'Returns the type of challenge that is configured in the Punchh platform. Supported
            values are:

            - receipt_qualification

            - every_x_points

            - segment'
        occurrence:
          type: string
          description: 'Possible values are:

            - **single** - Shows when restarting the challenge button is OFF in the campaign

            - **multiple** - Shows when restarting the challenge button is ON in the campaign'
        past_completions:
          type: integer
          description: The number of times the user has previously completed the challenge campaign.
        opted_in:
          type: boolean
          description: 'Indicates whether the user has opted in to a challenge. Possible values:

            * true - The user has opted in. The mobile app should show the opt-out button on the challenge
            card if the opt-out feature is enabled for the business in the Punchh platform.

            * false - The user has not opted in. The mobile app should show the opt-in button on the challenge
            card if the opt-in feature is enabled for the business in the Punchh platform.

            Contact your Punchh representative to update this configuration setting.'
        opted_out:
          type: boolean
          description: Indicates whether the user has opted out of the challenge
        explicit_opt_in:
          type: boolean
          description: Indicates whether the challenge requires explicit opt-in from the user before enrollment
        gift_reason:
          type: string
          description: Reason to give gifts to a user
        miscellaneous:
          type: string
          description: Returns miscellaneous response string as configured in the Punchh platform
        progress:
          type: array
          description: Array of progress objects showing completed steps and total steps for the challenge
          items:
            type: object
            properties:
              completed_steps:
                type: integer
                description: Number of steps a user has completed for a challenge
              total_steps:
                type: integer
                description: Number of total steps set for a challenge
    access_token-Object:
      type: object
      description: An access token is needed to identify the user making the API request.
      title: Access Token (Object)
      x-stoplight:
        ID: 750d787ef37a5
      properties:
        token:
