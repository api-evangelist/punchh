      summary: Log in With Apple
      description: 'A user can sign in with Apple using a random email ID generated by Apple.


        ## Session Behavior After Users Revoke App Access From their Apple ID

        When a user authenticates using Apple Sign-In, Punchh generates its own access token that is independent
        of Apple''s authorization. If the user later revokes the app''s access through their Apple ID
        settings (Settings > Apple ID > Password & Security > Apps Using Apple ID), the active Punchh
        session is not affected, and the user is not automatically logged out.


        This behavior occurs because Apple Sign-In is used only during the initial authentication process.
        Apple does not provide a callback or notification to Punchh when a user revokes access to the
        app.


        As a result, the user remains signed in until their Punchh session expires or they explicitly
        log out of the app. If the user logs out and subsequently attempts to sign in again using Apple
        Sign-In, Apple will prompt the user to reauthorize the app to use the their Apple ID for authentication
        before the sign-in process can be completed.

        '
      operationId: mobile_login_with_apple
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/User-Agent'
      x-stoplight:
        id: a39b0ccb639cb
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  x-stoplight:
                    id: 8etz5eob70kcd
                  description: OAuth client ID provided by the business
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                      description: First name of the user
                    last_name:
                      type: string
                      description: Last name of the user
                    gender:
                      type: string
                      description: Gender of the user
                    external_source:
                      type: string
                      description: External source name (e.g., "Apple", "Salesforce", or whatever the
                        name of the user account source is)
                    external_source_id:
                      type: string
                      description: ID of the customer in the mentioned external source name (provided
                        in the `external_source` request parameter)
                    authorization_code:
                      type: string
                      description: Unique authorization code generated by Apple for every request (expires
                        after 5 minutes)
                    age_verified_status:
                      type: boolean
                      x-stoplight:
                        id: ms49bv8zek773
                      description: 'Whether or not the user has undergone age verification by Koupon Media.
                        Possible Values: true, false. The parameter is accepted in the request if Koupon
                        Media is selected as the age verification adapter for the business in the Punchh
                        platform. Contact your Punchh representative to update this configuration.'
                  required:
                  - first_name
                  - last_name
