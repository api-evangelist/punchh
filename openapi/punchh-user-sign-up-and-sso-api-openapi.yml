              examples:
                default:
                  value:
                    reset_password_token: RESET_PASSWORD_TOKEN_GOES_HERE
                    token_expire_at: '2016-02-26T23:36:38Z'
        '400':
          description: ''
      operationId: sso_Get_reset_password_token_of_the_user
