    post:
      responses:
        '200':
          description: The response returns basic details about the user account, including the access token that you must use to authenticate other API calls on the user's behalf.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: Security token that identifies the user
                    type: string
                  address_line1:
                    type: string
                    description: 'Address information (part 1) of the user

                      '
                  anniversary:
                    type: string
