                  birthday:
                    type: string
                    enum:
                    - YYYY-MM-DD
                    format: date
                    description: Birthday of the user, in YYYY-MM-DD format
                  city:
                    type: string
                    description: 'City where the user lives

                      '
                  created_at:
                    type: string
                    enum:
                    - YYYY-MM-DDThh:mm:ssZ
                    format: date-time
                    description: Date/time when the user was created in the system, in ISO 8601 format
                  email:
                    type: string
                    description: Email address of the user
                  email_verified:
                    type: boolean
                    description: Whether the email address is verified or not
                  fb_uid:
                    type: integer
