      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/content_type'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/Accept'
      tags:
      - User Sign-up and SSO
      description: ''
      x-stoplight:
        id: 5e3a4b08fd4ad
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
