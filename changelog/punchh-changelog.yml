gaps:
  - >-
    None of the 15 published OpenAPI documents carries a meaningful info.version
    (all are "1.0"), so a consumer cannot diff releases from the specs either.
  - >-
    The Redemptions 1.0 to Redemptions 2.0 migration — the largest live change on
    the Punchh API surface — is documented as separate "(Legacy)" and "(New)"
    specs and a tutorial track, but it has no changelog entry and no dated
    deprecation notice.
  - >-
    Product release news is published on the marketing blog
    (https://punchh.com/blog/) rather than the developer portal; the 2025 product
    release wrap-up post is the closest thing to an annual release note.
